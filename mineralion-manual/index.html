  const SCOPE_MARK = { in: '社内研修のみ', pt: 'パートナー研修まで', off: '公式の文面にも使える', med: '医療者向け' };
  const PILL = { '確定': 'ok', '足りている': 'ok', '完了': 'ok', '改訂が必要': 'rev', '進行中': 'rev' };
  const SIG = { red: ['sig-red', '赤', '言わない'], yellow: ['sig-yellow', '黄', '根拠を確かめる・条件つき'], blue: ['sig-blue', '青', '基本的に使える'] };

  const savedPage = store.get(STORE_PAGE);
  const ui = {
    page: PIX[savedPage] != null ? savedPage : 'cover',
    q: '', fk: '', fa: '', fs: '', ft: '', fsc: '', limit: 60, toc: false
  };
  let CUR = { d: base, ix: [], ids: new Set() };

  // ---------- helpers ----------
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  const verStr = (v) => (v ? v.major + '.' + v.minor : '');
  const fmtDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[1] + '.' + m[2] + '.' + m[3] : esc(s || ''); };
  const pill = (s) => (s ? '<span class="pill ' + (PILL[s] || '') + '">' + esc(s) + '</span>' : '');
  const sigPill = (lv) => { const s = SIG[lv] || SIG.yellow; return '<span class="sig ' + s[0] + '">' + s[1] + '</span>'; };
  const safeUrl = (u) => { const s = String(u || '').trim(); return /^https?:\/\//i.test(s) ? s : ''; };
  const focusSel = (sel) => { const el = document.querySelector(sel); if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } } };
  const isQO = (e) => e.kind === 'Q' || e.kind === 'O';
  const entryTitle = (e) => (isQO(e) ? e.q : e.title) || '';
  const kata2hira = (s) => s.replace(/[ァ-ヶ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  const nrm = (s) => kata2hira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s「」『』（）()［］\[\]、。・，．,.!?！？：:；;〜~\-－ー→]/g, '');
  const docOf = (d, id) => (d.docs6 || []).find((x) => x.id === id) || {};
  const pageOf = (id) => PAGES[PIX[id]];
  const pageTitle = (d, p) => p.title || docOf(d, p.ch).jp || '';
  const pageLabel = (d, p) => (p.no ? p.no + ' ' : '') + pageTitle(d, p);
  const pageOfEntry = (e) => (isQO(e) ? (e.sec === 'objection' ? 'c4b' : 'c4a') : (TSEC_PAGE[e.sec] || 'c5a'));
  const mark = (scope) => (SCOPE_MARK[scope] ? '<span class="mark">' + esc(SCOPE_MARK[scope]) + '</span>' : '');
  const waitMark = (f) => (f.status && f.status !== '確定' ? '<span class="wait">' + esc(f.status) + '</span>' : '');

  function entryText(e) {
    return [e.title, e.q, e.short, e.std, e.detail, e.text, (e.lines || []).map((l) => (l[0] || '') + ' ' + (l[1] || '')).join(' '), e.point, e.back].filter(Boolean).join(' ');
  }

  function buildIndex(d) {
    const items = [];
    d.brand.forEach((b) => items.push({ id: b.id, type: 'brand', kind: 'B', page: 'c1', title: b.title, text: (b.body || []).join(' ') + ' ' + (b.note || ''), src: b.src || '' }));
    d.facts.forEach((f) => items.push({ id: f.id, type: 'fact', kind: 'F', page: 'c2', title: f.label, text: f.value + ' ' + (f.note || ''), src: f.source || '' }));
    d.msg.forEach((m) => items.push({ id: m.id, type: 'msg', kind: 'A', page: 'c3', title: m.title, text: [m.text, m.hook, m.say, m.rtb, m.avoid, m.note].filter(Boolean).join(' '), src: '' }));
    d.entries.forEach((e) => items.push({ id: e.id, type: 'entry', kind: e.kind, page: pageOfEntry(e), title: entryTitle(e), text: entryText(e), src: e.src || '', origin: e.origin || '', e }));
    d.ng.forEach((n) => items.push({ id: n.id, type: 'ng', kind: 'N', page: 'c6', title: n.avoid, text: (n.say || '') + ' ' + (n.back || ''), src: n.src || '' }));
    d.expr.forEach((x) => items.push({ id: x.id, type: 'expr', kind: 'E', page: 'c6', title: x.expr, text: x.how || '', src: '' }));
    items.forEach((it) => { it.hayT = nrm(it.id + ' ' + it.title); it.hay = nrm(it.text); });
    return items;
  }

  function linkify(escaped) {
    const ids = CUR.ids;
    return escaped.replace(/(^|[^A-Za-z0-9])([BFAQOPTYWNE]\d{2,3})(?![0-9])/g, (m, pre, id) => (ids.has(id)
      ? pre + '<button type="button" class="idref" data-act="go" data-id="' + id + '" title="' + esc(titleOf(id)) + '">' + id + '</button>' : m));
  }
  const lk = (s) => linkify(esc(s));
  const titleOf = (id) => { const it = CUR.ix.find((x) => x.id === id); return it ? it.title : ''; };
  const idLink = (id) => '<button type="button" class="idref" data-act="go" data-id="' + esc(id) + '">' + esc(id) + '</button>';
  const refList = (head, ids) => ((ids || []).length ? '<ul class="reflist">' + (head ? '<li class="h">' + esc(head) + '</li>' : '') + ids.map((id) => '<li>' + idLink(id) + '<span>' + esc(titleOf(id)) + '</span></li>').join('') + '</ul>' : '');

  // ---------- search ----------
  function expandTok(tok, d) {
    const t = nrm(tok);
    const alts = new Set([t]);
    (d.keywords || []).forEach((k) => {
      const all = [k.w].concat(k.alt || []).map(nrm).filter(Boolean);
      if (all.includes(t)) all.forEach((a) => alts.add(a));
    });
    return Array.from(alts).filter(Boolean);
  }
  function search(d, ix) {
    const toks = String(ui.q || '').split(/[\s　]+/).filter(Boolean).map((t) => expandTok(t, d));
    const entryFacet = ui.fa || ui.fs || ui.ft || ui.fsc;
    const out = [];
    ix.forEach((it, order) => {
      if (ui.fk && it.kind !== ui.fk) return;
      if (entryFacet) {
        if (it.type !== 'entry') return;
        const e = it.e;
        if (ui.fa && !(e.aud || []).includes(ui.fa)) return;
        if (ui.fs && !(e.scene || []).includes(ui.fs)) return;
        if (ui.ft && !(e.topics || []).includes(ui.ft)) return;
        if (ui.fsc && e.scope !== ui.fsc) return;
      }
      let score = 0;
      for (const alts of toks) {
        let s = 0;
        if (alts.some((a) => it.hayT.includes(a))) s = 3;
        else if (alts.some((a) => it.hay.includes(a))) s = 1;
        if (!s) return;
        score += s;
      }
      out.push({ it, score, order });
    });
    out.sort((a, b) => (b.score - a.score) || (a.order - b.order));
    return out.map((x) => x.it);
  }

  // ---------- frame ----------
  function render() {
    const d = base;
    const ix = buildIndex(d);
    CUR = { d, ix, ids: new Set(ix.map((x) => x.id)) };
    const p = pageOf(ui.page);
    app.innerHTML = renderMast(d)
      + '<div class="bar"><div class="wrap bar-in"><button type="button" class="btn btn-small" data-act="toc-open" aria-haspopup="dialog">目次</button><span class="bar-title">' + esc(pageLabel(d, p)) + '</span></div></div>'
      + '<div class="wrap layout"><nav class="toc" aria-label="目次">' + tocHtml(d, 'tq') + '</nav>'
      + '<main class="page" id="main">' + renderPage(d, ix, p) + '</main></div>'
      + renderFoot(d)
      + (ui.toc ? '<div class="toc-sheet" id="toc-sheet" role="dialog" aria-modal="true" aria-label="目次"><div class="toc-panel"><div class="toc-close"><span>目次</span><button type="button" class="btn btn-small" data-act="toc-close">閉じる</button></div>' + tocHtml(d, 'tq2') + '</div></div>' : '');
  }

  function renderMast(d) {
    return '<header class="mast"><div class="wrap mast-in"><button type="button" class="brand" data-act="home" aria-label="表紙へ戻る" title="表紙へ戻る">'
      + '<img class="logo-light" src="' + C.logoNavy + '" alt="MINERALion" width="' + C.logoW + '" height="' + C.logoH + '">'
      + '<img class="logo-dark" src="' + C.logoWhite + '" alt="MINERALion" width="' + C.logoW + '" height="' + C.logoH2 + '">'
      + '<span class="brand-name">' + esc(C.brandName) + '</span></button>'
      + '<p class="meta"><span>ver.' + esc(verStr(d.version)) + '</span><span><span class="num">' + fmtDate(d.asOf) + '</span> 時点の最新版</span><span>' + esc(d.audienceLabel) + '</span><span>管理者：' + esc(d.admin.role) + ' ' + esc(d.admin.name) + '</span></p>'
      + '</div></header>';
  }

  function tocHtml(d, sid) {
    let h = '<div class="toc-search"><input type="search" id="' + sid + '" placeholder="言葉や番号で探す" aria-label="マニュアル全体を探す" autocomplete="off"><button type="button" class="btn btn-small" data-act="tsearch" data-src="' + sid + '">探す</button></div><ol>';
    let part = null; let ch = null;
    PAGES.forEach((p) => {
      if (p.part !== part) { part = p.part; if (p.id !== 'cover') h += '<li class="toc-g">' + esc(part) + '</li>'; }
      const sub = p.id.length === 3 && /^c[45]/.test(p.id);
      if (sub && p.ch !== ch) {
        const x = docOf(d, p.ch);
        h += '<li><button type="button" class="toc-a" data-act="page" data-to="' + p.id + '">' + esc(String(Number(x.no)) + ' ' + x.jp) + '</button></li>';
      }
      ch = p.ch;
      h += '<li><button type="button" class="toc-a' + (sub ? ' sub' : '') + '" data-act="page" data-to="' + p.id + '"' + (ui.page === p.id ? ' aria-current="page"' : '') + '>' + esc(pageLabel(d, p)) + '</button></li>';
    });
    return h + '</ol>';
  }

  function renderFoot(d) {
    return '<footer class="foot"><div class="wrap"><p>MINERALion ' + esc(C.brandName) + '　ver.' + esc(verStr(d.version)) + '（<span class="num">' + fmtDate(d.asOf) + '</span> 時点）　' + esc(d.audienceLabel) + '　管理者：' + esc(d.admin.role) + ' ' + esc(d.admin.name) + '</p></div></footer>';
  }

  // Teams で管理者との1対1のチャットを開く（送るのは押した人の Teams から）
  const teamsChat = (d, msg) => 'https://teams.microsoft.com/l/chat/0/0?users=' + encodeURIComponent(d.admin.email) + '&message=' + encodeURIComponent(msg);
  const MSG_HEAD = '【MINERALion マスターマニュアル】';
  const notice = (d, p) => (d.notice && d.notice.text
    ? '<aside class="notice" role="note"><p class="notice-t">' + esc(d.notice.text) + '</p>'
      + '<p class="notice-a"><a class="btn btn-primary" href="' + esc(teamsChat(d, MSG_HEAD + pageLabel(d, p) + '｜疑問・訂正：')) + '" target="_blank" rel="noopener noreferrer">疑問・訂正をTeamsで送る</a></p>'
      + '<p class="notice-c">' + esc(d.admin.role) + ' ' + esc(d.admin.name) + '　<a href="mailto:' + esc(d.admin.email) + '">' + esc(d.admin.email) + '</a></p></aside>' : '');
  const S = (id, title, html, lead, items) => ({ id, dom: 's-' + id, title, items: items || [], html: '<section class="s" id="s-' + id + '"><h2>' + esc(title) + '</h2>' + (lead ? '<p class="s-lead">' + lead + '</p>' : '') + html + '</section>' });
  const itemsOf = (list) => list.map((e) => ({ dom: 'it-' + e.id, title: entryTitle(e) }));

  function renderPage(d, ix, p) {
    const i = PIX[p.id];
    let crumb = p.part === 'はじめに' ? '' : p.part;
    if (p.ch && p.no.indexOf('-') > 0) { const x = docOf(d, p.ch); crumb += '　' + Number(x.no) + ' ' + x.jp; }
    if (crumb === p.no) crumb = '';
    const en = p.ch && p.no.indexOf('-') < 0 ? docOf(d, p.ch).en : '';
    let head = '';
    if (p.id !== 'cover') {
      head = '<header>' + (crumb ? '<p class="crumb">' + esc(crumb) + '</p>' : '')
        + '<h1 class="ptitle" id="ph" tabindex="-1">' + esc(pageLabel(d, p)) + '</h1>'
        + (p.lead ? '<p class="plead">' + esc(p.lead) + '</p>' : '')
        + (en ? '<p class="pmeta">' + esc(en) + '</p>' : '') + '</header>';
    }
    const secs = pageSecs(d, ix, p);
    let links = [];
    if (p.id !== 'cover') {
      if (secs.length >= 3) links = secs.map((s) => ({ dom: s.dom || ('s-' + s.id), title: s.title }));
      else { const its = []; secs.forEach((s) => (s.items || []).forEach((x) => its.push(x))); if (its.length >= 5) links = its; }
    }
    const ptoc = links.length
      ? '<nav class="ptoc" aria-label="このページの内容"><p class="ptoc-h">このページの内容</p><ol class="' + (links.length > 6 ? 'two' : '') + '">' + links.map((s) => '<li><button type="button" data-act="goto" data-to="' + esc(s.dom) + '">' + esc(s.title) + '</button></li>').join('') + '</ol></nav>' : '';
    const prev = PAGES[i - 1]; const next = PAGES[i + 1];
    const pager = '<nav class="pager" aria-label="前後のページ">'
      + (prev ? '<button type="button" class="pg" data-act="page" data-to="' + prev.id + '"><small>前へ</small><span>' + esc(pageLabel(d, prev)) + '</span></button>' : '<span></span>')
      + (next ? '<button type="button" class="pg next" data-act="page" data-to="' + next.id + '"><small>次へ</small><span>' + esc(pageLabel(d, next)) + '</span></button>' : '<span></span>') + '</nav>';
    return '<div class="' + (p.id === 'p1' ? 'p1' : '') + '">' + head + ptoc + secs.map((s) => s.html).join('') + '</div>' + (p.id === 'cover' ? '' : notice(d, p)) + pager;
  }

  function pageSecs(d, ix, p) {
    switch (p.id) {
      case 'cover': return pgCover(d);
      case 'p1': return pgP1(d);
      case 'c1': return pgBrand(d);
      case 'c2': return pgFacts(d);
      case 'c3': return pgMsg(d);
      case 'c4a': case 'c4b': return pgQO(d, p);
      case 'c6': return pgComp(d);
      case 'ax1': return pgIndex(d, ix);
      case 'ax2': return pgOps(d);
      default: return pgTalk(d, p);
    }
  }

  // ---------- shared item views ----------
  function lnRow(who, sayHtml, cls) {
    return '<div class="ln ' + (who ? (cls || 'staff') : 'nowho') + '">' + (who ? '<span class="who">' + esc(who) + '</span>' : '') + '<p class="say">' + sayHtml + '</p></div>';
  }
  function itemHead(title, id, extra) {
    return '<div class="it-h"><h3>' + esc(title) + '</h3><div class="it-side">' + (extra || '') + '<span class="it-id">' + esc(id) + '</span></div></div>';
  }
  function entItem(d, e) {
    let b = '';
    if (e.kind === 'T') b = '<div class="dlg">' + (e.lines || []).map((l) => lnRow(l[0], lk(l[1]), l[0] === 'お客様' ? 'cust' : 'staff')).join('') + '</div>';
    else if (isQO(e)) {
      b = '<div class="dlg">' + lnRow('短答', '<b>' + lk(e.short) + '</b>') + (e.std ? lnRow('標準回答', lk(e.std)) : '') + '</div>'
        + (e.detail ? '<details class="more"><summary>詳しく（聞かれたら）</summary><p>' + lk(e.detail) + '</p></details>' : '');
    } else b = '<p class="quote' + (e.kind === 'P' ? ' big' : '') + '">' + lk(e.text) + '</p>';
    if (e.point) b += '<p class="pt"><b>ポイント</b>' + lk(e.point) + '</p>';
    if (e.back) b += '<p class="bk"><b>裏の事実（社内）</b>' + lk(e.back) + '</p>';
    const cp = '<button type="button" class="cp" data-act="copy" data-id="' + esc(e.id) + '">コピー</button>'
      + '<a class="cp" href="' + esc(teamsChat(d, MSG_HEAD + e.id + ' ' + entryTitle(e) + '｜疑問・訂正：')) + '" target="_blank" rel="noopener noreferrer" title="Teamsで管理者に送る">疑問・訂正</a>';
    return '<article class="it' + (isQO(e) ? ' qa' : '') + '" id="it-' + esc(e.id) + '">' + itemHead(entryTitle(e), e.id, mark(e.scope) + cp) + b + '</article>';
  }
  function copyTextOf(id) {
    const d = base;
    const e = d.entries.find((x) => x.id === id);
    if (e) {
      if (e.kind === 'T') return (e.lines || []).map((l) => (l[0] ? l[0] + '：' : '') + l[1]).join('\n');
      if (isQO(e)) return e.std || e.short;
      return e.text;
    }
    const n = d.ng.find((x) => x.id === id);
    return n ? n.say : '';
  }
  function ngTable(list, withId) {
    return '<table class="tbl stack"><thead><tr>' + (withId ? '<th class="idc" scope="col">番号</th>' : '') + '<th scope="col">言わない</th><th scope="col">こう言う</th><th scope="col">裏の事実（社内）</th></tr></thead><tbody>'
      + list.map((n) => '<tr id="it-' + esc(n.id) + '">' + (withId ? '<td class="idc">' + esc(n.id) + '</td>' : '') + '<td class="ng-avoid" data-label="言わない">' + lk(n.avoid) + '</td><td class="ng-say" data-label="こう言う">' + lk(n.say) + '</td><td class="ng-back" data-label="裏の事実（社内）">' + lk(n.back) + '</td></tr>').join('')
      + '</tbody></table>';
  }
  const msgOne = (d, lv) => d.msg.find((m) => m.level === lv) || {};

  // ---------- cover ----------
  function pgCover(d) {
    const cnt = (() => {
      const k = {}; d.entries.forEach((e) => { k[e.kind] = (k[e.kind] || 0) + 1; });
      const fx = d.facts.filter((f) => f.status === '確定').length;
      return {
        c1: d.brand.length + '項目', c2: d.facts.length + '項目（確定' + fx + '・確定待ち' + (d.facts.length - fx) + '）', c3: d.msg.length + '項目',
        c4: '質問' + (k.Q || 0) + '・誤解と反論' + (k.O || 0), c5: 'トーク' + (k.T || 0) + '・ひとこと' + (k.P || 0) + '・たとえ' + (k.Y || 0) + '・文面' + (k.W || 0),
        c6: 'ルール' + d.rules5.length + '・表現' + d.expr.length + '・言い換え' + d.ng.length
      };
    })();
    const row = (to, n, t, r) => '<button type="button" class="chrow" data-act="page" data-to="' + to + '"><span class="n">' + esc(n) + '</span><span class="t">' + esc(t) + '</span><span class="r">' + esc(r) + '</span></button>';
    const ch = (pid, key, cid) => { const x = docOf(d, cid); return row(pid, String(Number(x.no)), x.jp, x.role + '｜' + cnt[key]); };
    const intro = '<section class="s" style="margin-top:8px"><h1 class="cover-h" id="ph" tabindex="-1">1つの事実を、全員が同じように説明できるように。</h1>'
      + '<p class="plead">MINERALionの基本資料6点を、1冊にまとめました。営業・PR・EC・展示会・海外まで、ここを原典にします。</p>'
      + notice(d, pageOf('cover'))
      + '<div class="search-row"><input class="search" id="hq" type="search" placeholder="例：妊娠中、鉄剤との違い、数十種類、T05" aria-label="マニュアル全体を探す" autocomplete="off"><button type="button" class="btn btn-primary" data-act="hsearch">探す</button></div></section>';
    const how = '<ol class="steps3">'
      + '<li><span class="n">1</span><span>まず「第1部 まずここだけ」を読みます。全員が、どの相手にも毎回守ることです。</span></li>'
      + '<li><span class="n">2</span><span>現場では、第2部の「4 質問と反論」「5 話し方」から、相手と場面に合う言い方を探します。</span></li>'
      + '<li><span class="n">3</span><span>迷ったら「6 表現ルール」に戻ります。それでも迷うときは、使う前に管理者に確かめます。</span></li></ol>'
      + '<p class="note">言い方には番号（例：T05、N21）がついています。番号で呼べば、全員が同じ言い方にたどり着けます。</p>';
    const toc = '<div class="chlist">' + row('p1', '第1部', 'まずここだけ', '全員が、どの相手にも毎回守ること')
      + ch('c1', 'c1', 'd01') + ch('c2', 'c2', 'd02') + ch('c3', 'c3', 'd03') + ch('c4a', 'c4', 'd04') + ch('c5a', 'c5', 'd05') + ch('c6', 'c6', 'd06')
      + row('ax1', '付録1', '索引', '言葉・番号・相手・場面から引く') + row('ax2', '付録2', '整備・更新履歴', '進み具合と版の記録') + '</div>'
      + '<p class="note">数字と表記は「2 商品の事実」が正本です。ほかの章はすべて、ここに合わせています。</p>';
    return [{ id: 'intro', title: '表紙', html: intro }, S('howto', 'このマニュアルの使い方', how), S('contents', '目次', toc)];
  }

  // ---------- part 1 ----------
  function pgP1(d) {
    const core = msgOne(d, 'core'); const key = msgOne(d, 'key');
    const bkeys = d.brand.filter((b) => b.key && !(b.body || []).some((x) => core.text && x.indexOf(core.text) >= 0));
    const fkeys = d.facts.filter((f) => f.key);

    out.push(S('brand', 'ブランドの要点', '<table class="tbl stack"><tbody>' + bkeys.map((b) => '<tr id="it-' + esc(b.id) + '"><td class="k">' + esc(b.title) + '</td><td>' + (b.body || []).map((x, i) => (i ? '<span class="sub">' + lk(x) + '</span>' : lk(x))).join('') + '</td></tr>').join('') + '</tbody></table>'));
    out.push(S('facts', '覚えておく事実', '<table class="tbl stack"><thead><tr><th scope="col">項目</th><th scope="col">値・表記</th></tr></thead><tbody>' + fkeys.map((f) => '<tr id="it-' + esc(f.id) + '"><td class="k">' + esc(f.label) + waitMark(f) + '</td><td>' + lk(f.value) + (f.note ? '<span class="sub">' + lk(f.note) + '</span>' : '') + '</td></tr>').join('') + '</tbody></table>', '「確定待ち」の印がある項目は、言い切りません。数字はこの表と「2 商品の事実」だけから引きます。'));
    out.push(S('rules', '5つのルール', '<ol class="rules5">' + d.rules5.map((r) => '<li><b>' + esc(r.title) + '</b><span class="r">' + lk(r.rule) + '</span></li>').join('') + '</ol>'));
    out.push(S('ng', '言わないこと', ngTable(ngCore, false), '口に出すのは「こう言う」の言葉です。裏の事実は、背景として知っておくためのものです。'));
    out.push(S('faq', 'よく聞かれる質問', '<table class="tbl stack"><thead><tr><th scope="col">質問</th><th scope="col">短答</th></tr></thead><tbody>' + qkeys.map((e) => '<tr><td class="k">' + idLink(e.id) + ' ' + esc(e.q) + '</td><td>' + lk(e.short) + '</td></tr>').join('') + '</tbody></table>', '番号を押すと、標準回答と詳しい説明に進みます。'));
    out.push(S('talk', '最初に覚える話し方', tkeys.map((e) => entItem(d, e)).join('')));

  }

  // ---------- 1 brand ----------
  function pgBrand(d) {
    return d.brand.map((b) => ({ id: b.id, dom: 'it-' + b.id, title: b.title, html: '<section class="s" id="it-' + esc(b.id) + '"><div class="it-h" style="border-bottom:1px solid var(--strong-line);padding-bottom:8px"><h2 style="font-size:21px">' + esc(b.title) + '</h2><span class="it-id">' + esc(b.id) + '</span></div><div class="prose">' + (b.body || []).map((x) => '<p>' + lk(x) + '</p>').join('') + '</div>' + (b.note ? '<p class="note">' + lk(b.note) + '</p>' : '') + '</section>' }));
  }

  // ---------- 2 facts ----------
  function pgFacts(d) {
    const rows = (d.minerals && d.minerals.rows) || [];

      const list = d.facts.filter((f) => f.sec === s.id);
      let h = '<table class="tbl stack"><thead><tr><th class="idc" scope="col">番号</th><th scope="col">項目</th><th scope="col">値・表記</th><th scope="col">出典</th></tr></thead><tbody>'
        + list.map((f) => '<tr id="it-' + esc(f.id) + '"><td class="idc">' + esc(f.id) + '</td><td class="k">' + esc(f.label) + waitMark(f) + '</td><td>' + lk(f.value) + (f.note ? '<span class="sub">' + lk(f.note) + '</span>' : '') + '</td><td data-label="出典" style="font-size:13px;color:var(--muted)">' + esc(f.source || '') + '</td></tr>').join('') + '</tbody></table>';

        h += '<details class="more"><summary>代表ロットの分析値（' + rows.length + '元素）</summary><table class="tbl"><thead><tr><th scope="col">元素</th><th scope="col">記号</th><th scope="col">1包あたり（μg）</th></tr></thead><tbody>'

      }

    });
    const dead = d.fixes.filter((x) => x.kind === '廃番');
    const docsH = '<table class="tbl stack"><thead><tr><th scope="col">資料</th><th scope="col">版</th><th scope="col">直す予定</th><th scope="col">リンク</th></tr></thead><tbody>' + d.docs.map((doc) => {
      const fx = doc.fix ? d.fixes.find((x) => x.id === doc.fix) : null;

    }).join('') + '</tbody></table>'
      + (dead.length ? '<h3 style="margin-top:28px;font-size:17px">使わない資料（廃番）</h3><table class="tbl stack"><thead><tr><th scope="col">資料</th><th scope="col">使えない記載</th></tr></thead><tbody>' + dead.map((x) => '<tr><td class="k">' + esc(x.name) + '</td><td data-label="使えない記載">' + esc(x.action) + '</td></tr>').join('') + '</tbody></table>' : '');
    out.push(S('docs', '原典の資料と、使わない資料', docsH));
    return out;
  }

  // ---------- 3 message ----------

      + '<div class="l4" id="it-' + esc(ben.id || '') + '"><span class="k">お客様にとっての価値（Benefit）</span><span class="v">' + esc(ben.text || '') + '</span>' + (ben.note ? '<span class="sub" style="display:block;font-size:13px">' + lk(ben.note) + '</span>' : '') + '</div></div>'

  // ---------- 4 Q&A ----------
  function pgQO(d, p) {
    const list = d.entries.filter((e) => isQO(e) && (p.qo === 'o' ? e.sec === 'objection' : e.sec !== 'objection'));
    const secs = d.qsecs.filter((s) => (p.qo === 'o' ? s.id === 'objection' : s.id !== 'objection'));
    const out = [];
    secs.forEach((s) => { const l = list.filter((e) => e.sec === s.id); if (l.length) out.push(S(s.id, s.label, l.map((e) => entItem(d, e)).join(''), '', itemsOf(l))); });
    return out;
  }

  // ---------- 5 talk ----------
  function pgTalk(d, p) {
    const out = [];
    (p.secs || []).forEach((sid) => {
      const s = d.tsecs.find((x) => x.id === sid) || { id: sid, label: sid, desc: '' };
      const l = d.entries.filter((e) => !isQO(e) && e.sec === sid);
      if (l.length) out.push(S(sid, s.label, l.map((e) => entItem(d, e)).join(''), s.desc ? esc(s.desc) : '', itemsOf(l)));
    });
    return out;
  }

  // ---------- 6 compliance ----------
  function pgComp(d) {
    const ngBy = (r) => d.ng.filter((n) => n.rule === r);

      + ((r.points || []).length ? '<ul class="pt" style="padding-left:1.2em">' + r.points.map((x) => '<li>' + lk(x) + '</li>').join('') + '</ul>' : '')
      + (r.contact ? '<p class="contact"><span>' + esc(d.admin.role) + ' ' + esc(d.admin.name) + '</span><a href="mailto:' + esc(d.admin.email) + '">' + esc(d.admin.email) + '</a></p>' : '')
      + (ngBy(r.id).length ? '<p class="refs"><button type="button" class="idref" data-act="goto" data-to="s-ng-' + esc(r.id) + '">このルールの言い換え（' + ngBy(r.id).length + '件）</button></p>' : '') + '</article>').join('');
    const ladder = '<table class="tbl stack"><thead><tr><th scope="col">段階</th><th scope="col">どこで</th><th scope="col">使えるもの</th><th scope="col">注意</th></tr></thead><tbody>'
      + d.scopeLadder.map((s) => '<tr><td class="k">' + esc(s.who) + '</td><td data-label="どこで">' + esc(s.what) + '</td><td data-label="使えるもの">' + esc(s.ok) + '</td><td data-label="注意">' + esc(s.ng) + '</td></tr>').join('') + '</tbody></table>'
      + '<p class="note">このマニュアルでは、「生活者に話す」以外の項目に印を付けています：' + Object.keys(SCOPE_MARK).map((k) => '<span class="mark" style="margin:0 4px">' + esc(SCOPE_MARK[k]) + '</span>').join('') + '</p>';
    const legend = '<div class="sigbox">' + ['red', 'yellow', 'blue'].map((lv) => '<div>' + sigPill(lv) + '<p style="margin-top:4px">' + SIG[lv][2] + '</p></div>').join('') + '</div>';
    const exprT = (lv) => { const l = d.expr.filter((x) => x.level === lv); return l.length ? '<h3 style="margin-top:28px;font-size:17px">' + sigPill(lv) + '　' + esc(SIG[lv][2]) + '（' + l.length + '）</h3><table class="tbl stack"><thead><tr><th class="idc" scope="col">番号</th><th scope="col">表現</th><th scope="col">' + ({ red: '代わりに・注意', yellow: '使うときの条件', blue: '使い方' })[lv] + '</th></tr></thead><tbody>'
      + l.map((x) => '<tr id="it-' + esc(x.id) + '"><td class="idc">' + esc(x.id) + '</td><td class="k">' + esc(x.expr) + '</td><td>' + lk(x.how || '') + ((x.refs || []).length ? '<span class="sub">関連：' + x.refs.map(idLink).join('・') + '</span>' : '') + '</td></tr>').join('') + '</tbody></table>' : ''; };
    const out = [S('rules', '5つのルール', rules), S('ladder', '言える範囲', ladder, '研修で学んだ根拠や比較は、お客様にそのまま言いません。'),
      S('expr', '表現の信号（赤・黄・青）', legend + exprT('red') + exprT('yellow') + exprT('blue'), '迷う表現は黄として扱い、使う前に管理者に確かめます。')];
    d.rules5.forEach((r, i) => { const l = ngBy(r.id); if (l.length) out.push(S('ng-' + r.id, '言い換え：ルール' + (i + 1) + '　' + r.title, ngTable(l, true), i === 0 ? '口に出すのは「こう言う」の言葉です。裏の事実は、背景として知っておくためのものです。' : '')); });
    out.push(S('channel', 'チャネル別の注意', '<table class="tbl stack"><tbody>' + d.channelRules.map((c) => '<tr><td class="k">' + esc(c.title) + '</td><td>' + lk(c.text) + '</td></tr>').join('') + '</tbody></table>'));
    return out;
  }

  // ---------- appendix 1: index ----------
  const ROWS = [['あ', 'あいうえおぁぃぅぇぉゔ'], ['か', 'かきくけこがぎぐげご'], ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでどっ'], ['な', 'なにぬねの'], ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'], ['ま', 'まみむめも'], ['や', 'やゆよゃゅょ'], ['ら', 'らりるれろ'], ['わ', 'わをん']];
  function pgIndex(d, ix) {
    const sel = (id, label, list, cur) => '<label>' + label + '<select id="' + id + '"><option value="">すべて</option>' + list.map((x) => '<option value="' + esc(x.id) + '"' + (x.id === cur ? ' selected' : '') + '>' + esc(x.label) + '</option>').join('') + '</select></label>';
    const kinds = Object.keys(KIND_ALL).map((k) => ({ id: k, label: k + ' ' + KIND_ALL[k] }));
    const top = '<div class="search-row" style="max-width:none"><input class="search" id="q" type="search" placeholder="例：妊娠中、鉄剤との違い、数十種類、T05" aria-label="マニュアル全体を探す" value="' + esc(ui.q) + '" autocomplete="off"></div>'
      + '<div class="facets">' + sel('f-k', '種類', kinds, ui.fk) + sel('f-a', '相手', d.auds, ui.fa) + sel('f-s', '場面', d.scenes, ui.fs) + sel('f-t', 'テーマ', d.topics, ui.ft) + sel('f-sc', '言える範囲', d.scopes, ui.fsc) + '</div>'
      + '<div id="ixdyn">' + ixDyn(d, ix) + '</div>';
    return [{ id: 'search', title: '探す', html: '<section class="s" id="s-search" style="margin-top:28px">' + top + '</section>' }];
  }
  const anyFilter = () => !!(ui.q || ui.fk || ui.fa || ui.fs || ui.ft || ui.fsc);
  function ixDyn(d, ix) {
    if (anyFilter()) {
      const res = search(d, ix);
      const shown = res.slice(0, ui.limit);
      return '<p class="count-line" role="status"><span>' + res.length + '件' + (res.length > shown.length ? '（' + shown.length + '件を表示）' : '') + '</span><button type="button" class="btn btn-small" data-act="clearf">条件をはずす</button></p>'
        + (res.length ? '<ul class="res">' + shown.map((it) => resRow(d, it)).join('') + '</ul>' : '<p class="empty">見つかりませんでした。言葉を短くするか、条件をはずしてください。</p>')
        + (res.length > shown.length ? '<p style="margin-top:12px"><button type="button" class="btn btn-small" data-act="moreres">さらに表示</button></p>' : '');
    }
    return kanaIndex(d, ix) + facetIndex(d, 'fa', '相手から引く', d.auds, 'aud') + facetIndex(d, 'fs', '場面から引く', d.scenes, 'scene') + facetIndex(d, 'ft', 'テーマから引く', d.topics, 'topics') + idIndex(d, ix);
  }
  function resRow(d, it) {
    const snip = it.type === 'entry' ? (isQO(it.e) ? it.e.short : (it.e.text || ((it.e.lines || [])[0] || [])[1] || '')) : it.type === 'ng' ? 'こう言う：' + ((d.ng.find((n) => n.id === it.id) || {}).say || '') : it.text;
    const s = String(snip || '');
    return '<li><button type="button" data-act="go" data-id="' + esc(it.id) + '"><span class="rid">' + esc(it.id) + '</span><span class="rt">' + esc(it.title) + '</span><span class="rp">' + esc(pageLabel(d, pageOf(it.page))) + (s ? '　' + esc(s.slice(0, 70)) + (s.length > 70 ? '…' : '') : '') + '</span></button></li>';
  }
  function kanaIndex(d, ix) {
    const groups = {};
    (d.keywords || []).forEach((k) => {
      const first = kata2hira(String(k.yomi || k.w).normalize('NFKC')).charAt(0);
      let row = '英数';
      ROWS.forEach((r) => { if (r[1].includes(first)) row = r[0]; });
      const alts = [k.w].concat(k.alt || []).map(nrm).filter(Boolean);
      const n = ix.filter((it) => alts.some((a) => it.hayT.includes(a) || it.hay.includes(a))).length;
      if (!n) return;
      (groups[row] = groups[row] || []).push({ w: k.w, yomi: k.yomi, n });
    });
    const order = ROWS.map((r) => r[0]).concat(['英数']);
    return '<h2 style="margin-top:36px;font-size:19px">五十音で引く</h2><p class="s-lead">言葉を押すと、その言葉と言い換えを含む項目が出ます。</p><div class="kana">'
      + order.filter((r) => groups[r]).map((r) => '<div class="kana-row"><span class="kana-h">' + r + '</span><div class="kws">' + groups[r].sort((a, b) => String(a.yomi).localeCompare(String(b.yomi), 'ja')).map((k) => '<button type="button" class="kw" data-act="kw" data-w="' + esc(k.w) + '">' + esc(k.w) + '<small class="num">' + k.n + '</small></button>').join('') + '</div></div>').join('') + '</div>';
  }
  function facetIndex(d, f, title, list, field) {
    return '<h2 style="margin-top:36px;font-size:19px">' + esc(title) + '</h2><div class="kws" style="margin-top:12px">' + list.map((x) => {
      const n = d.entries.filter((e) => (e[field] || []).includes(x.id)).length;
      return n ? '<button type="button" class="kw" data-act="facet" data-f="' + f + '" data-v="' + esc(x.id) + '">' + esc(x.label) + '<small class="num">' + n + '</small></button>' : '';
    }).join('') + '</div>';
  }
  function idIndex(d, ix) {
    const groups = [['c1', 'd01'], ['c2', 'd02'], ['c3', 'd03'], ['c4', 'd04'], ['c5', 'd05'], ['c6', 'd06']];
    return '<h2 style="margin-top:36px;font-size:19px">番号一覧</h2><p class="s-lead">章ごとの番号と、もとにした資料（出典）・由来。</p>' + groups.map((g) => {
      const x = docOf(d, g[1]); const list = ix.filter((it) => it.page.indexOf(g[0]) === 0);
      return '<details class="blk"><summary>' + esc(Number(x.no) + ' ' + x.jp + '（' + list.length + '）') + '</summary><table class="tbl stack"><thead><tr><th class="idc" scope="col">番号</th><th scope="col">見出し</th><th scope="col">出典・由来</th></tr></thead><tbody>'
        + list.map((it) => '<tr><td class="idc">' + idLink(it.id) + '</td><td>' + esc(it.title) + '</td><td data-label="出典・由来" style="font-size:13px;color:var(--muted)">' + esc([it.src, it.origin].filter(Boolean).join('｜')) + '</td></tr>').join('') + '</tbody></table></details>';
    }).join('');
  }
  function refreshIx() { const dyn = document.getElementById('ixdyn'); if (dyn) dyn.innerHTML = ixDyn(CUR.d, CUR.ix); }

  // ---------- appendix 2: maintenance ----------
  function pgOps(d) {
    const st = [
      ['正本の確定', d.facts.filter((f) => f.status === '確定').length, d.facts.length, '項目'],
      ['相手別で足りている', d.audiences.filter((a) => a.status === '足りている').length, d.audiences.length, '相手'],
      ['着手順の完了', d.roadmap.filter((r) => r.status === '完了').length, d.roadmap.length, '件'],
      ['改訂と廃番の完了', d.fixes.filter((x) => x.status === '完了').length, d.fixes.length, '件']
    ];
    const stats = '<div class="stats">' + st.map((s) => '<div class="stat"><p>' + s[0] + '</p><p><span class="big num">' + s[1] + '</span> / <span class="num">' + s[2] + '</span>' + s[3] + '</p></div>').join('') + '</div>';
    const covOf = (aid) => d.entries.filter((e) => (e.cov || []).includes(aid)).map((e) => e.id);
    const cov = d.groups.map((g) => {
      const rows = d.audiences.filter((a) => a.group === g.id); if (!rows.length) return '';
      return '<h3 style="margin-top:24px;font-size:17px">' + esc(g.label) + '（' + rows.length + '）</h3><table class="tbl stack"><thead><tr><th scope="col">相手</th><th scope="col">いまあるもの</th><th scope="col">足すもの</th><th scope="col">状態</th></tr></thead><tbody>'
        + rows.map((a) => { const c = covOf(a.id); const links = (a.links || []).filter((l) => safeUrl(l.url));
          return '<tr><td class="k">' + esc(a.name) + '</td><td data-label="いまあるもの">' + esc(a.existing || 'なし') + (links.length ? '<span class="sub">' + links.map((l) => '<a href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + '</a>').join('　') + '</span>' : '') + (c.length ? '<span class="sub">使う番号：' + c.map(idLink).join('・') + '</span>' : '') + '</td><td data-label="足すもの">' + esc(a.add || 'なし') + (a.memo ? '<span class="sub">' + esc(a.memo) + '</span>' : '') + '</td><td data-label="状態">' + pill(a.status) + '</td></tr>'; }).join('') + '</tbody></table>';
    }).join('');
    const parts = '<table class="tbl stack"><thead><tr><th scope="col">部品</th><th scope="col">説明</th><th scope="col">状態</th></tr></thead><tbody>' + d.parts.map((p) => '<tr><td class="k">' + esc(p.name) + '</td><td data-label="説明">' + esc(p.desc || '') + ((p.refs || []).length ? '<span class="sub">例：' + p.refs.map(idLink).join('・') + '</span>' : '') + '</td><td data-label="状態">' + pill(p.status) + '</td></tr>').join('') + '</tbody></table>';
    const road = '<table class="tbl stack"><thead><tr><th class="idc" scope="col">順</th><th scope="col">内容</th><th scope="col">状態</th></tr></thead><tbody>' + d.roadmap.map((r, i) => '<tr><td class="idc">' + (i + 1) + '</td><td data-label="内容"><b style="font-weight:600">' + esc(r.title) + '</b>' + (r.memo ? '<span class="sub">' + lk(r.memo) + '</span>' : '') + '</td><td data-label="状態">' + pill(r.status) + '</td></tr>').join('') + '</tbody></table>';
    const fixes = '<table class="tbl stack"><thead><tr><th scope="col">資料</th><th scope="col">種類</th><th scope="col">内容</th><th scope="col">状態</th></tr></thead><tbody>' + d.fixes.map((x) => '<tr><td class="k">' + esc(x.name) + '</td><td data-label="種類">' + esc(x.kind) + '</td><td data-label="内容">' + (x.kind === '廃番' ? '使えない記載：' : '') + esc(x.action) + (x.memo ? '<span class="sub">' + esc(x.memo) + '</span>' : '') + '</td><td data-label="状態">' + pill(x.status) + '</td></tr>').join('') + '</tbody></table>';
    const opsr = '<table class="tbl stack"><tbody>' + d.rules.map((r) => '<tr><td class="k">' + esc(r.title) + '</td><td>' + lk(r.text) + '</td></tr>').join('') + '</tbody></table>';
    const edits = d.entries.filter((e) => e.edit);
    const memo = '<table class="tbl stack"><thead><tr><th class="idc" scope="col">番号</th><th scope="col">見出し</th><th scope="col">既存資料から変えたこと</th></tr></thead><tbody>' + edits.map((e) => '<tr><td class="idc">' + idLink(e.id) + '</td><td>' + esc(entryTitle(e)) + '</td><td data-label="既存資料から変えたこと">' + lk(e.edit) + '</td></tr>').join('') + '</tbody></table>';
    const hist = '<ol class="hist">' + (d.history || []).map((h) => '<li><p><span class="hv">ver.' + esc(h.v) + '</span><span class="num">' + fmtDate(h.at) + '</span>　' + esc(h.by) + '</p><p style="margin-top:6px">' + esc(h.summary) + '</p>' + (h.changes && h.changes.length ? '<ul>' + h.changes.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul>' : '') + '</li>').join('') + '</ol>';
    return [S('stats', '進み具合', stats), S('cov', '相手別の網羅', cov, '関係人口ごとに、いまある資料と、このマニュアルで使う番号。'), S('parts', '共通の部品', parts), S('road', '着手順', road, '上から順に進めます。'),
      S('fixes', '資料の改訂と廃番', fixes, '正本に合わせて直す資料と、使わなくする資料。'), S('opsr', '運用ルール', opsr), S('memo', '編集メモ', memo, '既存資料の言い方を、このマニュアルで変えた箇所と理由。'),
      S('hist', '更新履歴', hist, '新しい版が上。小さな更新は1.0→1.1、大きな改訂は1.0→2.0のように上げます。公開のたびに、変更点が自動で記録されます。')];
  }

  // ---------- navigation ----------
  function smooth() { try { return !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
  function setPage(id, opts) {
    if (PIX[id] == null) return;
    ui.page = id; ui.toc = false; document.body.style.overflow = ''; store.set(STORE_PAGE, id);
    render();
    if (!(opts && opts.noScroll)) {
      const mast = app.querySelector('.mast');
      const top = mast ? mast.getBoundingClientRect().bottom + window.scrollY : 0;
      if (window.scrollY > top) window.scrollTo(0, top);
      focusSel('#ph');
    }
  }
  function gotoSec(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: smooth() ? 'smooth' : 'auto', block: 'start' }); }
  function goItem(id) {
    const it = CUR.ix.find((x) => x.id === id); if (!it) return;
    setPage(it.page, { noScroll: true });
    const el = document.getElementById('it-' + id);
    if (el) {
      el.scrollIntoView({ block: 'start' });
      el.classList.add('flash'); setTimeout(() => { if (el.isConnected) el.classList.remove('flash'); }, 1700);
    }
  }
  function runSearch(q) { ui.q = q || ''; ui.fk = ''; ui.fa = ''; ui.fs = ''; ui.ft = ''; ui.fsc = ''; ui.limit = 60; setPage('ax1'); focusSel('#q'); }
  function setFacet(f, v) { ui.q = ''; ui.fk = ''; ui.fa = ''; ui.fs = ''; ui.ft = ''; ui.fsc = ''; ui[f] = v; ui.limit = 60; setPage('ax1'); }
  async function copyText(text, btn) {
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (!ok) {
      try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e) { ok = false; }
    }
    const old = btn.textContent;
    btn.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
    setTimeout(() => { if (btn.isConnected) btn.textContent = old; }, 2000);
  }
  function openToc() { ui.toc = true; keepScroll(render); document.body.style.overflow = 'hidden'; focusSel('#toc-sheet [aria-current="page"]'); }
  function closeToc() { ui.toc = false; document.body.style.overflow = ''; const s = document.getElementById('toc-sheet'); if (s) s.remove(); focusSel('[data-act="toc-open"]'); }
  function clearFilters() { ui.q = ''; ui.fk = ''; ui.fa = ''; ui.fs = ''; ui.ft = ''; ui.fsc = ''; ui.limit = 60; }

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t && t.id === 'toc-sheet') { closeToc(); return; }
    const b = t && t.closest ? t.closest('[data-act]') : null; if (!b) return;
    switch (b.dataset.act) {
      case 'page': setPage(b.dataset.to); break;
      case 'home': setPage('cover', { noScroll: true }); window.scrollTo(0, 0); focusSel('#ph'); break;
      case 'goto': gotoSec(b.dataset.to); break;
      case 'go': goItem(b.dataset.id); break;
      case 'toc-open': openToc(); break;
      case 'toc-close': closeToc(); break;
      case 'copy': copyText(copyTextOf(b.dataset.id), b); break;
      case 'facet': setFacet(b.dataset.f, b.dataset.v); break;
      case 'kw': ui.q = b.dataset.w; ui.limit = 60; { const q = document.getElementById('q'); if (q) q.value = ui.q; } refreshIx(); break;
      case 'clearf': clearFilters(); keepScroll(render); break;
      case 'moreres': ui.limit += 60; refreshIx(); break;
      case 'hsearch': { const hq = document.getElementById('hq'); runSearch(hq ? hq.value : ''); break; }
      case 'tsearch': { const el = document.getElementById(b.dataset.src); runSearch(el ? el.value : ''); break; }
      default: break;
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.id === 'q') { ui.q = t.value; ui.limit = 60; refreshIx(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target; if (!t) return;
    const map = { 'f-k': 'fk', 'f-a': 'fa', 'f-s': 'fs', 'f-t': 'ft', 'f-sc': 'fsc' };
    if (map[t.id]) { ui[map[t.id]] = t.value; ui.limit = 60; refreshIx(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ui.toc) { closeToc(); return; }
    if (e.key === 'Enter' && e.target) {
      const id = e.target.id;
      if (id === 'hq' || id === 'tq' || id === 'tq2') { e.preventDefault(); runSearch(e.target.value); }
    }
  });

  render();
})();</script>
