<title>MINERALion マスターマニュアル</title><meta name="robots" content="noindex, nofollow"><meta name="description" content="MINERALionの基本資料6点を、1冊にまとめました。営業・PR・EC・展示会・海外まで、ここを原典にします。"><meta property="og:type" content="website"><meta property="og:site_name" content="MINERALion"><meta property="og:title" content="MINERALion マスターマニュアル"><meta property="og:description" content="MINERALionの基本資料6点を、1冊にまとめました。営業・PR・EC・展示会・海外まで、ここを原典にします。"><meta property="og:url" content="https://claude.ai/artifact/2xhueNwPwD93QYPA8hSefk"><meta property="og:locale" content="ja_JP"><meta name="twitter:card" content="summary"><style id="hub-style">@font-face{font-family:"MION Gothic";font-style:normal;font-weight:400;src:local("Yu Gothic Medium"),local("YuGothic-Medium"),local("Yu Gothic"),local("YuGothic-Regular")}
@font-face{font-family:"MION Gothic";font-style:normal;font-weight:600;src:local("Yu Gothic UI Semibold"),local("YuGothicUI-Semibold"),local("Yu Gothic Medium"),local("YuGothic-Medium")}
:root{
  /* Layout: a booklet. Left column is the table of contents (sticky on wide screens, a sheet on phones); right column is one page of the manual at a time, max ~44em of text. Colors are only the MINERALion Design Guideline ver.1 palette; navy #0033AD is the single accent. The red/yellow signal colors appear only in the Compliance chapter, as the brand manager asked. */
  --bg:#FFFFFF;--paper:#FFFFFF;--text:#000000;--muted:#585858;--line:#DCE0E0;--strong-line:#000000;
  --accent:#0033AD;--navy:#0033AD;--on-navy:#FFFFFF;--tint:#E9F2FF;--tint-text:#000000;--gray:#DCE0E0;
  --inv-bg:#0033AD;--inv-text:#FFFFFF;--overlay:rgba(0,0,0,.45);
  --sig-red:#B42318;--sig-red-bg:#FDECEA;--sig-yel:#8A4B00;--sig-yel-bg:#FFF4D6;--flash:#E9F2FF;
  --logo-light:inline-block;--logo-dark:none;--bar:#0033AD;
  --font-jp:"MION Gothic","Yu Gothic Medium","游ゴシック Medium",YuGothic,"游ゴシック体","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif;
  --font-label:"Instrument Sans","Helvetica Neue",Helvetica,Arial,"MION Gothic",YuGothic,"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-num:"Helvetica Neue",Helvetica,Arial,"MION Gothic",YuGothic,"Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000;--paper:#000000;--text:#FFFFFF;--muted:#DCE0E0;--line:#585858;--strong-line:#FFFFFF;--accent:#E9F2FF;--navy:#0033AD;--on-navy:#FFFFFF;--tint:#0033AD;--tint-text:#FFFFFF;--gray:#585858;--inv-bg:#FFFFFF;--inv-text:#0033AD;--overlay:rgba(0,0,0,.7);--sig-red:#FF9C94;--sig-red-bg:#3A1210;--sig-yel:#FFD27A;--sig-yel-bg:#332400;--flash:#0033AD;--logo-light:none;--logo-dark:inline-block;--bar:#E9F2FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--paper:#000000;--text:#FFFFFF;--muted:#DCE0E0;--line:#585858;--strong-line:#FFFFFF;--accent:#E9F2FF;--navy:#0033AD;--on-navy:#FFFFFF;--tint:#0033AD;--tint-text:#FFFFFF;--gray:#585858;--inv-bg:#FFFFFF;--inv-text:#0033AD;--overlay:rgba(0,0,0,.7);--sig-red:#FF9C94;--sig-red-bg:#3A1210;--sig-yel:#FFD27A;--sig-yel-bg:#332400;--flash:#0033AD;--logo-light:none;--logo-dark:inline-block;--bar:#E9F2FF;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-jp);font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:600;font-synthesis:none;margin:0;letter-spacing:.02em;line-height:1.5;word-break:auto-phrase;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:32px}}
.boot{padding-block:48px;color:var(--muted)}
/* masthead */
.mast{border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:18px}
.brand{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.brand img{width:160px;height:auto;flex:none}
.logo-light{display:var(--logo-light)}.logo-dark{display:var(--logo-dark)}
.brand-name{font-size:17px;letter-spacing:.06em}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
@media (min-width:720px){.mast-in .meta{margin-left:auto}}
/* mobile bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:8px}
.bar-title{font-size:14px;font-weight:600;font-synthesis:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:980px){.bar{display:none}}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:980px){.layout{grid-template-columns:250px minmax(0,1fr);gap:48px}}
.toc{display:none}
@media (min-width:980px){.toc{display:block;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding-block:28px 40px;border-right:1px solid var(--line);padding-right:20px}}
.toc-sheet{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex}
.toc-sheet .toc-panel{background:var(--bg);width:min(320px,88vw);height:100%;overflow:auto;padding:16px 18px 40px}
.toc-close{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-synthesis:none}
.toc-search{display:flex;gap:6px;margin-bottom:16px}
.toc-search input{flex:1;min-width:0;border:1px solid var(--muted);border-radius:6px;padding:7px 10px;background:var(--bg);font-size:14px}
.toc ol,.toc-panel ol{list-style:none;margin:0;padding:0}
.toc-g{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.toc-a{appearance:none;display:block;width:100%;text-align:left;background:none;border:0;padding:5px 0 5px 10px;border-left:2px solid transparent;font-size:14px;line-height:1.55;color:var(--text);cursor:pointer}
.toc-a.sub{padding-left:24px;font-size:13px;color:var(--muted)}
.toc-a[aria-current="page"]{border-left-color:var(--navy);color:var(--accent);font-weight:600;font-synthesis:none}
.toc-a.sub[aria-current="page"]{color:var(--accent)}
.toc-a:hover{color:var(--accent)}
/* page */
.page{min-width:0;padding-block:32px 72px;max-width:820px}
@media (min-width:980px){.page{padding-block:40px 96px}}
.crumb{font-size:13px;color:var(--muted)}
.ptitle{font-size:26px;margin-top:4px}
@media (min-width:720px){.ptitle{font-size:30px}}
.plead{margin-top:10px;color:var(--muted);max-width:40em}
.pmeta{margin-top:8px;font-size:12px;color:var(--muted)}
.ptoc{margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.ptoc-h{font-size:12px;color:var(--muted);margin-bottom:4px}
.ptoc ol{margin:0;padding-left:1.4em;columns:1;column-gap:32px;font-size:14px;line-height:1.9}
@media (min-width:720px){.ptoc ol.two{columns:2}}
.ptoc li{break-inside:avoid}
.ptoc button{appearance:none;display:block;width:100%;background:none;border:0;padding:0;text-align:left;color:var(--accent);cursor:pointer;font-size:14px;line-height:1.7;padding-block:2px}
.s{margin-top:48px;scroll-margin-top:64px}
.s>h2{font-size:21px;padding-bottom:8px;border-bottom:1px solid var(--strong-line)}
.s-lead{margin-top:10px;color:var(--muted);font-size:14px}
.prose p{margin-top:12px;max-width:42em}
.oneliner{margin-top:14px;font-size:20px;font-weight:600;font-synthesis:none;color:var(--accent);line-height:1.6}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
/* items */
.it{padding-block:22px;border-bottom:1px solid var(--line);scroll-margin-top:64px}
.it-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.it-h h3{font-size:18px;flex:1 1 12em;min-width:0}
.it-side{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.it-id{font-family:var(--font-label);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mark{font-size:11px;border:1px solid var(--muted);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap;line-height:1.7}
.dlg{margin-top:12px;display:grid;gap:10px}
.ln{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:720px){.ln{grid-template-columns:7.5rem minmax(0,1fr);gap:16px}}
.ln .who{font-size:13px;color:var(--muted);padding-top:2px}
.ln .say{max-width:40em}
.ln.nowho{grid-template-columns:minmax(0,1fr)}
.ln.cust .say{color:var(--muted)}
.ln.staff .say,.ln.nowho .say{padding-left:12px;border-left:3px solid var(--bar)}
.quote{margin-top:12px;padding-left:12px;border-left:3px solid var(--bar);white-space:pre-line;max-width:40em}
.quote.big{font-size:19px;font-weight:600;font-synthesis:none}
.pt{margin-top:12px;font-size:14px;color:var(--muted)}
.pt b,.bk b{font-weight:600;font-synthesis:none;color:var(--text);margin-right:6px}
.bk{margin-top:10px;font-size:14px;background:var(--tint);color:var(--tint-text);border-radius:8px;padding:10px 14px}
.bk b{color:inherit}
.cp{appearance:none;display:inline-block;text-decoration:none;line-height:1.6;background:none;border:1px solid var(--line);border-radius:6px;font-size:12px;padding:1px 9px;color:var(--muted);cursor:pointer;white-space:nowrap}
.cp:hover{border-color:var(--accent);color:var(--accent)}
.qa .q{font-size:18px}
.qa .short{margin-top:10px;font-weight:600;font-synthesis:none}
.qa .std{margin-top:6px;max-width:42em}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-size:14px;color:var(--accent)}
details.more p{margin-top:8px;max-width:42em}
.idref{appearance:none;font:inherit;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.refs{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--flash)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.flash{animation:none;outline:2px solid var(--accent)}}
/* tables */
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
.tbl th{text-align:left;font-size:12px;font-weight:600;font-synthesis:none;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--strong-line);vertical-align:bottom}
.tbl td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.k{font-weight:600;font-synthesis:none;width:28%}
.tbl .sub{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.tbl .idc{width:3.2em;font-family:var(--font-label);font-size:12px;color:var(--muted)}
@media (max-width:719px){
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:100%}
  .tbl.stack tr{border-bottom:1px solid var(--line);padding-block:10px}
  .tbl.stack td{border:0;padding:3px 0}
  .tbl.stack td[data-label]::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}
  .tbl.stack td.k{width:auto}
  .tbl.stack td.idc{width:auto}
}
.tbl td.ng-avoid{color:var(--sig-red)}
.tbl td.ng-say{font-weight:600;font-synthesis:none}
.tbl td.ng-back{font-size:14px;color:var(--muted)}
.wait{display:inline-block;font-size:11px;font-weight:400;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:0 6px;margin-left:6px;line-height:1.7;vertical-align:1px}
/* signals */
.sig{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;font-synthesis:none}
.sig::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.sig-red{color:var(--sig-red)}.sig-yellow{color:var(--sig-yel)}.sig-blue{color:var(--accent)}
.sigbox{margin-top:14px;display:grid;gap:8px}
@media (min-width:720px){.sigbox{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sigbox div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
/* part 1 */
.p1 .s>h2{border-bottom-color:var(--navy)}
.rules5{margin:14px 0 0;padding:0;list-style:none;counter-reset:r}
.rules5 li{counter-increment:r;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:4px 10px;padding-block:10px;border-bottom:1px solid var(--line)}
.rules5 li::before{content:counter(r);font-family:var(--font-label);font-size:18px;color:var(--accent)}
.rules5 b{font-weight:600;font-synthesis:none}
.rules5 .r{grid-column:2;color:var(--muted);font-size:14px}
.contact{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px}
/* message pyramid */
.pyr{display:grid;gap:8px;justify-items:center;margin-top:16px}
.pyr div{width:100%;border-radius:10px;padding:12px 16px;text-align:center}
@media (min-width:720px){.pyr .l1{width:60%}.pyr .l2{width:76%}.pyr .l3{width:90%}}
.pyr .l1{background:var(--navy);color:var(--on-navy)}
.pyr .l2{background:var(--tint);color:var(--tint-text)}
.pyr .l3,.pyr .l4{border:1px solid var(--line)}
.pyr .k{display:block;font-size:12px;opacity:.9}
.pyr .v{font-size:17px;font-weight:600;font-synthesis:none}
.pyr ul{list-style:none;margin:6px 0 0;padding:0;text-align:left;font-size:14px;display:grid;gap:4px}
/* cover */
.cover-h{font-size:28px;margin-top:6px}
@media (min-width:720px){.cover-h{font-size:34px}}
.steps3{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.steps3 li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:baseline}
.steps3 .n{font-family:var(--font-label);font-size:20px;color:var(--accent)}
.chlist{margin-top:14px;display:grid;gap:0;border-top:1px solid var(--line)}
.chrow{appearance:none;display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:2px 12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer;color:var(--text)}
.chrow .n{font-family:var(--font-label);font-size:17px;color:var(--accent);grid-row:span 2}
.chrow .t{font-weight:600;font-synthesis:none}
.chrow .r{font-size:13px;color:var(--muted)}
.chrow:hover .t{color:var(--accent)}
.search-row{display:flex;gap:8px;margin-top:16px;max-width:34rem}
.search-row input,.search{flex:1;min-width:0;border:1px solid var(--muted);border-radius:8px;padding:10px 14px;background:var(--bg);font-size:15px;width:100%}
/* pager */
.pager{margin-top:56px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:16px}
.pg{appearance:none;background:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--text);display:grid;gap:2px}
.pg.next{text-align:right}
.pg small{font-size:12px;color:var(--muted)}
.pg span{font-weight:600;font-synthesis:none;font-size:14px}
.pg:hover{border-color:var(--accent)}
/* index */
.facets{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:8px;margin-top:12px}
.facets select{width:100%;border:1px solid var(--muted);border-radius:6px;padding:7px 8px;background:var(--bg);font-size:13px;color:var(--text)}
.facets label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.count-line{margin-top:14px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.res{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.res li{border-bottom:1px solid var(--line)}
.res button{appearance:none;background:none;border:0;width:100%;text-align:left;padding:10px 0;cursor:pointer;color:var(--text);display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:2px 10px}
.res .rid{font-family:var(--font-label);font-size:12px;color:var(--muted);padding-top:3px}
.res .rt{font-weight:600;font-synthesis:none}
.res .rp{grid-column:2;font-size:12px;color:var(--muted)}
.kana{display:grid;gap:12px;margin-top:14px}
.kana-row{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:start}
.kana-h{font-weight:600;font-synthesis:none;color:var(--accent);font-size:17px}
.kws{display:flex;flex-wrap:wrap;gap:4px 14px}
.kw{appearance:none;background:none;border:0;padding:2px 0;font-size:14px;color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.kw:hover{color:var(--accent)}
.kw small{font-size:11px;color:var(--muted);margin-left:2px}
details.blk{margin-top:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
details.blk summary{cursor:pointer;font-weight:600;font-synthesis:none;font-size:15px;padding-block:6px}
.empty{margin-top:20px;color:var(--muted)}
/* status pills (maintenance only) */
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:0 10px;line-height:1.8;white-space:nowrap;border:1px solid var(--muted);color:var(--muted)}
.pill.ok{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.pill.rev{background:var(--tint);border-color:var(--tint);color:var(--tint-text)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat p:first-child{font-size:12px;color:var(--muted)}
.stat .big{font-size:26px;color:var(--accent);line-height:1.3}
.hist{list-style:none;margin:12px 0 0;padding:0}
.hist li{padding-block:14px;border-bottom:1px solid var(--line)}
.hist .hv{font-family:var(--font-label);color:var(--accent);margin-right:12px}
.hist ul{margin:8px 0 0;padding-left:1.2em;font-size:13px;color:var(--muted)}
.tbl tr{scroll-margin-top:64px}
.say b,.tbl b{font-weight:600;font-synthesis:none}
.refs .idref{font-size:13px}
.reflist{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--muted);display:grid;gap:2px}
.reflist .h{font-size:12px}
.reflist li{display:flex;gap:8px;align-items:baseline}
.it-side .cp{order:-1}
/* buttons */
.btn{appearance:none;background:transparent;border:1px solid var(--muted);border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;line-height:1.4;color:var(--text)}
.btn-small{padding:5px 12px;font-size:13px}
.btn-primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
/* notice to the admin */
.notice{margin-top:24px;border-left:6px solid var(--bar);background:var(--tint);color:var(--tint-text);border-radius:0 10px 10px 0;padding:14px 18px}
.notice-t{font-size:17px;font-weight:600;font-synthesis:none;line-height:1.7}
.notice-a{margin-top:12px}
.notice-a .btn{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-text);display:inline-block;text-decoration:none;font-weight:600;font-synthesis:none}
.notice-c{margin-top:10px;font-size:13px}
.notice a{color:inherit;white-space:nowrap}

"c-drug","label":"鉄剤が合わない・治療を終えた方","g":"生活者"},{"id":"c-check","label":"健診で異常なし・フェリチン低め","g":"生活者"},{"id":"c-media","label":"動画・雑誌を見て来た方","g":"生活者"},{"id":"c-doubt","label":"疑問・不安のある方","g":"生活者"},{"id":"c-lypo","label":"Lypo-Cを使っている方","g":"生活者"},{"id":"c-user","label":"MINERALionを使っている方","g":"生活者"},{"id":"doc","label":"医師・医療者","g":"専門家・取引先"},{"id":"owner","label":"取扱店の店長・オーナー","g":"専門家・取引先"},{"id":"staff","label":"取扱店のスタッフ","g":"専門家・取引先"},{"id":"corp","label":"法人・小売の担当者","g":"専門家・取引先"},{"id":"press","label":"メディア・発信者・監修者","g":"第三者"},{"id":"team","label":"スポーツチーム・指導者","g":"第三者"},{"id":"global","label":"海外の来場者・取引先","g":"第三者"},{"id":"inhouse","label":"社内（全社員・CS・営業）","g":"社内"}],"scenes":[{"id":"open","label":"声をかける"},{"id":"explain","label":"説明する"},{"id":"answer","label":"質問に答える"},{"id":"object","label":"疑問・反論に返す"},{"id":"cross","label":"組み合わせを提案する"},{"id":"clinic","label":"医療機関で提案する"},{"id":"close","label":"会計・お見送り"},{"id":"write","label":"書いて伝える"},{"id":"deal","label":"商談・導入"},{"id":"outside","label":"取材・イベント・依頼"},{"id":"train","label":"研修・社内"},{"id":"escalate","label":"相談に回す"}],"topics":[{"id":"hidden","label":"隠れ鉄不足・フェリチン"},{"id":"mens","label":"月経・PMS"},{"id":"preg","label":"妊娠・授乳"},{"id":"tired","label":"疲れ・だるさ"},{"id":"cold","label":"冷え"},{"id":"skin","label":"肌"},{"id":"hair","label":"髪"},{"id":"summer","label":"汗・夏"},{"id":"sport","label":"運動・スポーツ"},{"id":"kids","label":"成長期"},{"id":"drug","label":"鉄剤との違い"},{"id":"ion","label":"イオン化・吸収"},{"id":"origin","label":"原料・製法"},{"id":"mineral","label":"ミネラル"},{"id":"howto","label":"飲み方・量"},{"id":"taste","label":"味・混ぜ方"},{"id":"combo","label":"飲み合わせ・Lypo-C"},{"id":"price","label":"価格・導入条件"},{"id":"safety","label":"安全性・体調の変化"},{"id":"cert","label":"認証"},{"id":"food","label":"食事"},{"id":"exp","label":"体験・社販"},{"id":"media","label":"メディア・評判"},{"id":"brand","label":"ブランド"}],"seq":{"B":15,"F":39,"A":35,"T":84,"W":8,"P":14,"Y":8,"Q":38,"O":16,"N":29,"E":44,"x":13,"k":69},"history":[{"v":"1.0","at":"2026-10-01","by":"宮崎直哉（ブランド・マネージャー）","summary":"初版（2026.10.01 時点の最新版）。基本資料6点を1冊にまとめた：1 ブランドの定義 15項目、2 商品の事実 39項目（確定32・確定待ち7）、3 伝える設計 35項目、4 質問と反論 54件、5 話し方 114件、6 表現ルール（ルール5・表現44・言い換え29）。4と5のうち66件は新規に作成し、ほかは既存資料から集めて正本に合わせた。管理者の判断（ブランドの最上位は鉄、ミネラルは「数十種類」、吸収率の注記、実感のタイムライン、「赤血球を作る」の文、認証の現状）を反映。","changes":[]}],"brand":[{"id":"B01","key":true,"title":"MINERALionとは","body":["鉄を中心に、数十種類の多様なミネラルをイオン化して、液体で届ける食品（清涼飲料水）です。","主原料は、阿武隈山系の風化花崗岩に由来するミネラル液THEMAROX™。株式会社スピック（SPIC）のブランドで、Lypo-Cと同じ「体の中で使われやすい状態で届ける」設計思想から生まれました。"],"src":"BRAND BOOK p.25・p.28／Weekly S2 Vol.06"},{"id":"B02","key":true,"title":"ブランドの核","body":["「目指したのは、実感できる鉄分補給。」","ブランドの最上位の一文です。すべての言葉はこの下に置き、四半期のテーマが変わっても変えません。"],"src":"BRAND BOOK p.26／StaffEducation p.42／管理者の判断"},{"id":"B03","key":true,"title":"ミッション","body":["「鉄を、この国で有名にする。」","鉄＝貧血の人が飲むもの、という常識を書き換え、誰にでも潜む見えない不調を、鉄・ミネラルの話として社会に届けます。売上そのものより、まず市場を育てることを責務にしています。"],"src":"BRAND BOOK p.21／HCL研修 p.9／基本資料Ⅰ（ノート）"},{"id":"B04","key":true,"title":"約束","body":["「治す、ではなく、届ける。」","体が受け取りやすい状態で鉄・ミネラルを届けることが、MINERALionの役割です。治療は医療の役割です。"],"src":"BRAND BOOK p.27・p.72"},{"id":"B05","key":true,"title":"位置づけ：薬の一歩手前","body":["フェリチン（貯蔵鉄）は低いが、ヘモグロビンは正常。薬物治療の適応になりにくい「潜在性鉄欠乏（隠れ鉄不足）」の段階こそ、日常の鉄補給が誠実に役割を果たせる場所です。","現に鉄剤が必要な方に、代わりは勧めません。"],"src":"BRAND BOOK p.13・p.60"},{"id":"B06","title":"なぜつくったのか","body":["日本人の鉄の摂取量は、この約50年で13.4mgから7.6mgへほぼ半減しました。成人女性の平均は約7.2mgで、推奨量（月経のある女性で10〜10.5mg）に届いていません。働く世代女性の最大約49%が鉄欠乏という調査もあります。","しかも食事から摂る鉄の約70%は、吸収率の低い非ヘム鉄（2〜15%）です。食べているつもりでも届いていない隠れ鉄不足が、構造的に広がっています。","この課題に応えるため、Lypo-Cで培った「吸収して届ける」設計思想を、鉄をはじめとするミネラルに応用したのがMINERALionです。"],"src":"BRAND BOOK p.12・p.26／基本資料Ⅰ（ノート）"},{"id":"B07","title":"ブランドコンセプト","body":["「届く、を届ける。」「摂った量ではなく、届く量で。」","サプリメントの世界は長く「何が、どれだけ入っているか」を競ってきました。MINERALionはそこに問いを置きます。摂ったとして、体の中でそれは使われているのか。多く入れるより、確かに届く。その引き算の設計に、約50年の研究が積み重なっています。"],"src":"BRAND BOOK p.1–2・p.9"},{"id":"B08","title":"鉄を中心に、数十種類のミネラル","body":["鉄は単体では働かず、銅・マグネシウム・亜鉛などと一緒に働きます。だからMINERALionは、鉄を単体で大量に入れるのではなく、原料の岩石が持つ天然のバランスのまま、数十種類のミネラルを一緒に届けます。","表記は「数十種類の多様なミネラル」です。「50種以上」は使いません。"],"src":"BRAND BOOK p.14・p.31／表記ルール（2025.11）／管理者の判断"},{"id":"B09","title":"目指すポジション","body":["日本ではまだ「鉄＝貧血の薬」です。MINERALionは、予防と日常の補給という新しい常識をつくる段階にいます。","Lypo-Cが「ビタミンCは点滴から日常へ」を実現したように、MINERALionは鉄を日常の常識にします。サロン・クリニック・薬局・ECを、同じブランドでつなぎます。"],"src":"BRAND BOOK p.21・p.26／HCL研修 p.5・p.9"},{"id":"B10","title":"Lypo-Cとの関係","body":["同じ株式会社スピックのブランドで、設計思想は同じ「体の中で使われやすい状態で届ける」です。Lypo-CはビタミンCをリポソーム化し、MINERALionは鉄を中心としたミネラルをイオン化します。","組み合わせのたとえは「材料と動力」。Lypo-Cのビタミンが材料なら、MINERALionのミネラルはそれを動かす動力です。","MINERALionは、Lypo-Cに依存しない独立した事業の柱でもあります。"],"src":"BRAND BOOK p.44／HCL研修 p.5・p.9／Weekly S2 Vol.06"},{"id":"B11","title":"ビジョン・ミッション・バリュー","body":["ビジョン：未来の健康を、つくる。","ミッション：ミネラルの社会浸透。1人でも多くの鉄不足を解消する。","バリュー：Lypo-Cで培った吸収思想とそれを支える技術／曖昧な健康感を実感に変える体験設計／3,500を超える専門的なパートナーの存在"],"note":"社内の言葉です。生活者向けには、ミッションの「鉄不足を解消する」をそのまま使いません。","src":"SpeakEasy 3.0（Appendix）"},{"id":"B12","title":"大切にする価値観","body":["誠実に分ける：強いエビデンスと現場の実感は、切り分けて伝える。言えること／言えないことを堂々と分けることが、いちばん誠実な使い方です。","断定しない、という知性：「関連」と「因果」を分けて話します。","売る、ではなく、届ける：押し売りしません。体験した人の言葉を大切にします。","正しさより、健やかさ：事実は曲げず、そのうえで相手が前向きになれる一言を選びます。"],"src":"BRAND BOOK p.19・p.49・p.58／HCL研修 p.33"},{"id":"B13","title":"ブランドトーン","body":["Smart & Next：知性と美意識で、鉄という栄養素の次の常識をつくる。","話し方は「賢く、誠実に、ひとつ先へ。誇張せず、根拠に基づき、すっきりと伝える」。専門用語を使わず、生活の言葉で話します。","見た目：メインカラーは#0033AD、サブは#E9F2FF・#FFFFFF・#000000・#DCE0E0。グラデーションは使いません。和文は游ゴシック体、欧文はHelvetica（数字・日付）とInstrument Sans（番号・キャプション）。見出しはDemiBoldで、Boldは使いません。"],"src":"HCL研修 p.29／BRAND BOOK p.77／デザインガイドライン ver.1"},{"id":"B14","title":"やらないこと","body":["治る・効く・予防できる、と言わない。","鉄剤を否定しない。代わりを勧めない。お薬の中止や減量をほのめかさない。","スタッフが診断しない。不安をあおって勧めない。","ほかの飲料・サプリ・医薬品との優劣を言わない。根拠のない最上級を自分たちの言葉にしない。","体験談を効能の裏づけにしない。確定していない数字・表記を使わない。"],"src":"Medical Proposal Ⅱ p.16／BRAND BOOK p.67"},{"id":"B15","title":"「見えない不足、ミネラル」の扱い","body":["ブランドの最上位は鉄（「目指したのは、実感できる鉄分補給。」）です。","「見えない不足、ミネラル」は、季節のテーマや特集の切り口のひとつとして使います。最上位のメッセージには置きません。"],"src":"管理者の判断"}],"factsecs":[{"id":"fs1","label":"基本情報"},{"id":"fs2","label":"原料・成分"},{"id":"fs3","label":"製造・品質"},{"id":"fs4","label":"摂り方・飲み合わせ"},{"id":"fs5","label":"根拠・データ"},{"id":"fs6","label":"位置づけ・表記"}],"facts":[{"id":"F01","sec":"fs1","status":"確定","label":"商品名","value":"MINERALion（ミネラリオン）","note":"","source":"基本資料Ⅰ"},{"id":"F02","sec":"fs1","key":true,"status":"確定","label":"商品概要","value":"鉄を中心に、数十種類の多様なミネラルをイオン化した液状の食品","note":"","source":"BRAND BOOK p.25"},{"id":"F03","sec":"fs1","key":true,"status":"確定","label":"区分","value":"食品（清涼飲料水）。医薬品ではない。軽減税率8%","note":"","source":"基本資料Ⅰ p.10／BRAND BOOK p.32"},{"id":"F04","sec":"fs1","status":"確定","label":"形状","value":"液状の分包（スティック）","note":"","source":"HCL研修 p.24"},{"id":"F05","sec":"fs1","key":true,"status":"確定","label":"内容量","value":"10g × 30包（約1ヶ月分）","note":"","source":"基本資料Ⅰ p.10"},{"id":"F06","sec":"fs1","key":true,"status":"確定","label":"希望小売価格","value":"5,400円（税別）／5,832円（税込）","note":"卸価格・段階卸・定期便・トライアル価格は時期で変わるので、最新の価格表で確認","source":"基本資料Ⅰ p.10"},{"id":"F07","sec":"fs1","status":"確定","label":"保存方法","value":"常温で保存","note":"","source":"BRAND BOOK p.32"},{"id":"F08","sec":"fs1","status":"確定","label":"原産国・販売者","value":"日本／株式会社スピック（SPIC）","note":"","source":"StaffEducation p.14／BRAND BOOK p.76"},{"id":"F09","sec":"fs2","status":"確定","label":"主原料","value":"THEMAROX™（シーマロックス）。阿武隈山系（福島）の風化花崗岩に由来する天然のミネラル液","note":"","source":"BRAND BOOK p.28／StaffEducation p.20"},{"id":"F10","sec":"fs2","status":"確定","label":"原料の来歴","value":"薬学博士・嶋西浅男が1977年に製法を確立。原料には約50年の実績。サプリメント分野ではSPICが独占契約。米国特許技術","note":"","source":"BRAND BOOK p.7・p.28・p.36"},{"id":"F11","sec":"fs2","key":true,"status":"確定","label":"鉄","value":"1包あたり約4〜5mg（精密計算で約5.35mg。ロットにより約5,000〜6,000μg）","note":"「43,500μg」「4,350μg」は誤り。最新ロット（EXP.2028/01 AI）の実測は4.48mg","source":"基本資料Ⅰ p.8／StaffEducation 付録／Weekly S4 vol.1"},{"id":"F12","sec":"fs2","key":true,"status":"確定","label":"ミネラルの種類","value":"数十種類の多様なミネラル","note":"「50種以上」は使わない。社内資料の分析一覧に載っている元素は約30","source":"表記ルール（2025.11）／管理者の判断"},{"id":"F13","sec":"fs2","status":"確定待ち","label":"原材料名（表示）","value":"パッケージの原材料名の表示を、そのまま転記して確定する","note":"転記するまでは、主原料（THEMAROX™）の説明までにとどめる","source":"パッケージ表示"},{"id":"F14","sec":"fs2","status":"確定待ち","label":"必須ミネラルの数え方","value":"「16種中14種」「14種中13種」「13種」が並存","note":"除く元素の括弧書きを、分析項目から決め直す。ヨウ素は「未測定」と書いた資料がある","source":"表記ルール（2025.11）／基本資料Ⅰ p.8"},{"id":"F15","sec":"fs2","status":"確定","label":"栄養成分（1包10gあたり）","value":"エネルギー約0.3kcal","note":"そのほかの栄養成分表示は、パッケージの表示を原典にする","source":"StaffEducation p.22／HCL研修 p.24"},{"id":"F16","sec":"fs2","status":"確定待ち","label":"アルミニウムの説明","value":"基本資料Ⅰは約5.5mg/包と記載、StaffEducationの成分一覧は表示から除外","note":"決まるまでは、成分表の案内と担当への引き継ぎまで（Q25）","source":"基本資料Ⅰ p.9／StaffEducation 付録"},{"id":"F17","sec":"fs3","status":"確定","label":"製造方法","value":"風化花崗岩を粉砕し、特殊な酸でゆっくり溶解（イオン化）、幾重ものフィルタでろ過し、安全性試験を経て10g×30包に充填","note":"","source":"BRAND BOOK p.29"},{"id":"F18","sec":"fs3","status":"確定","label":"イオン化","value":"ミネラルを0.2〜0.5nmのイオンの状態に整える。腸壁のイオンチャネル開口部（約0.3〜0.8nm）に合わせた設計","note":"","source":"BRAND BOOK p.30"},{"id":"F19","sec":"fs3","status":"確定","label":"品質管理","value":"ロットごとに成分を分析し、成分表を公式サイトで公開（lypo-c.shop/pages/mineralion_ingredients）。代表ロットはICP分析 報告No.RC202404997-1","note":"ロット差で±20%程度の変動がある","source":"基本資料Ⅰ p.9／StaffEducation 付録"},{"id":"F20","sec":"fs3","key":true,"status":"確定","label":"第三者認証","value":"インフォームドスポーツ認証：取得済み","note":"「申請中」「9月取得予定」「取得検討」の表記は使わない","source":"管理者の確認"},{"id":"F21","sec":"fs4","status":"確定","label":"飲み方","value":"そのまま、または水などに混ぜて","note":"","source":"BRAND BOOK p.25・p.37"},{"id":"F22","sec":"fs4","key":true,"status":"確定待ち","label":"1日の目安量とタイミング","value":"確定待ち。決まるまでは「パッケージの表示どおりに」と案内する","note":"資料によって「朝に1包」「朝食前か食間に1〜2包」「1日1〜4包」「4包を一度に」「就寝前」が並存している。「赤血球を作る」の文の扱い（F28）と、アルミニウムの量（F16）もあわせて決める","source":"基本資料Ⅰ p.10／StaffEducation／Weekly S2 Vol.06／公式FAQ"},{"id":"F23","sec":"fs4","status":"確定","label":"Lypo-Cとの飲み合わせ","value":"同じ日に摂ってよい。同じ飲み物には混ぜず、1〜2時間ずらすのが理想","note":"混ぜると風味や色が変わることがある（品質の問題ではない）","source":"BRAND BOOK p.45／Weekly S1 Vol.07"},{"id":"F24","sec":"fs4","status":"確定","label":"お茶・コーヒー","value":"タンニンが鉄の吸収を妨げることがあるため、同時は避け、前後30分〜1時間あける","note":"B {"id":"A04","level":"rtb","title":"THEMAROX™","text":"阿武隈山系の風化花崗岩に由来する原料。約50年の実績、サプリメント分野での独占契約、米国特許技術。","note":"","refs":["F09","F10"]},{"id":"A05","level":"rtb","title":"製造と品質","text":"ろ過と安全性試験を経て充填。ロットごとに成分を分析し、成分表を公開。","note":"","refs":["F17","F19"]},{"id":"A06","level":"rtb","title":"栄養補給の量","text":"1包に鉄約4〜5mg。治療用量とはちがう、毎日の補給の量。","note":"","refs":["F11"]},{"id":"A07","level":"rtb","title":"第三者認証","text":"インフォームドスポーツ認証を取得済み。","note":"","refs":["F20"]},{"id":"A08","level":"rtb","title":"吸収率（条件つき）","text":"イオン化によって、吸収率90%以上をめざした設計（文献ベース）。","note":"黄。必ずこの言い方で。生活者向けにほかの吸収率と並べない。","refs":["F27"]},{"id":"A09","level":"benefit","title":"Benefit","text":"食事で不足しがちな鉄を、毎日続けやすい形で。","note":"体の変化は約束しない。「続けやすさ」と「日常の補給」を価値にする。","refs":[]},{"id":"A10","level":"use","title":"この階層の使い方","text":"上から順に話す。根拠（Reason to Believe）は聞かれたら出す。1回の会話で出す数字は2つまで。","note":"","refs":[]},{"id":"A11","level":"segment","title":"月経のある方","avoid":"PMSが楽になる・生理がつらくなくなる","say":"月経のある方は、いちばん鉄が不足しやすい。食事を土台に、日常の補給で。","hook":"毎月、鉄を失っていますよね。","rtb":"開発背景のデータ（摂取量の半減、平均7.2mg）","refs":["T44","T60","T33"]},{"id":"A12","level":"segment","title":"肌・髪が気になる方","avoid":"肌がきれいになる・抜け毛が止まる","say":"鉄は、肌が生まれ変わる流れに関わる栄養素。外から足すケアに、内側の視点を。","hook":"透明感やハリの前に、肌そのものが働ける状態か。","rtb":"栄養素の一般的な働き（コラーゲンをつくる酵素と鉄）","refs":["T35","T36","T43","Y01","Y03"]},{"id":"A13","level":"segment","title":"運動する方・アスリート","avoid":"パフォーマンスが上がる・記録が伸びる","say":"汗1Lで鉄は0.3〜0.4mgほど。運動する人ほど鉄を使いやすい。","hook":"汗と一緒に、鉄も出ていきます。","rtb":"第三者認証（インフォームドスポーツ取得済み）","refs":["T27","T28","T30","Q29"]},{"id":"A14","level":"segment","title":"妊活・妊娠・授乳中の方","avoid":"妊娠中でも安心・赤ちゃんのために","say":"量に配慮が要る時期。先に医師・薬剤師へ相談を。","hook":"鉄が多く必要になる時期ですね。","rtb":"","refs":["T61","T62","T45","Q27"]},{"id":"A15","level":"segment","title":"子ども・保護者","avoid":"成長を促す・背が伸びる","say":"食事が主役で、補給は補助。2歳未満は医師の指導のもとで。","hook":"お子さん、部活は？","rtb":"","refs":["T48","Q28","Y05"]},{"id":"A16","level":"segment","title":"高齢の方","avoid":"元気になる・若返る","say":"無理のない範囲で。飲み合わせは先生・薬剤師に。","hook":"お食事が細くなると、ミネラルも不足しがちです。","rtb":"","refs":["T66","Q34"]},{"id":"A17","level":"segment","title":"男性","avoid":"男性にも効く","say":"女性ほど不足しにくい。足りている人は変化を感じにくい、と正直に。","hook":"汗をよくかく方、食事が偏りがちな方は。","rtb":"","refs":["T47","Q30"]},{"id":"A18","level":"segment","title":"健診で異常なし・フェリチン低め","avoid":"隠れ鉄不足ですね・貧血ですね","say":"ヘモグロビンとフェリチンは別の指標。数値の解釈は先生へ。","hook":"健診で異常なし＝鉄が十分、とは限らないんです。","rtb":"","refs":["T32","T64","Y04"]},{"id":"A19","level":"segment","title":"鉄剤が合わない・治療を終えた方","avoid":"薬の代わりになる・やめて大丈夫","say":"治療は先生の指示どおり。日常の補給は食品で。","hook":"お薬、続けにくいですよね。","rtb":"","refs":["T63","T65"]},{"id":"A20","level":"segment","title":"医師・医療者","avoid":"第一選択・鉄剤より優れる","say":"3つのスタンス、約30分の1の量の差、4つのセグメント。","hook":"治療の鉄に、日常の鉄を。","rtb":"鉄量（F11）、栄養機能食品の範囲（F29）、耐容上限量（F30）","refs":["T15","T16"]},{"id":"A21","level":"segment","title":"取扱店（サロン・ジム・物販）","avoid":"置けば売れる","say":"会話の入口とPOP、立ち上げの型を一緒に用意する。","hook":"売る前に、スタッフが体験者に。","rtb":"","refs":["T83","T23","W03","W08"]},{"id":"A22","level":"segment","title":"Lypo-Cを使っている方","avoid":"一緒に飲むと効果が上がる","say":"同じ「届ける」設計。混ぜずに1〜2時間ずらして。","hook":"材料と動力、の話です。","rtb":"","refs":["T69","T71","T72","T73"]},{"id":"A23","level":"segment","title":"MINERALionから入った方","avoid":"","say":"まず鉄、そのあとビタミンC。混ぜずに時間をずらして。","hook":"コラーゲンづくりには、鉄とビタミンCの両方が要ります。","rtb":"","refs":["T70"]},{"id":"A24","level":"segment","title":"メディア・発信者","avoid":"効果の断定・医薬品との比較","say":"商品概要・内容量・価格・鉄量と、掲載の事実。","hook":"数字は、公開できるものだけお伝えします。","rtb":"F02・F05・F06・F11","refs":["T12","W05","W06"]},{"id":"A25","level":"channel","title":"EC（商品ページ・チャット）","text":"言える範囲は「公式の生活者向け」。Core・Key・Benefitと、事実の表だけで書く。根拠の数字は注記つき。","refs":["W01","T09"]},{"id":"A26","level":"channel","title":"SNS（投稿・コメント・DM）","text":"短く、問いの形で。体験を書くなら「個人の感想」を添える。依頼した投稿にはPR表記。","refs":["W02","T10","T11"]},{"id":"A27","level":"channel","title":"PR（メディア）","text":"公開できる数字だけ。掲載・受賞は事実まで。原稿確認をお願いする。","refs":["T12","W05"]},{"id":"A28","level":"channel","title":"営業（小売・クリニック・法人）","text":"医療は3つのスタンスから、非医療は30秒から。価格は口頭で言い切らず、価格表を見せる。","refs":["T04","T15","T23","T24"]},{"id":"A29","level":"channel","title":"展示会・イベント","text":"30秒と、その場の体験（1包）。配った数と、体調・服薬を聞いた記録を残す。","refs":["T31","T03"]},{"id":"A30","level":"channel","title":"海外","text":"日本の表現基準に加えて、現地の規制を先に確認する。英語の30秒は、確認が済んだ国で使う。","refs":["T25","T26"]},{"id":"A31","level":"angle","title":"冬〜春：冷え","text":"冷えと鉄の関係、ご存じでしたか？","refs":["P11","T49"]},{"id":"A32","level":"angle","title":"初夏：肌","text":"美容は「足す」から「回す」へ。","refs":["P12","T35"]},{"id":"A33","level":"angle","title":"盛夏：汗","text":"汗が奪う鉄を、先手で補う準備を。","refs":["P13","T50","T52"]},{"id":"A34","level":"angle","title":"秋：髪","text":"秋の髪の悩みに、「鉄」という視点を。","refs":["P14","T43"]},{"id":"A35","level":"angle","title":"通年の切り口：見えない不足","text":"見えない不足、ミネラル。","note":"季節のテーマや特集の見出しに使う。最上位のメッセージには置かない（管理者の判断）。","refs":["B15"]}],"qsecs":[{"id":"product","label":"製品について"},{"id":"effect","label":"効き目・必要性"},{"id":"howto","label":"飲み方・味・保存"},{"id":"safety","label":"安全性・体調"},{"id":"people","label":"相手別（妊娠・子ども・スポーツ・男性）"},{"id":"combo","label":"飲み合わせ"},{"id":"medical","label":"鉄剤・医療"},{"id":"price","label":"価格"},{"id":"objection","label":"誤解・反論・突っ込み"}],"tsecs":[{"id":"k30","label":"30秒","desc":"「MINERALionって何？」"},{"id":"k1m","label":"1分","desc":"初対面・展示会・営業の第一声"},{"id":"k3m","label":"3分","desc":"商品説明"},{"id":"k10","label":"10分","desc":"商談・セミナー"},{"id":"ec","label":"EC","desc":"商品ページ・チャット対応"},{"id":"sns","label":"SNS","desc":"投稿・コメント・DM・Googleの投稿"},{"id":"pr","label":"PR","desc":"メディア・発信者・監修"},{"id":"sales","label":"営業","desc":"小売・クリニック・法人"},{"id":"global","label":"海外","desc":"展示会・Global"},{"id":"athlete","label":"アスリート","desc":"スポーツ領域"},{"id":"store","label":"店頭・サロン・ジム","desc":"相手別の声かけ"},{"id":"clinic","label":"医療機関","desc":"患者様へのご提案"},{"id":"combo","label":"Lypo-Cとの組み合わせ","desc":"Lypo-Cと双方向に"},{"id":"pattern","label":"答える順番の型","desc":"この質問には、この順番で"},{"id":"phrase","label":"ひとこと","desc":"決めゼリフ・季節の切り口"},{"id":"metaphor","label":"たとえ","desc":"難しい説明を一瞬で"},{"id":"inhouse","label":"社内・立ち上げ","desc":"CS・社販・新人・着荷"}],"rules5":[{"id":"b1","rule":"MINERALionは食品（清涼飲料水）です。「治る・効く・予防できる」とは言いません。","title":"食品として話す","core":["N01","N02","N03"],"points":["効能の断定、体調の変化の約束、ほかの飲料や医薬品との優劣は言わない","体験談を効能の裏づけに使わない。紹介するときは個人の感想だと添える"],"source":"Medical Proposal Ⅱ p.15–16／Weekly S4 vol.1–2／BRAND BOOK p.67"},{"id":"b2","rule":"鉄剤の代わりを勧めず、お薬の中止や減量をほのめかさず、スタッフが診断をしません。","title":"医療の判断を尊重する","core":["N14","N15","N16"],"points":["医療機関では3つのスタンスを外さない：鉄剤ではない食品／既存治療への敬意／医師の臨床判断が前提","妊娠・授乳中、服薬中、お子さま、持病のある方には、医師・薬剤師への相談を添える"],"source":"Medical Proposal Ⅰ p.2・p.6–8／Medical Proposal Ⅱ p.2・p.15–16"},{"id":"b3","rule":"数字と表記は、「2 商品の事実」（正本）で確定しているものだけを使います。","title":"正本の数字と表記だけを使う","core":["N21","N22","N24"],"points":["「確定待ち」の項目は言い切らない","「50種以上」「鉄43,500μg」「鉄4,350μg」は使わない","手元の古い資料から写さず、ここから引く"],"source":"表記ルール（2025.11）／基本資料Ⅰ ver.202607"},{"id":"b4","rule":"研修で学んだ根拠や比較は、お客様にそのまま言いません。","title":"相手によって、言える範囲を変える","core":["N27","N28","N29"],"points":["言える範囲は5段階：社内研修／パートナー研修／生活者に話す（パートナーの口頭・POP・SNS・Googleの投稿）／公式の生活者向け／医療者向け。このマニュアルでは「生活者に話す」以外の項目に、段階の印を付けている","店頭・POP・SNSでの言葉は、広告と同じ基準で扱う","鉄剤との比較表と、実感のタイムラインは研修用","吸収率90%以上は、イオン化によって目指した値であることを必ず添える"],"source":"基本資料Ⅰ p.5（ノート）／基本資料Ⅱ p.5–6／Medical Proposal Ⅰ p.9"},{"id":"b5","rule":"ここにない言い方や数字は、使う前に管理者に確認します。黄色の表現で迷ったときも同じです。","title":"迷ったら確かめる","core":[],"points":[],"contact":true,"source":""}],"scopeLadder":[{"id":"in","who":"社内研修","what":"社内の勉強会・資料","ok":"研修用の比較表、実感のタイムライン、裏の事実、ミッションの社内の言葉","ng":"社外に出さない"},{"id":"pt","who":"パートナー研修","what":"取扱店の研修・Weekly MINERALion・BRAND BOOK","ok":"背景の知識、たとえ（センターピンなど）、導入条件","ng":"研修資料をお客様に見せない。「研修用」の注記を外さない"},{"id":"ptc","who":"生活者に話す","what":"パートナーの口頭・POP・SNS・Googleの投稿","ok":"青の表現、トーク集・FAQの標準回答","ng":"赤の表現。黄の表現は条件どおりに"},{"id":"off","who":"公式の生活者向け","what":"EC・公式FAQ・同梱物・広告・CS","ok":"青の表現と、正本の確定値","ng":"赤の表現。黄は根拠を確かめてから。いちばん厳しく"},{"id":"med","who":"医療者向け","what":"医師・医療スタッフへの説明","ok":"量の比較（1日100〜200mgと1包約4〜5mg）、4つのセグメント、提案の型","ng":"第一選択、鉄剤より優れる、という言い方"}],"expr":[{"id":"E01","level":"red","expr":"治る・改善する・効く・予防できる","how":"「鉄・ミネラルの補給をサポートする食品です」。","refs":["N01","N05"]},{"id":"E02","level":"red","expr":"貧血を改善します・冷え性に・PMSに（病名や症状を挙げた効能）","how":"症状の原因や対処は、先生へ返す。","refs":["N01","N15"]},{"id":"E03","level":"red","expr":"鉄剤の代わりに／お薬をやめて大丈夫","how":"「先生の判断・指示のもとでお使いください」。","refs":["N14","N16"]},{"id":"E04","level":"red","expr":"必ず実感できる・効果を保証する","how":"「個人の感想で、感じ方には差があります」。","refs":["N03"]},{"id":"E05","level":"red","expr":"最強・No.1・世界初（自社の言葉として）","how":"根拠のない最上級は使わない。第三者の表現は「そうご紹介いただきました」まで。","refs":["N10"]},{"id":"E06","level":"red","expr":"第一選択・薬ではなくMINERALion","how":"鉄欠乏性貧血の第一選択は鉄剤。「治療の鉄に、日常の鉄を。」","refs":["N19"]},{"id":"E07","level":"red","expr":"○○より優れている・体にいい（ほかの飲料・サプリ・医薬品と比べて）","how":"比べるのは含有量の事実まで。","refs":["N08","N20"]},{"id":"E08","level":"red","expr":"3時間で・3日で・2週間で（変化の時期の約束）","how":"生活者には言わない。研修の中だけ。","refs":["N27"]},{"id":"E09","level":"red","expr":"50種以上・鉄43,500μg・第5世代","how":"正本にない数字・表記は使わない。","refs":["N21","N22","N23"]},{"id":"E10","level":"red","expr":"鉄は、赤血球をつくるのに必要な栄養素です（製品の説明として）","how":"確定するまで、製品と結びつけて使わない。","refs":["N24"]},{"id":"E11","level":"red","expr":"免疫力が上がる・若返る・老化を防ぐ・痩せる・記録が伸びる","how":"栄養素の一般的な働きにとどめる。","refs":["N09"]},{"id":"E12","level":"red","expr":"飲まないと悪化しますよ（不安をあおる）","how":"「選択肢の一つとして。無理にとは申しません」。","refs":["N18"]},{"id":"E13","level":"red","expr":"貧血ですね・隠れ鉄不足ですね（スタッフの診断）","how":"「ご心配なら、まず先生にご相談ください」。","refs":["N15","N17"]},{"id":"E14","level":"red","expr":"「〜な気がする」を付けて、効果をほのめかす","how":"付けても効果の言い方であることは変わらない。続けやすさや設計の話にする。","refs":["N06"]},{"id":"E15","level":"red","expr":"お客様の声を、効き目の裏づけに使う","how":"使わない。紹介するなら個人の感想と明記し、治った・改善したと読める声は使わない。","refs":["N11"]},{"id":"E16","level":"yellow","expr":"吸収されやすい","how":"設計の話として：「吸収されやすい形を目指して、イオン化しています」。","refs":["O14"]},{"id":"E17","level":"yellow","expr":"吸収率90%以上","how":"必ず「イオン化によって目指した値（文献ベース）」を添える。生活者向けに、ほかの吸収率と並べない。","refs":["N28","N29"]},{"id":"E18","level":"yellow","expr":"代謝をサポート","how":"栄養素の一般的な働きとして：「鉄はエネルギーづくりに関わる栄養素」。製品が代謝を高める、とは言わない。","refs":[]},{"id":"E19","level":"yellow","expr":"美容に・肌に","how":"「鉄は、肌が生まれ変わる流れにも関わる栄養素」。肌の変化は約束しない。","refs":["N04"]},{"id":"E20","level":"yellow","expr":"疲労に・疲れに","how":"疲れの原因は鉄だけではない、を前提に。「疲れが取れる」とは言わない。","refs":["N02"]},{"id":"E21","level":"yellow","expr":"アスリートに","how":"認証の事実（インフォームドスポーツ取得済み）と、表示・競技団体基準の確認まで。競技力の向上は言わない。","refs":["N09"]},{"id":"E22","level":"yellow","expr":"冷えに","how":"「冷えと鉄の関係」を一般論として。「温まる」「冷えが治る」とは言わない。","refs":[]},{"id":"E23","level":"yellow","expr":"続けやすい・胃にやさしい","how":"「続けやすい設計」は使える。鉄剤と比べて「胃にやさしい」とは言わない。","refs":["N20"]},{"id":"E24","level":"yellow","expr":"隠れ鉄不足","how":"一般の言葉として説明に使う。目の前の人に「隠れ鉄不足ですね」とは言わない。","refs":["N15"]},{"id":"E25","level":"yellow","expr":"医師監修・医師推薦","how":"監修の範囲（どの資料・どの記述か）を正確に。製品の効果を医師が認めた、とは言わない。","refs":[]},{"id":"E26","level":"yellow","expr":"掲載・受賞","how":"「○○に載りました」「選ばれました」という事実まで。","refs":["N10"]},{"id":"E27","level":"yellow","expr":"体験談・お客様の声","how":"「個人の感想です。体感には個人差があります」を添える。","refs":["N11"]},{"id":"E28","level":"yellow","expr":"妊娠中・授乳中・お子さま","how":"必ず医師・薬剤師への相談を添える。子どもは「食事が主役」を添える。","refs":[]},{"id":"E29","level":"yellow","expr":"PMS・月経の不調","how":"「月経で鉄を失う」という事実まで。「PMSが楽になる」とは言わない。","refs":[]},{"id":"E30","level":"yellow","expr":"髪・抜け毛","how":"「髪は分裂が速く、鉄不足の影響が出やすい」と一般論で。「抜け毛が止まる」とは言わない。","refs":["N04"]},{"id":"E31","level":"yellow","expr":"1日○包","how":"目安量は確定待ち（F22）。「パッケージの表示どおりに」。","refs":["N25"]},{"id":"E32","level":"blue","expr":"食品（清涼飲料水）です","how":"","refs":[]},{"id":"E33","level":"blue","expr":"鉄を含むミネラルのサプリメント（食品）です","how":"区分を聞かれたら「食品（清涼飲料水）」と正確に。","refs":[]},{"id":"E34","level":"blue","expr":"鉄を中心に、数十種類の多様なミネラル","how":"","refs":[]},{"id":"E35","level":"blue","expr":"ミネラルをイオン化して、液体で","how":"","refs":[]},{"id":"E36","level":"blue","expr":"1包あたり鉄約4〜5mg","how":"","refs":[]},{"id":"E37","level":"blue","expr":"日々の食事で不足しがちな鉄を含む食品です","how":"","refs":[]},{"id":"E38","level":"blue","expr":"鉄・ミネラルの補給をサポートする食品です","how":"","refs":[]},{"id":"E39","level":"blue","expr":"目指したのは、実感できる鉄分補給。","how":"ブランドの核。","refs":[]},{"id":"E40","level":"blue","expr":"先生の判断・指示のもとでお使いください","how":"","refs":[]},{"id":"E41","level":"blue","expr":"個人の感想で、感じ方には差があります","how":"","refs":[]},{"id":"E42","level":"blue","expr":"阿武隈山系の風化花崗岩に由来する原料（THEMAROX™）","how":"","refs":[]},{"id":"E43","level":"blue","expr":"インフォームドスポーツ認証を取得しています","how":"競技者には、表示と競技団体の基準の確認を添える。","refs":[]},{"id":"E44","level":"blue","expr":"選択肢のひとつです／無理にとは申しません","how":"","refs":[]}],"ng":[{"id":"N01","rule":"b1","avoid":"貧血が治ります","say":"日常の鉄補給として、続けやすい鉄の食品です","back":"鉄欠乏性貧血の治療は、医師が処方する鉄剤で行う。社内のモニタリングは主観的な評価の記録で、治療効果の証明ではない（Weekly S3 Vol.02）。食品が病気を治すとは言えない。","src":"BRAND BOOK p.67／Medical Proposal Ⅱ p.15"},{"id":"N02","rule":"b1","avoid":"飲めば疲れが取れます","say":"日々の食事で不足しがちな鉄を含む食品です","back":"鉄が足りないと、酸素を運ぶ働きやエネルギーをつくる働きが落ち、疲れやすさとして出ることがある（基本資料Ⅱ）。元の貯蔵鉄が低い人ほど変化を感じやすい（FAQ回答集）。疲れの原因は鉄だけではない。","src":"Weekly S4 vol.1"},{"id":"N03","rule":"b1","avoid":"必ず実感できます","say":"個人の感想で、感じ方には差があります","back":"感じ方は、元の鉄の状態、食事、続けた期間で変わる。男性や鉄が足りている人は、変化を感じにくいことがある（FAQ回答集）。","src":"BRAND BOOK p.67"},{"id":"N04","rule":"b1","avoid":"飲めば肌がきれいになる／抜け毛が止まる","say":"鉄は、肌が生まれ変わる流れにも関わっている栄養素なんです","back":"鉄がコラーゲンをつくる酵素の補因子であること、鉄欠乏と脱毛の関連を示す研究があることは言える事実。製品を飲んだ結果として肌や髪が変わることは、示されていない（StaffEducation p.38）。","src":"StaffEducation p.33・p.38／BRAND BOOK p.64"},{"id":"N05","rule":"b1","avoid":"○○に効く／病気が予防できる","say":"鉄・ミネラルの補給をサポートする食品です","back":"食品で病気の予防や治療をうたうと、医薬品のような効能効果の表示になる（薬機法）。","src":"StaffEducation p.33"},{"id":"N06","rule":"b1","avoid":"飲んだ翌朝、体が軽くなりますよ（「〜な気がする」を付けても同じ）","say":"毎日続けやすいように作られた、鉄の食品なんです","back":"「〜気がする」「〜な感覚」を付けても、体の変化をほのめかす言い方であることは変わらない。BRAND BOOK p.65とWeekly S2 Vol.05の例文は、この基準に合わせて使わない。","src":"新規（管理者の判断）"},{"id":"N07","rule":"b1","avoid":"これを飲めば鉄不足が解消します","say":"鉄を摂りたい方の、選択肢のひとつです","back":"1包の鉄は約4〜5mgで、推奨量（月経のある女性で1日10〜10.5mg）の半分に届かない。食事が土台、という説明のほうが正確。","src":"Weekly S4 vol.1"},{"id":"N08","rule":"b1","avoid":"麦茶（スポーツドリンク）より、こちらのほうが体にいい","say":"水分は麦茶、鉄はMINERALion、という足し算です","back":"麦茶・スポーツドリンクの鉄は、成分表で「Tr（微量）」。比べるのは含有量の事実まで。ほかの飲料の価値を下げる言い方は、優劣の表示になる。","src":"Weekly S4 vol.1–2"},{"id":"N09","rule":"b1","avoid":"パフォーマンスが上がります／記録が伸びます","say":"運動習慣のある方の、選択肢のひとつです","back":"社内モニタリング（鎌倉インテル）は主観的な評価の記録で、競技力の向上は示されていない。","src":"Weekly S4 vol.2"},{"id":"N10","rule":"b1","avoid":"最強の鉄サプリです","say":"動画で、そうご紹介いただきました","back":"「最強」は第三者（動画）の表現。当社が言うと、根拠のない最上級の表現になる（景品表示法）。","src":"Weekly 号外（2026 Summer）"},{"id":"N11","rule":"b1","avoid":"お客様の声「○○が治った」を紹介する","say":"私も飲んでいます（感想を言うなら「個人の感想ですが」を添えて）","back":"お客様の声を効能の裏づけに使うと、効能をうたうのと同じ扱いになる。CASE BOOKのOUTCOMEとMEMBER'S VOICEは売り場で使わない。Weekly S1 Vol.02の声（「30分ほどでクリアに」など）も同じ。","src":"BRAND BOOK p.70の注記／管理者の判断"},{"id":"N12","rule":"b1","avoid":"鉄はセンターピン。1本倒れると、連鎖して整います","say":"鉄は、体のいろいろな働きに関わっている栄養素なんです","back":"センターピンのたとえは研修用（Y07）。「補えば体が整う」は効能の言い方になる。StaffEducationの30秒ピッチとSpeakEasyの「鉄を補えば、体は自分で整える」は使わない。","src":"StaffEducation p.10・p.27／SpeakEasy 3.0"},{"id":"N13","rule":"b1","avoid":"鉄の吸収で、変わります（POP）","say":"目指したのは、実感できる鉄分補給。","back":"「変わります」は体の変化の約束になる。ブランドの核の一文は「目指した」設計の話。TOTAL WORKOUTの店頭POPで差し替える。","src":"TOTAL WORKOUT店頭POP"},{"id":"N14","rule":"b2","avoid":"お薬はやめて大丈夫です","say":"先生の判断・指示のもとでお使いください","back":"処方鉄剤は鉄として1日100〜200mgの治療用量、MINERALionは1包約4〜5mgの栄養補給の量で、役割がちがう（Medical Proposal Ⅰ）。治療が要るかどうかは医師が判断する。","src":"Medical Proposal Ⅱ p.15"},{"id":"N15","rule":"b2","avoid":"貧血ですね","say":"ご心配なら、まず先生にご相談ください","back":"貧血かどうかは、採血（ヘモグロビン・フェリチン）をもとに医師が判断する。健診で異常なしでも、フェリチンが低い隠れ鉄不足はありうる（基本資料Ⅱ）。","src":"Medical Proposal Ⅱ p.15"},{"id":"N16","rule":"b2","avoid":"鉄剤の代わりになります","say":"お薬の代わりではありません。日常の補給として、です","back":"鉄剤が続かない人の併用や、薬が要らない段階の補給には役割がある（Medical Proposal Ⅰの4セグメント）。現に鉄剤が必要な人に、代わりを勧めることはしない。","src":"Medical Proposal Ⅱ p.15"},{"id":"N17","rule":"b2","avoid":"実はそれ、鉄不足から来ていることが多いんです","say":"鉄が関わっていることもあるんです","back":"疲れ・立ちくらみ・だるさの原因は鉄だけではない。原因を決めるのは診察と検査。","src":"福岡導入講習 p.22／Weekly S2 Vol.02"},{"id":"N18","rule":"b2","avoid":"飲まないと悪化しますよ","say":"選択肢の一つとして。無理にとは申しません","back":"不安をあおって勧めることは、押し売りにあたる。断られたら気持ちよく引く（Medical Proposal Ⅱの大前提）。","src":"Medical Proposal Ⅱ p.15"},{"id":"N19","rule":"b2","avoid":"医療の現場でも第一選択に／薬ではなくMINERALion","say":"治療の鉄に、日常の鉄を。","back":"鉄欠乏性貧血の第一選択は経口鉄剤で、有効性は確立している。Weekly S3 Vol.01〜03の見出し（「第一選択」「薬ではなく」）は、この基準では使わない。","src":"Medical Proposal Ⅰ p.1–2"},{"id":"N20","rule":"b2","avoid":"鉄剤より胃にやさしい／鉄剤は腸を壊す","say":"お薬が合わないと感じたら、まず先生に。そのうえで、食品での鉄補給という選択肢もあります","back":"医薬品との優劣を比べるのは、研修の中だけ（ルール4）。StaffEducationの「普通の鉄剤と何が違う？」の一言（未吸収の鉄が腸に残る…）は生活者に使わない。","src":"Medical Proposal Ⅱ p.7／StaffEducation p.33"},{"id":"N21","rule":"b3","avoid":"50種以上のミネラル","say":"数十種類の多様なミネラル","back":"表記ルール（2025.11）で「数十種類」に統一した。社内資料の分析一覧に載っている元素は約30。基本資料Ⅰ・BRAND BOOK・StaffEducation・店頭POPに旧表記が残る。","src":"表記ルール（2025.11）"},{"id":"N22","rule":"b3","avoid":"鉄43,500μg／4,350μg","say":"1包あたり鉄約4〜5mg","back":"精密計算は約5.35mg（ロットで変動）。43,500μgは旧資料の誤り。","src":"基本資料Ⅰ（ノート）"},{"id":"N23","rule":"b3","avoid":"第5世代のミネラル","say":"鉄を中心に、数十種類のミネラルをイオン化して届ける設計です","back":"世代区分は資料によって定義が4通りあり、確定待ち（F37）。社内でも「断定的に使いすぎない」と整理している（基本資料Ⅰのノート）。","src":"基本資料Ⅰ（ノート）"},{"id":"N24","rule":"b3","avoid":"鉄は、赤血球をつくるのに必要な栄養素です（製品の説明として）","say":"日々の食事で不足しがちな鉄を含む食品です","back":"栄養機能食品の定型の機能表示文。MINERALionが栄養機能食品として表示していない間は、製品と結びつけて使わない（F28）。","src":"食品表示基準 第9条・別表第11"},{"id":"N25","rule":"b3","avoid":"月経前と中は2包、それ以外は1包（量の指示）","say":"目安量は、パッケージの表示どおりにお願いします","back":"1日の目安量と飲み方は、資料ごとに5通りあり確定待ち（F22）。","src":"福岡導入講習 p.17"},{"id":"N26","rule":"b3","avoid":"Lypo-Cと混ぜて一緒に飲むと効果的","say":"同じ日にどうぞ。混ぜずに、1〜2時間ずらすのがおすすめです","back":"同じ飲み物に混ぜると、ビタミンCの還元作用で風味や色が変わることがある（品質の問題ではない）。Lypo-Cはリポソーム構造のため、混ぜずに時間をずらすのが理想（F23）。","src":"BRAND BOOK p.45／Weekly S1 Vol.07"},{"id":"N27","rule":"b4","avoid":"3時間で頭がスッキリ、3日で朝が楽になります","say":"感じ方には個人差があります","back":"3時間・3日・3週間・3ヶ月は研修上の目安で、効果を保証するものではない（基本資料Ⅱ p.6）。生活者には変化の時期を約束しない。","src":"基本資料Ⅱ p.6"},{"id":"N28","rule":"b4","avoid":"吸収率は90%以上です","say":"イオン化によって、吸収率90%以上をめざした設計です（文献ベース）","back":"90%は、文献をもとにイオン化で目指した値。言い切ると反論を受けやすい論拠として扱う（基本資料Ⅰ p.5のノート）。","src":"基本資料Ⅰ p.5（ノート）"},{"id":"N29","rule":"b4","avoid":"一般的なミネラルの吸収は5〜20%、MINERALionは90%以上（数字を並べる）","say":"吸収されやすい形を目指して、イオン化しています","back":"数字の比較を生活者向けに出すと、根拠の提出を求められうる（景品表示法の不実証広告規制）。比較表は研修の中だけ。","src":"TOTAL WORKOUT店頭POP／SpeakEasy 3.0"}],"channelRules":[{"title":"EC・公式の文面","text":"言える範囲でいちばん厳しく扱います。商品ページには青の表現と正本の確定値だけ。吸収率の数字は載せないか、条件つきで。"},{
