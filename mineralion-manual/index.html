:"k60","w":"監修","yomi":"かんしゅう","alt":["監修医","専門家"]},{"id":"k61","w":"Googleの投稿","yomi":"ぐーぐるのとうこう","alt":["Google","検索","地図"]},{"id":"k62","w":"POP","yomi":"ぽっぷ","alt":["店頭","陳列"]},{"id":"k63","w":"立ち上げ","yomi":"たちあげ","alt":["着荷","導入"]},{"id":"k64","w":"第5世代","yomi":"だいごせだい","alt":["世代区分"]},{"id":"k65","w":"赤血球","yomi":"せっけっきゅう","alt":["栄養機能食品"]},{"id":"k66","w":"タイムライン","yomi":"たいむらいん","alt":["3時間","3日","3週間","3ヶ月"]},{"id":"k67","w":"材料と動力","yomi":"ざいりょうとどうりょく","alt":["動力"]},{"id":"k68","w":"センターピン","yomi":"せんたーぴん","alt":[]},{"id":"k69","w":"食事","yomi":"しょくじ","alt":["食べ物","レバー","赤身"]}],"entries":[{"id":"T01","kind":"T","sec":"k30","key":true,"title":"30秒で言う（MINERALionって何？）","lines":[["","日本人の鉄の摂取量は、この50年でほぼ半分になりました。健診で異常がなくても、体にためた鉄（フェリチン）が少ない「隠れ鉄不足」の人は少なくありません。"],["","MINERALionは、鉄を中心に数十種類のミネラルをイオン化して、液体で届ける食品です。食事を土台に、足りない分を毎日の補給で。"]],"point":"非医療の59%が「なぜ鉄か」を説明しにくいと答えています。まずこの30秒を、自分の言葉で言えるように。","back":"","aud":["c-all","inhouse","staff"],"scene":["explain"],"topics":["brand","hidden","ion"],"scope":"ptc","cov":["a4","a8","a9","a11"],"src":"StaffEducation p.27・HCL研修 p.6をもとに調整","origin":"既存を調整","edit":"もとの30秒ピッチの「1つ倒れると連鎖して整います」は使いません（N12）。"},{"id":"T02","kind":"T","sec":"k30","key":false,"title":"15秒で言う","lines":[["","MINERALionは、鉄を中心に数十種類のミネラルをイオン化して、液体で届ける食品です。食事で不足しがちな鉄を、毎日の補給に。"]],"point":"受付・レジ・エレベーターの中。商品名と「何の食品か」だけ伝われば十分です。","back":"","aud":["c-all","inhouse"],"scene":["explain"],"topics":["brand"],"scope":"ptc","cov":["a4","a11"],"src":"新規（HCL研修 p.6をもとに作成）","origin":"新規","edit":""},{"id":"T03","kind":"T","sec":"k1m","key":false,"title":"1分：初対面・展示会で","lines":[["","はじめまして。MINERALionは、鉄を中心に数十種類のミネラルをイオン化して、液体にした食品です。"],["","日本人の鉄の摂取量は、この50年でほぼ半分になりました。健診で異常がなくても、体にためた鉄が少ない方は少なくありません。"],["","主原料は阿武隈山系の岩から生まれたミネラル液で、原料には約50年の実績があります。1包に鉄は約4〜5mg、毎日の補給の量です。"],["","よかったら1包、試してみてください。そのままでも、水に混ぜても飲めます。"]],"point":"数字は「50年でほぼ半分」と「1包約4〜5mg」の2つまで。","back":"","aud":["c-all","global"],"scene":["open","outside"],"topics":["brand","origin"],"scope":"ptc","cov":["a19"],"src":"新規（BRAND BOOK p.12・p.28・p.31をもとに作成）","origin":"新規","edit":""},{"id":"T04","kind":"T","sec":"k1m","key":false,"title":"1分：営業の第一声","lines":[["営業","MINERALionのご紹介です。Lypo-Cと同じスピックの、鉄とミネラルのブランドです。"],["営業","鉄を中心に数十種類のミネラルをイオン化した液体の食品で、お薬（鉄剤）とは役割がちがう、毎日の補給のための商品です。"],["営業","医療機関では「治療の鉄に、日常の鉄を」、サロンやジムでは「美容と体づくりの土台」の話として、会話の入口ごとご提案しています。"],["営業","まず、スタッフの皆さんで試していただくところから始めませんか。"]],"point":"医療と非医療で、2文目からの入口を変えます（T14）。","back":"","aud":["owner","doc","corp"],"scene":["deal"],"topics":["brand"],"scope":"pt","cov":["a1"],"src":"新規（Medical Proposal Ⅰ、BRAND BOOK 04章をもとに作成）","origin":"新規","edit":""},{"id":"T05","kind":"T","sec":"k3m","key":false,"title":"3分：商品説明","lines":[["","鉄は、酸素を運んだり、エネルギーをつくったりする栄養素です。日本人の摂取量はこの50年でほぼ半分になって、とくに月経のある女性は足りていない方が多いといわれています。"],["","健診で見るのはヘモグロビンで、貧血かどうかの指標です。体にためた鉄（フェリチン）が少なくても、ヘモグロビンが保たれていれば「異常なし」と出ます。これが「隠れ鉄不足」です。"],["","食事の鉄は、吸収されにくいものが多いんです。野菜や豆に多い非ヘム鉄は2〜15%ほど。"],["","MINERALionは、阿武隈山系の岩から生まれた原料（THEMAROX™）を使って、鉄を中心に数十種類のミネラルをイオン化し、液体にした食品です。1包に鉄は約4〜5mg。お薬（鉄剤）の治療用量とはちがう、毎日の補給の量です。"],["","食事を土台に、足りない分を毎日の補給で。気になる症状があれば、まず先生にご相談ください。"]],"point":"前半は栄養の話、製品は後半。体の変化は約束しません。","back":"","aud":["c-all","staff","inhouse"],"scene":["explain","train"],"topics":["hidden","ion","origin","mineral"],"scope":"ptc","cov":["a4","a8","a9","a11"],"src":"新規（BRAND BOOK p.12–13・p.25・p.31、StaffEducation p.5・p.9をもとに作成）","origin":"新規","edit":""},{"id":"T06","kind":"T","sec":"k3m","key":true,"title":"会話の型（5つのステップ）","lines":[["① 共感","（相手の悩みを、まず受け止める）そういう時期ってありますよね。"],["② ずらし","足りないのは、努力じゃないかもしれません。"],["③ 比喩","美容成分が材料なら、鉄は電力。電気が来ていないと、工場は動きません。"],["④ 接続","その電力にあたるのが、鉄をはじめとするミネラルなんです。"],["⑤ 軽い導入","まずは1包から、試してみませんか。"]],"point":"刺激的な変化を前に出す製品ではないから、型で話します。義務にしない入り方が、続けてもらうことにつながります。","back":"","aud":["c-all","c-beauty"],"scene":["open","explain"],"topics":["brand","skin"],"scope":"ptc","cov":["a8","a9","a21"],"src":"BRAND BOOK p.63を調整","origin":"既存を調整","edit":"原文の⑤「疲れた時に1包から」は、疲れへの効き目に聞こえるので外しました。"},{"id":"T07","kind":"T","sec":"k10","key":false,"title":"10分：商談（取扱店）","lines":[["0〜2分 課題","日本人の鉄の摂取量は、50年でほぼ半分です。働く世代の女性の最大約49%が鉄欠乏という調査もあります。健診で見るのはヘモグロビンなので、体にためた鉄（フェリチン）が少なくても「異常なし」と出ます。お客様の中にも、この隠れ鉄不足の方がいらっしゃると思います。"],["2〜5分 製品","MINERALionは、鉄を中心に数十種類のミネラルをイオン化した液体の食品です。主原料のTHEMAROX™は阿武隈山系の風化花崗岩由来で、サプリメント分野ではスピックが独占契約しています。1包に鉄は約4〜5mg、インフォームドスポーツ認証も取得しています。"],["5〜8分 現場での使い方","会話の入口は業態ごとに用意しています。トーク集、POPの文面、Googleの説明文の型、Weekly MINERALionの資料を、そのままお使いいただけます。まずスタッフの方が体験者になるのが、いちばんの近道です。"],["8〜10分 条件と立ち上げ","卸価格と段階卸は、最新の価格表でご案内します。着荷の日にスタッフの皆さんで試していただき、陳列、最初の声かけ、記録までを、私たちが一緒に組みます。"]],"point":"回答86社中42社が未販売でした（販売状況アンケート速報）。立ち上げまでを商談の一部にします。価格は口頭で言い切らず、価格表を見せます（F06）。","back":"","aud":["owner","corp"],"scene":["deal"],"topics":["brand","price","exp"],"scope":"pt","cov":["a1","a10","a12"],"src":"新規（基本資料Ⅰ、Weekly S2 Vol.01・S4 vol.3、販売状況アンケート速報をもとに作成）","origin":"新規","edit":""},{"id":"T08","kind":"T","sec":"k10","key":false,"title":"10分：セミナー（勉強会）","lines":[["0〜2分","鉄って、貧血の人が摂るものだと思っていませんか？ 実は鉄は、酸素を運ぶ、エネルギーをつくる、体をつくる、と毎日いろいろな仕事をしています。"],["2〜5分","健診で見るのはヘモグロビン。体にためた鉄（フェリチン）は別の数字です。鉄は貯金から先に減っていき、貯金がなくなってから血液の数値に出てきます。"],["5〜7分","食事の鉄は吸収されにくいものが多く、野菜や豆の鉄は2〜15%ほど。赤身の肉や魚、ビタミンCと一緒にとる工夫が役に立ちます。お茶やコーヒーは、食事と少し時間をあけて。"],["7〜9分","それでも足りない分を、毎日の補給で。MINERALionは、鉄を中心に数十種類のミネラルをイオン化した液体の食品です。"],["9〜10分","気になる症状がある方は、まず医療機関へ。フェリチンは、健診のときに相談すると測ってもらえることがあります。"]],"point":"製品の話は最後の2分だけ。前半は栄養の話にします。体験談で効果を語りません。","back":"","aud":["c-all","staff"],"scene":["explain","outside"],"topics":["hidden","food","brand"],"scope":"ptc","cov":["a8","a19","a21"],"src":"新規（BRAND BOOK p.13–14、StaffEducation p.9・p.11をもとに作成）","origin":"新規","edit":""},{"id":"W01","kind":"W","sec":"ec","key":false,"title":"商品ページの説明文","text":"MINERALion（ミネラリオン）\n目指したのは、実感できる鉄分補給。\n鉄を中心に、数十種類の多様なミネラルを。阿武隈山系の風化花崗岩に由来するミネラル液THEMAROX™を主原料に、ミネラルをイオン化して液体にしました。\n・1包10gに、鉄 約4〜5mg\n・そのまま、または水などに混ぜて\n・10g×30包（約1ヶ月分）／常温保存\n・インフォームドスポーツ認証取得\n※本品は食品（清涼飲料水）です。疾病の診断・治療・予防を目的としたものではありません。妊娠・授乳中の方、お薬を服用中の方、治療中の方は、医師・薬剤師にご相談ください。","point":"吸収率の数字は商品ページに載せません。載せるなら「イオン化によって目指した値・文献ベース」の注記をつけます。1日の目安量は確定まで「パッケージの表示どおり」（F22）。","back":"","aud":["c-all"],"scene":["write"],"topics":["brand","ion","origin"],"scope":"off","cov":["a3"],"src":"新規（「商品の事実」の確定値をもとに作成）","origin":"新規","edit":""},{"id":"T09","kind":"T","sec":"ec","key":false,"title":"チャット・メールの答え方","lines":[["受け止める","お問い合わせありがとうございます。○○について、ですね。"],["答える","「商品の事実」の値と、「よくある質問」の標準回答で答えます。"],["添える","詳しくは、こちらのページもご覧ください。"],["相談先","体調・妊娠・服薬・お子さまに関わる内容は「かかりつけの先生か薬剤師さんにご相談ください」と添えます。体調の変化や品質のお申し出は、担当に引き継ぎます。"],["例","「飲めば疲れが取れますか？」→「食品なので、疲れが取れるといったお約束はできないのですが、毎日の食事で不足しがちな鉄を補うための食品です。感じ方には個人差があります。」"]],"point":"文字は残ります。口頭よりも一段、言い切りを控えます。","back":"","aud":["c-all","c-doubt"],"scene":["answer","write"],"topics":["safety"],"scope":"off","cov":["a2","a3"],"src":"新規（HCL研修のCS三原則をもとに作成）","origin":"新規","edit":""},{"id":"W02","kind":"W","sec":"sns","key":false,"title":"SNS投稿の例","text":"①スタッフも飲んでいます。鉄を中心に数十種類のミネラルを、イオン化して液体に。水にも、ジュースにも。#MINERALion #ミネラリオン\n②麦茶の鉄は、成分表で「Tr（微量）」。水分は麦茶、鉄は別枠で。#MINERALion\n③健診で「異常なし」でも、鉄の貯金（フェリチン）は別の数字。気になる方は、次の健診で聞いてみてください。","point":"体験を書くなら「個人の感想」を添えます。#MINERALion か #ミネラリオン を付けると、公式が見つけてシェアしやすくなります。","back":"","aud":["c-all"],"scene":["write"],"topics":["summer","hidden"],"scope":"ptc","cov":["a8","a13"],"src":"新規（Weekly S2 Vol.05・S4 vol.1をもとに作成）","origin":"新規","edit":""},{"id":"T10","kind":"T","sec":"sns","key":false,"title":"コメントへの返信","lines":[["「効きますか？」","食品なので「効く」とはお伝えできないのですが、毎日の食事で不足しがちな鉄を補うための食品です。感じ方には個人差があります。"],["「どこで買えますか？」","プロフィールのリンクから、お取り扱いの情報をご覧いただけます。"],["「妊娠中でも飲めますか？」","妊娠中は摂る量に配慮が要る時期なので、かかりつけの先生か薬剤師さんにご相談のうえでお願いします。"],["否定的なコメント","返信するなら一度だけ。「ご意見ありがとうございます。MINERALionは食品として、毎日の鉄の補給を目的にしています。」議論はしません。"]],"point":"公開の場で、体調の相談に答えきらない。詳しい相談はDMか窓口へ。","back":"","aud":["c-all","c-doubt","c-preg"],"scene":["answer","object"],"topics":["safety","preg"],"scope":"off","cov":["a3","a24"],"src":"新規","origin":"新規","edit":""},{"id":"T11","kind":"T","sec":"sns","key":false,"title":"DMで体調の相談が来たとき","lines":[["","ご連絡ありがとうございます。お体のことですので、気になる症状がある場合は、まず医療機関でご相談ください。"],["","MINERALionは食品のため、症状についての判断やお約束はできませんが、製品のことなら何でもお答えします。"],["引き継ぎ","体調の変化・品質のお申し出は、CSの窓口へ引き継ぎます（T81）。"]],"point":"DMでも診断しない・効果を約束しない。スクリーンショットで広まる前提で書きます。","back":"","aud":["c-doubt","c-user"],"scene":["answer","escalate"],"topics":["safety"],"scope":"off","cov":["a2","a24"],"src":"新規","origin":"新規","edit":""},{"id":"W03","kind":"W","sec":"sns","key":false,"title":"Googleの説明文の型","text":"型：「当院・当店では［　　　］なお客様のために、MINERALionを取り扱っています。」\n例（サロン・整体院）：「施術後の水分補給として、ミネラル補給に着目したMINERALionをご用意しています。」\n例（クリニック）：「診療の合間の水分補給として、ミネラル補給に着目したMINERALionをご案内しています。」","point":"ほかのところと同じ文章をそのまま使わない。名前・住所・電話番号の書き方を、ホームページとGoogleでそろえます。","back":"","aud":["c-all","owner"],"scene":["write"],"topics":["brand"],"scope":"ptc","cov":["a13"],"src":"Weekly S4 vol.3","origin":"既存","edit":""},{"id":"W04","kind":"W","sec":"sns","key":false,"title":"Googleの「最新情報」投稿の例","text":"①夏のあいだ、汗と一緒に鉄やミネラルも出ていきます。当店では、鉄を中心に数十種類のミネラルをイオン化した液体の食品「MINERALion」をご用意しています。気になる方はスタッフまでお声がけください。\n②「鉄って貧血の人のもの？」と思っていませんか。鉄は、毎日の食事で不足しがちな栄養素のひとつです。店頭で、MINERALionのことをご案内しています。\n③Lypo-Cをお使いの方へ。同じスピックの「届ける」考え方でつくられた、鉄とミネラルの「MINERALion」も取り扱っています。","point":"効果をあおる言葉は使わない。本当のことだけを書きます。写真はWeekly MINERALionの公式素材を使い、ロゴは加工しません。","back":"","aud":["c-all","c-lypo"],"scene":["write"],"topics":["summer","combo"],"scope":"ptc","cov":["a13","a8"],"src":"新規（Weekly S4 vol.3と次号予告「MARKETING NOTE 02」をもとに作成）","origin":"新規","edit":""},{"id":"T12","kind":"T","sec":"pr","key":false,"title":"メディアの取材で","lines":[["","数字は、公開できるものだけお伝えします。1包の鉄は約4〜5mg、内容量は10g×30包、希望小売価格は5,400円（税別）です。"],["","吸収率についてお話しするときは「イオン化によって、90%以上をめざした設計（文献ベース）」という言い方でお願いします。"],["","お客様の声を載せる場合は、個人の感想であることと、体感に個人差があることを添えてください。"]],"point":"効果の断定・医薬品との比較は、記事にもしない。原稿確認の機会をお願いします。","back":"","aud":["press"],"scene":["outside"],"topics":["media"],"scope":"off","cov":["a16"],"src":"新規（「商品の事実」、メディア掲載実績サマリーをもとに作成）","origin":"新規","edit":""},{"id":"T13","kind":"T","sec":"pr","key":false,"title":"「どんな効果がありますか？」と聞かれたら（取材）","lines":[["","食品ですので、効果・効能としてはお話ししていません。お伝えできるのは、鉄を中心に数十種類のミネラルをイオン化した液体の食品であること、1包に鉄が約4〜5mg入っていること、日本人の鉄の摂取量が50年でほぼ半分になっていること、です。"],["","監修の先生のコメントを使われる場合は、どの部分の監修かを正確に書いていただけると助かります。"]],"point":"掲載や受賞は「載りました」「選ばれました」という事実まで（F36）。","back":"","aud":["press"],"scene":["outside","answer"],"topics":["media"],"scope":"off","cov":["a16","a15"],"src":"新規","origin":"新規","edit":""},{"id":"W05","kind":"W","sec":"pr","key":false,"title":"メディア向け：公開できる事実の一文","text":"MINERALion（ミネラリオン）は、株式会社スピックの食品（清涼飲料水）です。鉄を中心に、阿武隈山系の風化花崗岩に由来する数十種類のミネラルをイオン化し、液体にしています。内容量10g×30包（約1ヶ月分）、1包あたり鉄約4〜5mg、希望小売価格5,400円（税別）。","point":"吸収率・世代区分・鉄剤との比較は入れません。受賞は「MAQUIA美活グランプリ2026 美ヘルス部門3位（編集部・美容関係者の選出）」と事実のみ。","back":"","aud":["press"],"scene":["write","outside"],"topics":["brand","media"],"scope":"off","cov":["a16"],"src":"新規（「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"W06","kind":"W","sec":"pr","key":false,"title":"インフルエンサー・動画発信者への依頼文","text":"ご紹介のお願いにあたり、次の3点をお願いしています。\n1. 投稿の冒頭に「PR」など、広告であることがわかる表記を入れてください。\n2. 言っていただきたいこと：食品（清涼飲料水）であること／鉄を中心に数十種類のミネラルをイオン化した液体であること／ご自身の使い方や感想（個人の感想として）。\n3. 避けていただきたいこと：治る・効く・予防できる／お薬との比較や、お薬の代わりという言い方／吸収率の数字の言い切り／体の変化の時期の約束。\n原稿は、公開前に確認させてください。","point":"依頼した投稿は広告です（ステルスマーケティング規制、2023年10月施行）。PR表記がない投稿は、こちらの責任になります。","back":"","aud":["press"],"scene":["outside","write"],"topics":["media"],"scope":"off","cov":["a17"],"src":"新規（景品表示法のステルスマーケティング規制をもとに作成）","origin":"新規","edit":""},{"id":"W07","kind":"W","sec":"pr","key":false,"title":"監修医・専門家への依頼で確かめること","text":"監修をお願いする範囲（どの資料の、どの記述か）／お名前と肩書の表記（ご本人に確認したもの）／コメントを引用する場合の原文と、使う場所／製品の効果を保証する立場ではないこと。","point":"監修医のコメントを、製品の効果の話に読める場所に置きません。","back":"","aud":["press"],"scene":["outside"],"topics":["media"],"scope":"in","cov":["a15"],"src":"新規","origin":"新規","edit":""},{"id":"T14","kind":"T","sec":"sales","key":false,"title":"医療と非医療で言い分ける","lines":[["医療機関へ","「治療の鉄に、日常の鉄を」。鉄剤を否定せず、その外側と周辺にいる患者様のための食品です。"],["サロン・ジムへ","鉄の話は、美容や体づくりの「土台」の話として始められます。お客様との会話の入口を一緒に用意します。"],["どちらにも","着荷の日にスタッフの皆さんで試していただいて、そこから実演、という順番でお願いしています。"]],"point":"医療は3つのスタンスから、非医療は30秒から（T01）。","back":"","aud":["doc","owner"],"scene":["deal"],"topics":["brand"],"scope":"pt","cov":["a1"],"src":"新規（Medical Proposal Ⅰ、BRAND BOOK 04章をもとに作成）","origin":"新規","edit":""},{"id":"T15","kind":"T","sec":"sales","key":false,"title":"医師へ：3分","lines":[["","本日ご提案したいのは、鉄を処方されている先生方へ、「治療の鉄」に加えて「日常の鉄」という選択肢です。MINERALionは鉄剤ではなく、そもそも別のカテゴリーの製品です。"],["","前提は3つです。鉄欠乏性貧血の第一選択は経口鉄剤で、私たちはそれを否定しません。MINERALionは食品で、治療は標榜しません。併用も代替も、起点は先生のご判断です。"],["","処方鉄剤は鉄として1日100〜200mgの治療用量、MINERALionは1包約4〜5mgの栄養補給の量です。この約30分の1の差が、そのまま役割の線引きになります。"],["","対象になりうるのは、薬物治療の外側か周辺にいる方です。鉄剤で胃が荒れて続かない方、ヘモグロビンは正常でもフェリチンが低い方、治療を終えた維持期の方、月経・妊活・スポーツなどで日常的に鉄の需要が高い方。"],["","提案は「併用」と、「薬が要らない段階」に限った「条件付きの代替」の2つです。現に鉄剤が必要な方に代わりを勧めることや、自己判断での中止を促すことはしません。"]],"point":"耐容上限量は、2025年版の食事摂取基準では設定されていません（F30）。栄養機能食品の範囲は1日2.04〜10mg（F29）。","back":"","aud":["doc"],"scene":["clinic","deal"],"topics":["drug"],"scope":"med","cov":["a5"],"src":"Medical Proposal Ⅰ（ノート）を短く調整","origin":"既存を調整","edit":"もとのノートの耐容上限量（男性50mg・女性40mg）は2020年版の値のため外した。"},{"id":"T16","kind":"T","sec":"sales","key":false,"title":"医師へ：「他のサプリ・処方鉄剤とどう違う？」（1分）","lines":[["","処方鉄剤とは、役割がちがいます。鉄剤は鉄欠乏性貧血の治療のための医薬品で、1日100〜200mg。MINERALionは食品で、1包約4〜5mg。治療ではなく、毎日の補給の量です。"],["","ほかの鉄サプリとのちがいは2つです。鉄だけでなく、原料の岩石に由来する数十種類のミネラルを一緒に含むこと。それをイオン化して、液体で届ける設計にしていること。吸収率はイオン化によって90%以上をめざした値で、文献ベースです。"],["","位置づけは「薬の一歩手前」です。フェリチンは低いけれど薬の適応にならない方や、鉄剤が胃に合わず続かない方の併用などで、先生のご判断のもとでお使いいただけます。"]],"point":"医療機関の回答の半数がここで詰まっていました（n=18）。勉強会のニーズは0%だったので、この1分と1枚で伝えます。","back":"ほかの鉄サプリ（ヘム鉄・キレート鉄・リポソーム鉄）との吸収の優劣を示す直接比較の試験はありません。言えるのは、設計のちがいまでです。","aud":["doc"],"scene":["clinic","deal"],"topics":["drug","ion"],"scope":"med","cov":["a5"],"src":"新規（Medical Proposal Ⅰ p.3・p.6、BRAND BOOK p.35をもとに作成）","origin":"新規","edit":""},{"id":"T17","kind":"T","sec":"sales","key":false,"title":"診療科：栄養療法・点滴のクリニック","lines":[["","点滴や注射で整えたあとも、毎日の食事と補給で保つ時間のほうが長いんです。その「あいだ」を埋める日常の鉄として、ご案内いただけます。"],["","フェリチンを定期的に測っている先生なら、数値を見ながら続けるかどうかを決めていただけます。"]],"point":"点滴・注射の代わりとは言いません。治療方針は先生のご判断です。","back":"","aud":["doc"],"scene":["clinic"],"topics":["hidden","drug"],"scope":"med","cov":["a7"],"src":"新規","origin":"新規","edit":""},{"id":"T18","kind":"T","sec":"sales","key":false,"title":"診療科：産婦人科","lines":[["","妊活・妊娠・産後は、鉄の需要が大きく変わる時期です。治療が必要な貧血はお薬で、その手前やあとの日常の補給に食品を、という役割分担でご提案しています。"],["","妊娠・授乳中の量は、先生のご判断を最優先にしていただく前提です。"]],"point":"葉酸など他の成分の助言は先生に委ねます。患者様向けの言い方はT61・T62。","back":"","aud":["doc"],"scene":["clinic"],"topics":["preg"],"scope":"med","cov":["a7"],"src":"新規（Medical Proposal Ⅱ p.5–6をもとに作成）","origin":"新規","edit":""},{"id":"T19","kind":"T","sec":"sales","key":false,"title":"診療科：歯科","lines":[["","鉄が足りないと、口の中の粘膜や舌に変化が出ることがあるといわれています。診療のなかで鉄の話が出たとき、食事とあわせて日常の補給という選択肢をご紹介いただけます。"],["","「まず食事、それでも足りない分を補う」という順番でお話しいただくと、患者様も受け取りやすいです。"]],"point":"九州の取扱候補リストの31%が歯科です。口の症状の診断は先生の領域で、スタッフや私たちが原因を断定しません。","back":"鉄欠乏で舌炎・口角炎などがみられることは、医療者向けの一般的な知識として知られています。","aud":["doc"],"scene":["clinic"],"topics":["hidden","food"],"scope":"med","cov":["a7"],"src":"新規（顧客化施策＃九州にこだわる をもとに作成）","origin":"新規","edit":""},{"id":"T20","kind":"T","sec":"sales","key":false,"title":"診療科：美容皮膚科","lines":[["","施術や外用の前に、肌そのものが働ける状態かも大事にしたい、という先生に。鉄はコラーゲンをつくる酵素の働きに関わる栄養素です。"],["","施術の効果を高める、という言い方はしません。肌の土台を考える栄養補給として、ご案内いただけます。"]],"point":"患者様向けの入口はT42（美容皮膚科）。","back":"","aud":["doc"],"scene":["clinic"],"topics":["skin"],"scope":"med","cov":["a7"],"src":"新規（BRAND BOOK p.50・p.64をもとに作成）","origin":"新規","edit":""},{"id":"T21","kind":"T","sec":"sales","key":false,"title":"診療科：整形外科・スポーツ外来","lines":[["","運動量の多い患者様は、汗や足底への衝撃で鉄を失いやすいといわれています。疲れの抜けにくさを訴える方に、日常の鉄補給という選択肢をご紹介いただけます。"],["","インフォームドスポーツの認証を取得していますが、競技者の方には製品の表示や競技団体の基準も確認していただくようお伝えください。"]],"point":"記録や競技力の向上を連想させる言い方はしません。","back":"","aud":["doc"],"scene":["clinic"],"topics":["sport","cert"],"scope":"med","cov":["a7","a18"],"src":"新規（BRAND BOOK p.53をもとに作成）","origin":"新規","edit":""},{"id":"T22","kind":"T","sec":"sales","key":false,"title":"診療科：薬局","lines":[["","鉄を含むお薬やサプリを使っている方には、重複しないよう確認したうえでご案内いただけます。"],["","お薬によっては、鉄と同時だと吸収に影響するものがあります。飲み合わせの確認を、いちばんお願いしたい場所です。"]],"point":"薬剤師の確認を前提にした案内です。透析中の方には勧めません（主治医の管理のもとで）。","back":"鉄は、一部の抗菌薬（テトラサイクリン系・ニューキノロン系）や甲状腺ホルモン薬などの吸収を下げることが知られています。","aud":["doc"],"scene":["clinic"],"topics":["combo","safety"],"scope":"med","cov":["a7","a6"],"src":"新規（Medical Proposal Ⅱ p.14をもとに作成）","origin":"新規","edit":""},{"id":"T23","kind":"T","sec":"sales","key":false,"title":"店長・オーナーへ（導入の判断材料）","lines":[["営業","判断の材料は4つです。粗利、在庫、社販、立ち上げ。"],["粗利","卸価格と段階卸は、最新の価格表でお見せします。箱数に応じて、1箱あたりの仕入れが変わります。"],["在庫","食品で常温保存、1箱30包です。最初は少ない箱数から始めて、動きを見て増やせます。"],["社販","まずスタッフの方が体験者になるのが、いちばんの近道です。"],["立ち上げ","着荷から最初の声かけまで、私たちが一緒に組みます（T83）。"]],"point":"数字は口頭で言い切らず、価格表を見せます（価格・条件は時期で変わる：F06）。","back":"","aud":["owner"],"scene":["deal"],"topics":["price","exp"],"scope":"pt","cov":["a10"],"src":"新規（基本資料Ⅰ p.10、SpeakEasy 3.0の段階卸表をもとに作成）","origin":"新規","edit":""},{"id":"T24","kind":"T","sec":"sales","key":false,"title":"小売・法人の担当者へ","lines":[["小売のバイヤーへ","MINERALionは、Lypo-Cと同じスピックの、鉄とミネラルのブランドです。食品（清涼飲料水）で、売り場の表現は私たちの表現基準と一緒にお渡しします。"],["法人の健康づくりの担当者へ","働く世代の女性の最大約49%が鉄欠乏という調査があります。まずは、鉄と食事の勉強会と、社員の方が試せる形からご提案できます。"],["どちらにも","効果をうたう売り方はしません。売り場のPOPや説明文は、こちらの文面をお使いください。"]],"point":"「健康経営に効く」「生産性が上がる」とは言いません。BRAND BOOK p.20の社会的損失の推計は、背景の話にとどめます。","back":"","aud":["corp"],"scene":["deal"],"topics":["brand"],"scope":"pt","cov":["a1","a3"],"src":"新規","origin":"新規","edit":""},{"id":"T25","kind":"T","sec":"global","key":false,"title":"English：30 seconds","lines":[["","MINERALion is a liquid mineral product from Japan, classified as a food."],["","It delivers iron together with dozens of minerals, ionized from THEMAROX™, a mineral extract derived from weathered granite in the Abukuma Mountains of Japan."],["","Each 10 g stick contains about 4–5 mg of iron. It is not a medicine, and we do not make medical claims."],["","From SPIC, the makers of Lypo-C."]],"point":"国ごとの規制（シンガポールならHSA・SFAなど）で、使える表現と表示を確認してから使います。日本で言えないことは、海外でも言いません。","back":"","aud":["global"],"scene":["explain","outside"],"topics":["brand","origin"],"scope":"pt","cov":["a14"],"src":"新規（「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"T26","kind":"T","sec":"global","key":false,"title":"海外展示会の1分（骨子）","lines":[["①","日本生まれの、鉄とミネラルの液体の食品。"],["②","原料は、阿武隈山系の風化花崗岩に由来するTHEMAROX™（約50年の実績、サプリメント分野での独占契約）。"],["③","ミネラルを0.2〜0.5nmのイオンにする製法。"],["④","1包10g・鉄約4〜5mg・30包入り。"],["⑤","Lypo-Cと同じスピックのブランド。"]],"point":"吸収率の数字・医薬品との比較・体の変化の約束は、海外でも使いません。現地の言葉への翻訳は、現地の規制確認とセットで行います。","back":"","aud":["global"],"scene":["outside"],"topics":["brand","origin","ion"],"scope":"pt","cov":["a14","a19"],"src":"新規","origin":"新規","edit":""},{"id":"T27","kind":"T","sec":"athlete","key":false,"title":"運動する方へ（ジム・店頭）","lines":[["お客様","トレーニングしてるんですが、なかなか調子が上がらなくて。"],["スタッフ","汗をかくと、水分と一緒に鉄も出ていきます。汗1Lで0.3〜0.4mgほど。運動をがんばっている方ほど、鉄は使われやすいんです。"],["スタッフ","トレーニングは刺激、ミネラルは条件。土台の栄養も一緒に見てみませんか。"]],"point":"努力を否定しない。","back":"","aud":["c-sport"],"scene":["open"],"topics":["sport","summer"],"scope":"ptc","cov":["a9","a21"],"src":"StaffEducation p.32を調整／BRAND BOOK p.53","origin":"既存を調整","edit":"原文の「土台のミネラルが足りないと、頑張りが結果になりにくいんです」は、競技力に効くように聞こえるので外しました。"},{"id":"T28","kind":"T","sec":"athlete","key":false,"title":"アスリート本人・保護者へ（医療機関）","lines":[["本人へ","運動量が多い方は、鉄の需要も高くなります。日常の鉄補給を取り入れる方も増えていますよ。"],["保護者へ","成長期のお子さんは、特に鉄が必要な時期です。まずは食事から、加えて日常の補給という形もありますよ。"],["ドーピングを聞かれたら","MINERALionは、インフォームドスポーツの認証を取得しています。それでも競技をされている方は、念のため製品の表示や競技団体の基準もご確認ください。"]],"point":"未成年は保護者の理解のもとで。「ドーピングの心配がない」とは言い切りません。","back":"認証は禁止物質の検査を受けた製品であることを示すもので、リスクをゼロにする保証ではありません。Weekly S3 Vol.02の「申請中」、BRAND BOOK p.53の「対応を進めています」は古い表記です。","aud":["c-sport","c-kids"],"scene":["clinic"],"topics":["sport","cert","kids"],"scope":"ptc","cov":["a6","a18"],"src":"Medical Proposal Ⅱ p.10を調整（認証の文は正本に合わせて新規）","origin":"既存を調整","edit":"原文の「コンディションやパフォーマンスのために」は外しました。"},{"id":"T29","kind":"T","sec":"athlete","key":false,"title":"スポーツチーム・指導者へ","lines":[["","MINERALionは、インフォームドスポーツの認証を取得した食品です。"],["","選手の記録や競技力が上がる、という言い方はしていません。汗で失う鉄やミネラルを、毎日の食事にどう足すか、という話です。"],["","使うかどうかは、チームドクターやトレーナーの方とご相談ください。"]],"point":"社内モニタリング（鎌倉インテル）は主観的なコンディションの記録で、効果の証明ではありません（F32）。","back":"","aud":["team"],"scene":["outside","deal"],"topics":["cert","sport"],"scope":"pt","cov":["a18"],"src":"新規（アスリート・モニタリング ダッシュボードをもとに作成）","origin":"新規","edit":""},{"id":"T30","kind":"T","sec":"athlete","key":false,"title":"スポーツドリンクから","lines":[["","運動のとき、スポーツドリンクを飲まれていますよね。汗をかく季節、いい習慣だと思います。"],["","中身はナトリウムとカリウムが中心で、鉄は成分表で「Tr」、微量という表記なんです。MINERALionは1包に鉄が約4〜5mg。"],["","汗の分はいつも通りスポーツドリンクで。鉄は別枠で、という使い分けです。"]],"point":"スポーツドリンクと競わせない。出す数字は「Tr」と「約4〜5mg」の2つ。","back":"","aud":["c-sport"],"scene":["open"],"topics":["sport","summer"],"scope":"ptc","cov":["a9","a18"],"src":"Weekly S4 vol.2を調整","origin":"既存を調整","edit":"原文の鉄量はロット実測の約4.5mgで、正本の表記にそろえました。"},{"id":"T31","kind":"T","sec":"athlete","key":false,"title":"大会・イベントのブースで（30秒）","lines":[["","汗をかいたあとのミネラル、気にされたことありますか？"],["","汗と一緒に、鉄も出ていきます。MINERALionは、鉄を中心に数十種類のミネラルをイオン化した、液体の食品です。"],["","よかったら1包、どうぞ。そのままでも、水に混ぜても飲めます。"]],"point":"走ったあと・競技中の体の変化は約束しません。配った数と、体調・服薬を聞いた記録を残します。","back":"","aud":["c-sport","c-all"],"scene":["outside"],"topics":["summer","sport"],"scope":"ptc","cov":["a19"],"src":"新規（しまだ大井川マラソン協賛 設計提案の文脈で作成）","origin":"新規","edit":""},{"id":"T32","kind":"T","sec":"store","key":false,"title":"「健診で貧血じゃないと言われた」方へ","lines":[["お客様","健康診断で貧血じゃないって言われたので、私は大丈夫だと思います。"],["スタッフ","健診で見るのはヘモグロビンで、「今、血液で足りているか」なんです。体にためた鉄（フェリチン）は別の数字で、こちらが減っていても「異常なし」と出ることがあります。隠れ鉄不足と呼ばれています。"]],"point":"否定せず「もう一つの指標」として渡す。フェリチン＝貯金、で伝わりやすい（Y04）。","back":"","aud":["c-check"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a21","a8"],"src":"StaffEducation p.28を調整","origin":"既存を調整","edit":"原文の「これが減ると不調が出ます」は外しました。"},{"id":"T33","kind":"T","sec":"store","key":false,"title":"「特に不調はない」方へ（月経のある方）","lines":[["お客様","特に困ってないし、元気なので必要ないかな。"],["スタッフ","月経のある方は、毎月鉄を失っています。今つらくないのは、ためた鉄がまだ残っているからかもしれません。なくなってから整えるより、ある今から保つほうがラクなんです。"]],"point":"予防・土台づくりの文脈で。「予防できる」とは言いません。","back":"","aud":["c-mens"],"scene":["object"],"topics":["mens","hidden"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.29／SpeakEasy 3.0（不調がない方への伝え方）","origin":"既存","edit":""},{"id":"T34","kind":"T","sec":"store","key":false,"title":"「特に不調はない」方へ（月経のない方）","lines":[["スタッフ","鉄は毎日、体の中で使われています。月経がなくても、いまの食事だけでは補いきれていないことが多いんです。"],["スタッフ","今、困っていないのは「まだ余裕がある」状態。その余裕を保つために続ける、という使い方もあります。"]],"point":"","back":"","aud":["c-men","c-meno","c-all"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a21","a22"],"src":"SpeakEasy 3.0を調整","origin":"既存を調整","edit":"もとの研修資料にある閉経後の「老化を遅らせる土台」、男性の「疲れにくい体を維持する」は効能の言い方になるので使いません。"},{"id":"T35","kind":"T","sec":"store","key":false,"title":"美容目的の方へ（肌）","lines":[["お客様","肌のハリやくすみが気になって。いい美容サプリないですか？"],["スタッフ","コラーゲンをつくる酵素が働くには、鉄が要るんです。材料だけでなく、工場の電力の話ですね。"],["スタッフ","外から足すケアに、内側の鉄・ミネラルという視点を足してみませんか。"]],"point":"「肌に効く」「きれいになる」は言いません。肌の変化の時期も約束しません。","back":"","aud":["c-beauty"],"scene":["open","explain"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"StaffEducation p.30・Weekly S1 Vol.12を調整","origin":"既存を調整","edit":""},{"id":"T36","kind":"T","sec":"store","key":false,"title":"お悩み別：くすみが気になる","lines":[["入口","春先って、ちゃんとお手入れしていても、なんだか肌がくすんで見えることありますよね。"],["つなぎ","そういうときって、表面の問題だけじゃなくて、肌の代謝が少し落ちていることもあるんです。"],["鉄の話","鉄は、肌が生まれ変わる流れに関わっている栄養素のひとつなんです。"]],"point":"","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"Weekly S1 Vol.12（お悩み別①）を調整","origin":"既存を調整","edit":"原文の「くすみが気になる時期には相性がいいんです」は、くすみへの効き目に聞こえるので外しました。"},{"id":"T37","kind":"T","sec":"store","key":false,"title":"お悩み別：乾燥しやすい","lines":[["入口","暖かくなっても、肌の乾燥は意外と残りますよね。"],["つなぎ","保湿はもちろん大事なんですが、それだけでは追いつかない感じがあるときは、肌そのものが働きやすい状態かも見てあげたいんです。"],["鉄の話","鉄は、皮膚が代謝していくための土台に関わっています。外から守るケアに、内側の視点を足せます。"]],"point":"","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"Weekly S1 Vol.12（お悩み別②）","origin":"既存","edit":""},{"id":"T38","kind":"T","sec":"store","key":false,"title":"お悩み別：ハリが気になる","lines":[["入口","ハリって、肌の印象を大きく左右しますよね。"],["つなぎ","コラーゲンの話はよく出ますが、その前に、肌の細胞がちゃんと働ける状態かも大事なんです。"],["鉄の話","コラーゲンをつくる酵素が働くのに、鉄が要るんです。"]],"point":"","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"Weekly S1 Vol.12（お悩み別④）・StaffEducation p.39","origin":"既存","edit":""},{"id":"T39","kind":"T","sec":"store","key":false,"title":"お悩み別：肌がゆらぎやすい","lines":[["入口","いつものケアなのに、肌が落ち着かない時期ってありますよね。"],["つなぎ","何を足すかだけじゃなくて、肌が整う力を持てているかも大事なんです。"],["鉄の話","鉄は、皮膚が働くための基礎に関わる栄養素なんです。"]],"point":"","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"Weekly S1 Vol.12（お悩み別③）を調整","origin":"既存を調整","edit":""},{"id":"T40","kind":"T","sec":"store","key":false,"title":"お悩み別：日差しが気になりはじめた","lines":[["入口","春の光ってやわらかく見えるのに、肌には意外としっかり届きますよね。"],["つなぎ","紫外線対策というとビタミンCの話が中心になりやすいですが、その前に皮膚がちゃんと働ける状態かも大事です。"],["鉄の話","鉄は、肌の代謝に関わる栄養素なんです。ビタミンCと一緒に考えると、話がつながります。"]],"point":"","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin","combo"],"scope":"ptc","cov":["a8"],"src":"Weekly S1 Vol.12（お悩み別⑤）を調整","origin":"既存を調整","edit":""},{"id":"T41","kind":"T","sec":"store","key":false,"title":"お悩み別：なんとなく冴えない","lines":[["入口","ちゃんとケアしているのに、なんだか肌が冴えない時期ってありますよね。"],["つなぎ","化粧品や施術だけの話ではなくて、肌そのものが元気に動けているかも見たくなります。"],["鉄の話","鉄は、その「肌が動く力」の土台にある栄養素なんです。"]],"point":"","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"Weekly S1 Vol.12（お悩み別⑥）","origin":"既存","edit":""},{"id":"T42","kind":"T","sec":"store","key":false,"title":"業態別の入口の一言","lines":[["美容皮膚科","透明感やハリの話の前に、まず肌そのものが働ける状態かが大事なんです。その土台に鉄があります。"],["エステ","鉄って貧血のイメージが強いですが、実は肌が生まれ変わる流れにも関わっているんです。"],["ヘアサロン","肌の印象は、表面のケアだけじゃなくて、内側で代謝できているかでも変わるんです。"],["ネイル","手肌の生まれ変わりも、内側の代謝が土台なんです。"]],"point":"業態ごとに入口の言葉を変えます。","back":"","aud":["c-beauty"],"scene":["open"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"BRAND BOOK p.64／Weekly S1 Vol.12","origin":"既存","edit":""},{"id":"T43","kind":"T","sec":"store","key":false,"title":"髪の話（ヘアサロン）","lines":[["スタッフ","髪は1か月に1cmほど伸びるので、「今ある髪」と「これから生えてくる髪」は別物なんです。"],["スタッフ","外からの補修に加えて、これから生える髪の材料になる栄養も大事で。たんぱく質が木材なら、鉄は組み立てる大工さん。亜鉛やビタミンも一緒に、バランスが大切です。"]],"point":"「抜け毛が止まる」「髪が増える」は言いません。秋は髪の悩みが増える季節です（約3人に1人）。","back":"","aud":["c-beauty"],"scene":["open","explain"],"topics":["hair"],"scope":"ptc","cov":["a8"],"src":"髪と鉄セミナー p.7–11を調整","origin":"既存を調整","edit":""},{"id":"T44","kind":"T","sec":"store","key":false,"title":"月経・PMSに悩む方へ","lines":[["お客様","生理のたびに疲れやすくて、気分も落ち込みます。"],["スタッフ","月経のある方は毎月鉄を失うので、いちばん不足しやすいんです。鉄は、気分に関わる物質の材料にもなっています。まず食事と日々の補給で、土台を見直してみる価値はあります。"],["スタッフ","つらさが強いときは、我慢せずに婦人科の先生にも相談してくださいね。"]],"point":"共感が先。「PMSが楽になる」とは言いません。","back":"確実に言えるのは3つ。月経で鉄を失う、生殖年齢の女性は鉄欠乏のリスクが高い、鉄は神経伝達物質の合成に関わる。前向き研究（2011年）で非ヘム鉄の摂取が多い女性ほどPMSの発症が少ない傾向が報告されていますが、これは「関連」で、治療効果を示す大規模な試験は限られています（BRAND BOOK p.49）。","aud":["c-mens"],"scene":["open"],"topics":["mens"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.31を調整（最後の一言は新規）","origin":"既存を調整","edit":""},{"id":"T45","kind":"T","sec":"store","key":false,"title":"妊娠中・授乳中の方へ（店頭・サロン）","lines":[["スタッフ","妊娠中・授乳中は、鉄が多く必要になる時期です。食品としての補給ですが、摂る量に配慮が要る時期なので、かかりつけの先生か薬剤師さんに相談してから、にしてくださいね。"]],"point":"店頭では勧める側に回らない。相談を先にしてもらいます。","back":"","aud":["c-preg"],"scene":["answer"],"topics":["preg"],"scope":"ptc","cov":["a22"],"src":"BRAND BOOK p.52を店頭向けに調整","origin":"既存を調整","edit":""},{"id":"T46","kind":"T","sec":"store","key":false,"title":"更年期・閉経後の方へ","lines":[["スタッフ","月経が終わると、鉄を失う機会は減ります。それでも鉄は毎日使われていて、食事が減ったり偏ったりすると足りなくなることがあります。"],["スタッフ","この時期は体調の変化が重なりやすいので、気になることがあれば、まずかかりつけの先生に。そのうえで、食事を土台に日々の補給を、という形がいいと思います。"]],"point":"「更年期の症状が楽になる」「骨や老化に効く」とは言いません。閉経後は鉄の必要量が下がるので、摂りすぎの話も添えます。","back":"閉経後は月経による鉄の損失がなくなり、推奨量も下がります。研修資料（SpeakEasy 3.0）の「老化を遅らせる土台」は効能の言い方になるため使いません。","aud":["c-meno"],"scene":["answer"],"topics":["howto","food"],"scope":"ptc","cov":["a22"],"src":"新規（SpeakEasy 3.0の閉経後女性の文脈、BRAND BOOK p.55を参考に作成）","origin":"新規","edit":""},{"id":"T47","kind":"T","sec":"store","key":false,"title":"男性の方へ","lines":[["スタッフ","男性は月経がない分、女性ほど鉄が不足しにくいといわれています。ただ、汗をよくかく方や、食事が偏りがちな方は、意識しておきたい栄養素です。"],["スタッフ","もともと鉄が足りている方は、変化を感じにくいこともあります。気になる方は、健診のときにフェリチンも見てもらうとわかりやすいですよ。"]],"point":"正直に言う。足りている人に無理に勧めません。","back":"","aud":["c-men"],"scene":["answer"],"topics":["hidden","sport"],"scope":"ptc","cov":["a22"],"src":"新規（公式FAQ、SpeakEasy 3.0の男性・アクティブ層をもとに作成）","origin":"新規","edit":""},{"id":"T48","kind":"T","sec":"store","key":false,"title":"子ども・保護者へ","lines":[["スタッフ","成長期のお子さんは、特に鉄が必要な時期です。まずは食事から、加えて日常の補給という形もありますよ。"],["スタッフ","大人の鉄不足が「消耗」なら、子どもは「建設中の資材不足」なんです。"],["スタッフ","お子さん、部活は？ 運動する子は、汗でも鉄を失います。"]],"point":"未成年は保護者の理解のもとで。2歳未満は医師の指導のもとで。「成長を促す」「背が伸びる」は言わない。食事の代わりにしません。","back":"","aud":["c-kids"],"scene":["answer","open"],"topics":["kids","food"],"scope":"ptc","cov":["a21"],"src":"Medical Proposal Ⅱ p.10／BRAND BOOK p.54／Weekly S3 Vol.03","origin":"既存","edit":""},{"id":"T49","kind":"T","sec":"store","key":false,"title":"冷えが気になる方へ","lines":[["入口","冷えって、体質だと思われがちですよね。"],["つなぎ","体は酸素を使ってエネルギーをつくって、そのときに熱も生まれます。その流れに関わっているのが鉄なんです。"],["鉄の話","温めるケアに、食事と鉄という視点も足してみませんか。"]],"point":"「冷えが治る」「温まる」とは言いません。冷えと鉄の関係を知らない人は86.4%（自社調査、女性1,000名）。","back":"監修の橋本知子医師のコメントは「冷え対策として鉄をきちんと摂ること。吸収のためにビタミンCも。ただ食事だけでは十分に摂れない人も多い」（BRAND BOOK p.18）。製品の効果の話ではありません。","aud":["c-all","c-mens"],"scene":["open"],"topics":["cold"],"scope":"ptc","cov":["a21"],"src":"BRAND BOOK p.18・HCL研修 p.30を調整","origin":"既存を調整","edit":""},{"id":"T50","kind":"T","sec":"store","key":false,"title":"夏のだるさ（夏バテかも）","lines":[["入口","これから暑くなると、だるさが増えてきますよね。水分はとれてますか？"],["つなぎ","汗と一緒に、鉄やミネラルも出ていきます。汗1Lで鉄は0.3〜0.4mgほどといわれています。"],["鉄の話","だるさが続くときは、熱中症のこともあるので無理せず受診を。そのうえで、毎日の鉄補給を夏前から始める方もいます。"]],"point":"夏バテを実感する人62.5%、鉄を意識して摂る人8.8%（自社調査）。","back":"","aud":["c-all","c-sport"],"scene":["open"],"topics":["summer","tired"],"scope":"ptc","cov":["a21"],"src":"Weekly S2 Vol.02を調整","origin":"既存を調整","edit":"原文の「実は鉄不足から来てることもけっこうあるんですよ」は決めつけになるので使いません。"},{"id":"T51","kind":"T","sec":"store","key":false,"title":"天気の話から（夏の入口）","lines":[["","今年の夏もまた暑くなりそうですね。"],["","汗って、ただの水じゃなくてミネラルも一緒に流れていくんですよ。夏が来る前に、ちょっと準備しておきたくて。"]],"point":"季節の話題は、提案のいちばん自然な入口です。","back":"","aud":["c-all"],"scene":["open"],"topics":["summer"],"scope":"ptc","cov":["a21"],"src":"Weekly S2 Vol.02・S2 Vol.05","origin":"既存","edit":""},{"id":"T52","kind":"T","sec":"store","key":false,"title":"麦茶から","lines":[["","夏の水分補給は麦茶、という方、多いですよね。カフェインもなくて、とてもいい習慣だと思います。"],["","ただ、麦茶でミネラルも摂れていると思われがちなんですが、実は鉄はほとんど含まれていないこと、ご存知でしたか。食品成分表では「Tr」、微量という表記です。"],["","MINERALionは1包に鉄が約4〜5mg。水分は麦茶のまま、鉄は別枠で、という足し算です。"]],"point":"相手の習慣を否定しない。出す数字は「Tr」と「約4〜5mg」の2つ。麦茶との優劣は言いません。","back":"","aud":["c-all"],"scene":["open"],"topics":["summer","food"],"scope":"ptc","cov":["a21"],"src":"Weekly S4 vol.1を調整","origin":"既存を調整","edit":"原文の鉄量はロット実測の約4.5mgで、正本の表記にそろえました。"},{"id":"T53","kind":"T","sec":"store","key":false,"title":"「鉄＝貧血」のイメージをほどく","lines":[["","鉄って、貧血の人が摂るものだと思っていませんか？"],["","実は、酸素を運ぶ、エネルギーをつくる、体をつくる、と毎日いろいろな仕事をしているんです。"]],"point":"鉄の働きの6つ目は確定待ちです（F38）。決まるまでは「運ぶ・燃やす・つくる」で話します。","back":"","aud":["c-all"],"scene":["open"],"topics":["brand"],"scope":"ptc","cov":["a8","a21"],"src":"Weekly S2 Vol.03を調整","origin":"既存を調整","edit":"もとの「6つの仕事」の言い方を、確定している3つの働きにした。"},{"id":"T54","kind":"T","sec":"store","key":false,"title":"雑誌・動画を見て来た方へ","lines":[["","ご覧になったんですね。ありがとうございます。"],["","動画では「最強」とご紹介いただいたそうです。私たちから言えるのは、鉄を中心に数十種類のミネラルをイオン化して届ける食品だ、ということまでなんです。"],["","気になっていることがあれば、何でも聞いてください。1包にどれくらい入っているか、いつ飲むか、いま飲んでいるものと一緒でいいか、よく聞かれます。"]],"point":"「最強」は第三者の表現です。「そうご紹介いただきました」という事実まで。期待が高すぎる方には、食品であることと個人差を先に伝えます。","back":"","aud":["c-media"],"scene":["open","object"],"topics":["media"],"scope":"ptc","cov":["a23"],"src":"新規（Weekly 号外 2026 Summerをもとに作成）","origin":"新規","edit":""},{"id":"T55","kind":"T","sec":"store","key":false,"title":"雑誌の話から入る","lines":[["","最近、雑誌でも鉄をよく見ませんか？"],["医療機関","雑誌でも鉄がよく取り上げられていますね。"],["サロン","美的やGLOWでも、肌と鉄の特集が増えていて。"]],"point":"社会の関心を借りて話を始めます。掲載は「関心の広がり」で、効き目の証明ではありません。","back":"","aud":["c-all","c-media"],"scene":["open"],"topics":["media"],"scope":"ptc","cov":["a23"],"src":"Weekly S3 Vol.05","origin":"既存","edit":""},{"id":"T56","kind":"T","sec":"store","key":false,"title":"声かけ3ステップ（ジム・サロン）","lines":[["① 聞く","最近、階段で息切れしませんか？"],["② 共感","鉄が関わっていることもあるんです。"],["③ 体験","試しに1包、飲んでみませんか。"]],"point":"決めつけない。体調が続くようなら受診を勧めます。","back":"","aud":["c-sport","c-all"],"scene":["open"],"topics":["tired","sport"],"scope":"ptc","cov":["a9"],"src":"福岡導入講習 p.22を調整","origin":"既存を調整","edit":"原文の「鉄が関係していることが多いんです」は言い過ぎなので、「関わっていることもある」にしました。"},{"id":"T57","kind":"T","sec":"store","key":false,"title":"整体院・ボディケアで","lines":[["","体のケアのあと、水分補給と一緒にミネラルのことも少し。汗をかく季節は、鉄も出ていきやすいんです。"],["","当院では、施術後の水分補給として、ミネラル補給に着目したMINERALionをご用意しています。"]],"point":"体の痛みやこりが楽になる、とは言いません。施術の効果と結びつけません。","back":"","aud":["c-all"],"scene":["open"],"topics":["summer"],"scope":"ptc","cov":["a13"],"src":"新規（Weekly S4 vol.3の説明文の例をもとに作成）","origin":"新規","edit":""},{"id":"W08","kind":"W","sec":"store","key":false,"title":"店頭POP（30秒で読める）","text":"見出し：鉄、足りていますか。\n本文：日本人の鉄の摂取量は、この50年でほぼ半分に。MINERALionは、鉄を中心に数十種類のミネラルをイオン化した、液体の食品です。1包10g・30包入り。\n添え書き：食品です。体感には個人差があります。","point":"吸収率の数字や鉄剤との比較は載せません（N29）。価格表示は最新の価格で。","back":"","aud":["c-all"],"scene":["write"],"topics":["brand"],"scope":"ptc","cov":["a13","a12"],"src":"新規","origin":"新規","edit":""},{"id":"T58","kind":"T","sec":"store","key":false,"title":"会計・お見送りの一言","lines":[["","よかったら、パンフレットだけでもお持ちください。"],["","鉄のこと、次に来られたときにでも聞いてくださいね。"],["購入された方へ","パッケージの表示どおりに、続けやすいタイミングでどうぞ。飲み物に混ぜると色が変わることがありますが、品質の問題ではありません。"]],"point":"さりげなく。その場で決めてもらおうとしません。","back":"","aud":["c-all"],"scene":["close"],"topics":["taste"],"scope":"ptc","cov":["a13","a11"],"src":"新規（Medical Proposal Ⅱ p.3「会計・お見送りの際」をもとに作成）","origin":"新規","edit":""},{"id":"T59","kind":"T","sec":"store","key":true,"title":"断られたとき","lines":[["","無理にとは申しません。気になったら、いつでも声をかけてください。"]],"point":"押し売りしない（Medical Proposal Ⅱの大前提）。気持ちよく引くことが、次の会話につながります。","back":"","aud":["c-all"],"scene":["close","object"],"topics":["brand"],"scope":"ptc","cov":["a21"],"src":"Medical Proposal Ⅱ p.2・p.15を調整（後半は新規）","origin":"既存を調整","edit":""},{"id":"T60","kind":"T","sec":"clinic","key":false,"title":"月経のある20〜40代の女性へ","lines":[["共感から","女性は毎月の月経で鉄を失いやすく、鉄は不足しやすい栄養素なんです。まだ困っていなくても、日常的に鉄をとっておくと安心ですよ。"],["「疲れ」の相談に","「なんとなく疲れやすい」というとき、鉄が関わっていることもあります。ご心配なら一度先生に診ていただきつつ、日常のケアとして鉄を意識してみるのもいいですね。"],["短縮","鉄は女性に不足しやすい栄養素です。日常の補給、始めてみませんか。"]],"point":"症状が強い・続く場合は受診を。スタッフが「貧血ですね」と断定しません。","back":"","aud":["c-mens"],"scene":["clinic"],"topics":["mens","tired"],"scope":"ptc","cov":["a6","a21"],"src":"Medical Proposal Ⅱ p.4（患者像01）を調整","origin":"既存を調整","edit":"原文の「コンディションの維持に役立ちますよ」は「安心ですよ」にしました。"},{"id":"T61","kind":"T","sec":"clinic","key":false,"title":"妊活中の方へ","lines":[["基本","これから妊娠を考えていらっしゃるなら、鉄は早めに整えておきたい栄養素の一つです。詳しくは先生にもご相談いただきつつ、日常の鉄補給から始められますよ。"],["短縮","妊娠前からの鉄の準備に、日常の補給という選択肢があります。"],["「サプリで大丈夫？」","食品としての栄養補給です。妊活・妊娠中は摂る量に配慮が要る時期なので、かかりつけの先生にも一度ご相談くださいね。"]],"point":"必ず医師・薬剤師への相談を添えます。葉酸など他の成分の助言は専門家に。","back":"","aud":["c-preg"],"scene":["clinic"],"topics":["preg"],"scope":"ptc","cov":["a6","a22"],"src":"Medical Proposal Ⅱ p.5","origin":"既存","edit":""},{"id":"T62","kind":"T","sec":"clinic","key":false,"title":"産後・授乳中の方へ","lines":[["ねぎらいから","出産で鉄をずいぶん使われたと思います。授乳中も鉄が必要な時期ですね。治療が必要かは先生のご判断ですが、日常の補給として食品でとる方法もありますよ。"],["「授乳中でも平気？」","基本は食品ですが、授乳中は量に注意が要る時期でもあるので、先生・薬剤師にご相談のうえでお使いください。"]],"point":"医師への相談を強めに添えます。治療が必要な貧血は医療を優先します。","back":"","aud":["c-preg"],"scene":["clinic"],"topics":["preg"],"scope":"ptc","cov":["a6","a22"],"src":"Medical Proposal Ⅱ p.6","origin":"既存","edit":""},{"id":"T63","kind":"T","sec":"clinic","key":false,"title":"鉄剤が胃に合わない方へ（治療中）","lines":[["共感＋併用の入口","鉄のお薬、飲むと胃がむかむかされる方は少なくないんです。お薬は先生の指示どおり続けていただくのが大前提ですが、加えて、日常の鉄補給として食品でとる方法もあります。先生にも相談しながら、選択肢の一つとしてご紹介できますよ。"],["短縮","お薬がつらいとき用に、食品での鉄補給という選択肢もあります。次回、先生にも聞いてみてくださいね。"]],"point":"薬の中止・減量を勧めない・示唆しない。併用は必ず医師の管理のもとで。","back":"","aud":["c-drug"],"scene":["clinic"],"topics":["drug"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.7","origin":"既存","edit":""},{"id":"T64","kind":"T","sec":"clinic","key":false,"title":"健診でフェリチン低め・貧血ではない方へ","lines":[["結果に添えて","今回は貧血というほどではないけれど、鉄の蓄えが少なめ、という結果でしたね。お薬を使うほどではない段階では、日常の食事や鉄の食品でこつこつ補っていくのが向いています。"]],"point":"不安をあおらない。数値の解釈は医師に委ねる部分を残します。","back":"","aud":["c-check"],"scene":["clinic"],"topics":["hidden"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.8","origin":"既存","edit":""},{"id":"T65","kind":"T","sec":"clinic","key":false,"title":"治療を終えた維持期の方へ","lines":[["ねぎらい＋維持","お薬での治療、おつかれさまでした。数値が戻ったあとも鉄の蓄えは減りやすいので、日常の鉄補給を習慣にしておくと安心です。お薬とは別の、食品としての補給です。"]],"point":"治療の終了は医師の判断が前提。再発が疑わしい訴えがあれば受診を促します。","back":"","aud":["c-drug"],"scene":["clinic"],"topics":["drug","hidden"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.9","origin":"既存","edit":""},{"id":"T66","kind":"T","sec":"clinic","key":false,"title":"食が細い高齢の方へ","lines":[["やさしく","お食事が細くなると、鉄などのミネラルも不足しがちです。無理なく続けられる範囲で、日常の鉄補給という方法もありますよ。飲み合わせは先生・薬剤師にご確認のうえで。"],["「薬をたくさん飲んでいる」","飲み合わせの確認が大切ですので、まず先生・薬剤師にご相談ください。そのうえで、という形が安心です。"]],"point":"多剤併用・嚥下・腎機能などに配慮。必ず専門家の確認を挟みます。","back":"","aud":["c-elder"],"scene":["clinic"],"topics":["combo","safety"],"scope":"ptc","cov":["a6","a22"],"src":"Medical Proposal Ⅱ p.11／BRAND BOOK p.55","origin":"既存","edit":""},{"id":"T67","kind":"T","sec":"clinic","key":false,"title":"献血で基準に届かなかった方へ","lines":[["気づきに寄り添う","献血で引っかかると、鉄が少し足りていないサインのこともあります。心配なら一度先生に相談しつつ、日常の鉄補給から始めてみるのもいいですね。"]],"point":"貧血の可能性は受診で確認。スタッフが断定しません。","back":"","aud":["c-check"],"scene":["clinic"],"topics":["hidden"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.12","origin":"既存","edit":""},{"id":"T68","kind":"T","sec":"clinic","key":false,"title":"管理栄養士から（栄養指導の流れで）","lines":[["","食事で鉄を摂るなら、赤身の肉や魚、レバー、大豆や青菜。野菜や豆の鉄は、ビタミンCや動物性たんぱく質と一緒にとると吸収されやすくなります。"],["","食事のあとのお茶やコーヒーは、少し時間をあけてみてください。"],["","それでも食事だけで足りない日のために、食品での補給という方法もあります。"]],"point":"食事指導が主役。補給は食事の代わりにしません。","back":"","aud":["c-all"],"scene":["clinic"],"topics":["food","combo"],"scope":"ptc","cov":["a6"],"src":"新規（StaffEducation p.11、公式FAQをもとに作成）","origin":"新規","edit":""},{"id":"T69","kind":"T","sec":"combo","key":false,"title":"Lypo-Cを使っている方へ","lines":[["","Lypo-Cを続けてこられた方に、次の一歩としてご紹介しているのがMINERALionです。Lypo-Cが「材料」を届けるシリーズだとしたら、MINERALionはそれを動かす「動力」。どちらも、体の中で使われやすい状態で届ける設計です。"],["","同じ日に飲んでいただいて大丈夫です。ただ、同じ飲み物には混ぜずに、1〜2時間ずらしてくださいね。"]],"point":"「効果が上がる」「一緒に飲むと効く」とは言いません。","back":"","aud":["c-lypo"],"scene":["cross"],"topics":["combo"],"scope":"ptc","cov":["a21","a25"],"src":"Weekly S2 Vol.06／BRAND BOOK p.44–45","origin":"既存","edit":""},{"id":"T70","kind":"T","sec":"combo","key":false,"title":"MINERALionから入った方へ（Lypo-Cを重ねる）","lines":[["","コラーゲンをつくるには、鉄とビタミンCの両方が要るんです。"],["","MINERALionを続けている方には、ビタミンCを重ねる方もいらっしゃいます。Lypo-Cも、同じ「届ける」考え方でつくられたビタミンCです。"],["","重ねるなら、同じ飲み物には混ぜずに、1〜2時間ずらしてください。"]],"point":"順番は「まず鉄、そのあとビタミンC」。生活者には、仕組みを断定しません。","back":"研修資料（SpeakEasy、フェリチン講習）では、鉄が先・ビタミンCが後、という順番の理由として、鉄が足りないとビタミンCが非ヘム鉄の還元（Fe³⁺→Fe²⁺）に使われる点を挙げています。","aud":["c-user"],"scene":["cross"],"topics":["combo","skin"],"scope":"ptc","cov":["a25"],"src":"新規（BRAND BOOK p.44–45、StaffEducation p.37をもとに作成）","origin":"新規","edit":""},{"id":"T71","kind":"T","sec":"combo","key":false,"title":"C＋Ceraを使っている方へ","lines":[["","C＋Ceraは、ビタミンC・セラミド・ナイアシンアミドの3つが一体になったシリーズです。せっかくこれだけの素材を届けるなら、それを動かす土台もあわせて整える、という考え方があります。"],["","どちらも「届ける設計」のシリーズで、C＋Ceraはリポ・カプセル化、MINERALionはイオン化です。"]],"point":"","back":"","aud":["c-lypo"],"scene":["cross"],"topics":["combo","skin"],"scope":"ptc","cov":["a25"],"src":"Weekly S2 Vol.07を調整","origin":"既存を調整","edit":"原文の「印象が変わってきます」は変化の約束に聞こえるので外しました。"},{"id":"T72","kind":"T","sec":"combo","key":false,"title":"Lypo-C CBDを使っている方へ","lines":[["","CBDは、夜のリラックス習慣として取り入れる方が多い製品です。毎日のリズムを整えるなら、その毎日を支える体の土台もあわせて意識すると、セルフケアの軸が一本通ります。"],["","どちらも「体の中で使われやすい状態で届ける」設計です。CBDはリポ・カプセル化、MINERALionはイオン化。"]],"point":"","back":"","aud":["c-lypo"],"scene":["cross"],"topics":["combo"],"scope":"ptc","cov":["a25"],"src":"Weekly S2 Vol.08","origin":"既存","edit":""},{"id":"T73","kind":"T","sec":"combo","key":false,"title":"SKINBEAUTYを使っている方へ","lines":[["","外から塗ったビタミンC、せっかくなら内側からもそっと支えてあげませんか。肌の中でコラーゲンをつくるとき、ビタミンCと鉄は同じ仕事に関わっているんです。"],["","「塗る」と「飲む」は、別々のことに見えて、肌の中では同じ方を向いているんです。"]],"point":"","back":"","aud":["c-lypo","c-beauty"],"scene":["cross"],"topics":["combo","skin"],"scope":"ptc","cov":["a25","a8"],"src":"Weekly S2 Vol.09を調整","origin":"既存を調整","edit":""},{"id":"T74","kind":"T","sec":"pattern","key":true,"title":"「鉄サプリと何が違うんですか？」","lines":[["①","鉄剤とは役割がちがう（お薬は治療、MINERALionは食品で毎日の補給）。"],["②","鉄を単体ではなく、数十種類のミネラルと一緒に。"],["③","ミネラルをイオン化して、液体で届ける設計。"],["④","原料はTHEMAROX™（阿武隈山系の風化花崗岩由来、約50年の実績）。"],["⑤","仕様（1包10g・鉄約4〜5mg・30包）。"]],"point":"ほかの製品の評価はしません。比べるのは設計の事実だけ。言い方の例はQ03。","back":"","aud":["c-all","c-doubt"],"scene":["answer"],"topics":["drug","ion","mineral"],"scope":"ptc","cov":["a21","a24"],"src":"新規","origin":"新規","edit":""},{"id":"T75","kind":"T","sec":"pattern","key":false,"title":"「何にいいの？」","lines":[["①","食品であることを先に言う。"],["②","鉄は食事で不足しがち、という事実。"],["③","毎日続けやすい形の補給であること。"],["④","体の変化は約束しない（個人差）。"],["⑤","気になる症状は先生へ。"]],"point":"「何に効くか」で答えない。何の食品か、で答えます（Q01）。","back":"","aud":["c-all"],"scene":["answer"],"topics":["brand"],"scope":"ptc","cov":["a21"],"src":"新規","origin":"新規","edit":""},{"id":"T76","kind":"T","sec":"pattern","key":false,"title":"「効きますか？」","lines":[["①","「効く」とは言えないことを、正直に言う。"],["②","何の食品か（鉄を中心に数十種類のミネラル、イオン化、液体）。"],["③","感じ方には個人差がある。"],["④","試すなら、無理のない形から。"]],"point":"言い方の例はO10・Q11。","back":"","aud":["c-doubt"],"scene":["answer","object"],"topics":["brand"],"scope":"ptc","cov":["a24"],"src":"新規","origin":"新規","edit":""},{"id":"T77","kind":"T","sec":"pattern","key":false,"title":"「妊娠中・授乳中でも？」","lines":[["①","鉄が多く必要になる一方で、量に配慮が要る時期。"],["②","先に、かかりつけの先生か薬剤師に相談を。"],["③","食品であること。治療が必要な貧血は医療が先。"]],"point":"その場で「大丈夫です」と言わない（Q27）。","back":"","aud":["c-preg"],"scene":["answer"],"topics":["preg"],"scope":"ptc","cov":["a22"],"src":"新規","origin":"新規","edit":""},{"id":"T78","kind":"T","sec":"pattern","key":false,"title":"「なぜこの価格？」","lines":[["①","原料（サプリメント分野での独占契約、約50年の実績）。"],["②","イオン化して液体にする製法。"],["③","1包あたりの価格（180円・税別）。"],["④","続けやすい単位（30包・約1ヶ月分）。"]],"point":"値引きの約束はしない。お試し・定期便は最新の案内で（Q37）。","back":"","aud":["c-doubt","owner"],"scene":["answer"],"topics":["price"],"scope":"ptc","cov":["a24"],"src":"新規","origin":"新規","edit":""},{"id":"T79","kind":"T","sec":"pattern","key":false,"title":"「他社のミネラル商品との違いは？」","lines":[["①","他社の製品の評価はしない、と先に言う。"],["②","自社の設計の事実（原料の天然のバランス、イオン化、液体）。"],["③","数字は「商品の事実」から。"]],"point":"比べる試験をしていないので、「優れている」とは言いません（Q38）。","back":"","aud":["c-doubt","corp"],"scene":["answer"],"topics":["mineral","ion"],"scope":"ptc","cov":["a24"],"src":"新規","origin":"新規","edit":""},{"id":"P01","kind":"P","sec":"phrase","key":false,"title":"ブランドの核","text":"目指したのは、実感できる鉄分補給。","point":"ブランドの最上位の一文。","back":"","aud":["c-all"],"scene":["explain","write"],"topics":["brand"],"scope":"off","cov":["a3","a4"],"src":"BRAND BOOK p.26／StaffEducation p.42","origin":"既存","edit":"Medical Proposal Ⅰの最終ページは「こだわったのは、…」になっているので、こちらにそろえます。"},{"id":"P02","kind":"P","sec":"phrase","key":false,"title":"ブランドステートメント","text":"届く、を届ける。／摂った量ではなく、届く量で。","point":"「何が入っているか」より「どう届くか」。製品を一言で語るときの軸です。","back":"","aud":["c-all"],"scene":["explain","write"],"topics":["brand","ion"],"scope":"off","cov":["a3"],"src":"BRAND BOOK p.1–2","origin":"既存","edit":""},{"id":"P03","kind":"P","sec":"phrase","key":false,"title":"約束","text":"治す、ではなく、届ける。","point":"食品として話す（ルール1）を一言にしたもの。社内・パートナーとの共有に。","back":"","aud":["inhouse","staff"],"scene":["train"],"topics":["brand"],"scope":"pt","cov":["a4"],"src":"BRAND BOOK p.72・p.27","origin":"既存","edit":""},{"id":"P04","kind":"P","sec":"phrase","key":false,"title":"ミッション","text":"鉄を、この国で有名にする。","point":"社内・パートナー・メディアに共通の合言葉。売上より先に市場を育てる、という意味です。","back":"","aud":["inhouse","owner","staff","press"],"scene":["train","outside"],"topics":["brand"],"scope":"pt","cov":["a4","a16"],"src":"BRAND BOOK p.21／HCL研修 p.9","origin":"既存","edit":""},{"id":"P05","kind":"P","sec":"phrase","key":false,"title":"医師への一言","text":"治療の鉄に、日常の鉄を。","point":"鉄剤を否定しない入り方。続けて3つのスタンス（食品／既存治療への敬意／医師の判断）を話します。","back":"","aud":["doc"],"scene":["clinic","deal"],"topics":["drug"],"scope":"med","cov":["a5"],"src":"Medical Proposal Ⅰ p.1","origin":"既存","edit":""},{"id":"P06","kind":"P","sec":"phrase","key":false,"title":"いちばん強い一言","text":"私も飲んでいます。","point":"感想を足すなら「個人の感想ですが」と添え、変化の約束にしません（N11）。","back":"","aud":["c-all"],"scene":["open","explain"],"topics":["exp"],"scope":"ptc","cov":["a8","a9","a12"],"src":"Weekly S2 Vol.01","origin":"既存","edit":""},{"id":"P07","kind":"P","sec":"phrase","key":false,"title":"健診の一言","text":"健診で「異常なし」でも、鉄が足りているとは限らないんです。","point":"健診で見るのはヘモグロビン（貧血かどうか）。体にためた鉄（フェリチン）は別の指標です。","back":"","aud":["c-check","c-all"],"scene":["open","object"],"topics":["hidden"],"scope":"ptc","cov":["a21"],"src":"BRAND BOOK p.13・StaffEducation p.28を調整","origin":"既存を調整","edit":""},{"id":"P08","kind":"P","sec":"phrase","key":false,"title":"食事の一言","text":"食べているから足りている、とは限らないんです。","point":"食事を否定しない。食事の鉄は吸収されにくいものが多い（非ヘム鉄は2〜15%）、という事実につなぎます。","back":"","aud":["c-all","c-sport"],"scene":["open","object"],"topics":["food"],"scope":"ptc","cov":["a9"],"src":"福岡導入講習 p.16","origin":"既存","edit":""},{"id":"P09","kind":"P","sec":"phrase","key":false,"title":"位置づけの一言","text":"お薬が要らない段階の、毎日の鉄補給です。","point":"「薬の一歩手前」の考え方。現に鉄剤が必要な方には言いません。","back":"","aud":["c-check","c-drug"],"scene":["explain"],"topics":["drug","hidden"],"scope":"ptc","cov":["a6"],"src":"BRAND BOOK p.60／Medical Proposal Ⅱ p.15","origin":"既存","edit":""},{"id":"P10","kind":"P","sec":"phrase","key":false,"title":"食事が主役","text":"食事が主役で、補給は補助です。","point":"子ども・妊娠期・高齢の方には特に。食事の代わりにしません。","back":"","aud":["c-kids","c-all"],"scene":["explain"],"topics":["food","kids"],"scope":"ptc","cov":["a21"],"src":"BRAND BOOK p.54","origin":"既存","edit":""},{"id":"P11","kind":"P","sec":"phrase","key":false,"title":"季節：冬〜春（冷え）","text":"冷えと鉄の関係、ご存じでしたか？","point":"冷えと鉄の関係を知らない人は86.4%（自社調査）。","back":"","aud":["c-all"],"scene":["open","write"],"topics":["cold"],"scope":"ptc","cov":["a21"],"src":"HCL研修 p.30／StaffEducation p.42を調整","origin":"既存を調整","edit":"原文の決めゼリフ「その冷え、性格じゃなく鉄かもしれない」は、原因の決めつけに聞こえるので問いの形にしました。"},{"id":"P12","kind":"P","sec":"phrase","key":false,"title":"季節：初夏（肌）","text":"美容は「足す」から「回す」へ。","point":"季節が変わっても、ブランドの核の一文は変えません。","back":"","aud":["c-beauty"],"scene":["open","write"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"StaffEducation p.42","origin":"既存","edit":""},{"id":"P13","kind":"P","sec":"phrase","key":false,"title":"季節：盛夏（汗）","text":"汗が奪う鉄を、先手で補う準備を。","point":"","back":"","aud":["c-all","c-sport"],"scene":["open","write"],"topics":["summer"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.42","origin":"既存","edit":""},{"id":"P14","kind":"P","sec":"phrase","key":false,"title":"季節：秋（髪）","text":"秋の髪の悩みに、「鉄」という視点を。","point":"約3人に1人が「秋になると髪の悩みが増える」、髪のために鉄を意識している人は1割未満（自社調査）。","back":"","aud":["c-beauty"],"scene":["open","write"],"topics":["hair"],"scope":"ptc","cov":["a8"],"src":"新規（髪と鉄セミナー p.4–5の調査をもとに作成）","origin":"新規","edit":"原文の秋の決めゼリフ「続けた人にだけ、変化は訪れる」は変化の約束になるので使いません。"},{"id":"Y01","kind":"Y","sec":"metaphor","key":false,"title":"工場の電力（肌）","text":"美容成分が材料なら、鉄は工場を動かす電力。電気が来ていないと、工場は動きません。","point":"肌の話で使います。「肌に効く」とは言いません。","back":"","aud":["c-beauty"],"scene":["explain"],"topics":["skin"],"scope":"ptc","cov":["a8"],"src":"BRAND BOOK p.50・p.63","origin":"既存","edit":""},{"id":"Y02","kind":"Y","sec":"metaphor","key":false,"title":"材料と動力（Lypo-C）","text":"Lypo-CのビタミンCが「材料」なら、MINERALionはそれを動かす「動力」です。","point":"Lypo-Cとの組み合わせの基本のたとえ。","back":"","aud":["c-lypo"],"scene":["cross"],"topics":["combo"],"scope":"ptc","cov":["a25"],"src":"BRAND BOOK p.44／Weekly S2 Vol.06","origin":"既存","edit":"過去号の「OSのアップデートとパーツの補充」（S2 Vol.03）、「反応を起こす力と回す土台」（S1 Vol.07）は使わず、これにそろえます。"},{"id":"Y03","kind":"Y","sec":"metaphor","key":false,"title":"家づくり（髪）","text":"たんぱく質が家の木材なら、鉄は組み立てる大工さん。材料だけでも、大工さんだけでも、家は建ちません。","point":"髪の話で。鉄だけでは足りない、栄養はバランス、まで言います。","back":"","aud":["c-beauty"],"scene":["explain"],"topics":["hair"],"scope":"ptc","cov":["a8"],"src":"髪と鉄セミナー p.11","origin":"既存","edit":""},{"id":"Y04","kind":"Y","sec":"metaphor","key":false,"title":"貯金（フェリチン）","text":"鉄は、まず「貯金」（フェリチン）から減っていきます。貯金がなくなってから、はじめて血液の数値に出てくるんです。","point":"隠れ鉄不足の説明に。「だから飲めば貯金が増える」とは言いません。","back":"","aud":["c-check"],"scene":["explain"],"topics":["hidden"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.9","origin":"既存","edit":""},{"id":"Y05","kind":"Y","sec":"metaphor","key":false,"title":"建設中の資材（子ども）","text":"大人の鉄不足が「消耗」なら、子どもの鉄不足は「建設中の資材不足」です。","point":"保護者や先生に。続けて「まず食事から」。「成長を促す」とは言いません。","back":"","aud":["c-kids","doc"],"scene":["explain"],"topics":["kids"],"scope":"ptc","cov":["a21"],"src":"BRAND BOOK p.54／Weekly S3 Vol.03","origin":"既存","edit":""},{"id":"Y06","kind":"Y","sec":"metaphor","key":false,"title":"鍵穴に合う鍵（イオン化）","text":"イオン化したミネラルは、とても小さな「鍵」。体の入り口の鍵穴に合う大きさにそろえてある、というイメージです。","point":"イオン化の説明に。吸収率の数字を言うときは「イオン化によって目指した値（文献ベース）」を添えます。","back":"","aud":["c-all"],"scene":["explain"],"topics":["ion"],"scope":"ptc","cov":["a21"],"src":"HCL研修 p.16を調整","origin":"既存を調整","edit":""},{"id":"Y07","kind":"Y","sec":"metaphor","key":false,"title":"センターピン（研修用）","text":"鉄はボウリングのセンターピン。冷え・疲れ・肌・気分の話の真ん中に、鉄があります。","point":"研修の中で全体像をつかむためのたとえです。生活者に「1本倒せば連鎖して整う」とは言いません（N12）。","back":"","aud":["staff","inhouse"],"scene":["train"],"topics":["brand"],"scope":"pt","cov":["a4"],"src":"SpeakEasy 3.0／StaffEducation p.10／Weekly S1 Vol.12","origin":"既存","edit":""},{"id":"Y08","kind":"Y","sec":"metaphor","key":false,"title":"宮崎流フルコース（Lypo-Cライン）","text":"アミューズは呼吸と体操、前菜がMINERALion、スープがC+B、魚料理がC+D+K、肉料理がC Cera、チーズがSPIC Dressing、デザートがSKINBEAUTYとStem-C。","point":"Lypo-Cラインの並べ方を研修で伝えるたとえ。「まず鉄（前菜）から」の順番がポイントです。","back":"","aud":["staff","inhouse"],"scene":["train","cross"],"topics":["combo"],"scope":"pt","cov":["a4","a25"],"src":"SpeakEasy 3.0","origin":"既存","edit":""},{"id":"T80","kind":"T","sec":"inhouse","key":false,"title":"CSの三原則","lines":[["受け止める","お辛いですよね。お話しくださって、ありがとうございます。"],["断定しない","「治る」とは言えませんが、毎日の鉄・ミネラル補給として選ばれています。"],["意味を添える","実は、そうした不調には鉄・ミネラルが関わっているといわれています。"]],"point":"第0原則は「正しさより、健やかさ」。事実は曲げずに、相手が前向きになれる一言を選びます。","back":"","aud":["c-all","inhouse"],"scene":["answer","train"],"topics":["brand"],"scope":"off","cov":["a2"],"src":"HCL研修 p.33–34","origin":"既存","edit":""},{"id":"T81","kind":"T","sec":"inhouse","key":false,"title":"CS：相談に回すとき","lines":[["妊娠中・授乳中","お体のことですので、かかりつけの先生か薬剤師さんにご相談のうえで、とお願いしております。"],["お子さま","お子さまの場合は、まず食事を中心に。2歳未満のお子さまは、先生のご指導のもとでお願いします。"],["服薬中","お薬との飲み合わせは、処方された先生か薬剤師さんにご確認ください。"],["体調の変化","お体に合わないと感じたら、飲むのをお休みしてください。症状が続くときは、医療機関にご相談ください。"],["変色","ビタミンCを含むものと混ざると、色や風味が変わることがあります。品質の問題ではありませんが、気になる場合は詳しくお伺いします。"],["異物・品質","ご不便をおかけして申し訳ありません。商品とロット番号を確認させてください。"]],"point":"その場で判断しない。体調・異物・健康被害の可能性があるものは、その日のうちに品質保証の担当へ。「クレーム」ではなく「ご意見・お申し出」と呼びます。","back":"","aud":["c-doubt","c-user","inhouse"],"scene":["escalate"],"topics":["safety","combo"],"scope":"off","cov":["a2","a24"],"src":"新規（HCL研修、公式FAQ、BRAND BOOK p.40をもとに作成）","origin":"新規","edit":""},{"id":"T82","kind":"T","sec":"inhouse","key":false,"title":"社販・スタッフ体験の声かけ（責任者からスタッフへ）","lines":[["責任者","まず1人、今週だけ試してみてくれない？ 2週間後に、どうだったか聞かせて。"],["責任者","お客様に話すときは、「効いた」じゃなくて、「使ってみての感想」として話してね。"],["スタッフの言い方","個人の感想ですが、朝の一杯にしてから、続けるのが習慣になりました。"]],"point":"現場でいちばん通る一言は「私も使っています」。体験記録シートを2週間つけると、自分の言葉が育ちます。","back":"","aud":["staff"],"scene":["train"],"topics":["exp"],"scope":"pt","cov":["a12","a8","a9"],"src":"Weekly S2 Vol.01を調整","origin":"既存を調整","edit":"原文の例「朝の感じが少し違う」は体の変化の話になるので、習慣の話にしました。"},{"id":"T83","kind":"T","sec":"inhouse","key":false,"title":"立ち上げ：着荷から最初の声かけまで","lines":[["着荷の日（営業から施設へ）","届いた箱は、まずスタッフの皆さんで1包ずつ試してください。売り場に出すのは、そのあとで大丈夫です。"],["試す（スタッフどうし）","味と、混ぜたときの感じを、一言ずつメモしておきましょう。"],["陳列","お客様の目線の高さに、価格と「鉄を中心にミネラルをイオン化した食品」の一文を。"],["最初の声かけ","「最近、雑誌でも鉄をよく見ませんか？」から。"],["記録","誰に、どの一言で、どうだったか。1週間分たまったら、担当営業と共有を。"]],"point":"回答86社中42社が未販売でした。売る前に、スタッフが体験者になります。サンプルを配るときは、受け取った方の体質・服薬・妊娠の有無を確かめ、配った数を記録します。","back":"","aud":["owner","staff"],"scene":["deal","train"],"topics":["exp"],"scope":"pt","cov":["a12","a1"],"src":"新規（Weekly S2 Vol.01、福岡導入講習の役割分担をもとに作成）","origin":"新規","edit":""},{"id":"T84","kind":"T","sec":"inhouse","key":false,"title":"受付・新人：一言説明とよく聞かれる5問","lines":[["一言で","鉄を中心にミネラルをイオン化した、液体の食品です。"],["「お薬ですか？」","食品です。お薬の代わりではありません。"],["「何がいいの？」","食事で不足しがちな鉄を、毎日続けやすい形で補えるように作られています。"],["「いつ飲むの？」","パッケージの表示どおりに、続けやすいタイミングでどうぞ。"],["「妊娠中でも？」","かかりつけの先生か薬剤師さんに相談してから、にしてください。"],["「いくら？」","1箱30包で5,400円（税別）、税込5,832円です。"],["迷ったら","「詳しい者に代わりますね。」担当スタッフへ。医療機関なら先生・薬剤師へ。"]],"point":"受付は説明しきらなくていい。つなぐ先を決めておきます。","back":"","aud":["staff","c-all"],"scene":["answer","escalate"],"topics":["price","howto"],"scope":"ptc","cov":["a11"],"src":"新規（Weekly S2 Vol.01の新スタッフ向け1枚、Medical Proposal Ⅱをもとに作成）","origin":"新規","edit":""},{"id":"Q01","kind":"Q","sec":"product","key":true,"q":"何にいいの？","short":"食事で不足しがちな鉄を、毎日続けやすい形で補うための食品です。","std":"MINERALionは、鉄を中心に数十種類のミネラルをイオン化して、液体にした食品です。お薬ではないので、何かを治したり、効いたりするものではありません。日本人の鉄の摂取量はこの50年でほぼ半分になっていて、とくに月経のある女性は不足しがちです。その日常の補給に、という位置づけです。","detail":"鉄は、酸素を運ぶ、エネルギーをつくる、体をつくる、と毎日の体の働きに関わる栄養素です。食事の鉄は吸収されにくいものが多く（非ヘム鉄は2〜15%）、食べているつもりでも届いていないことがあります。MINERALionは、体が受け取りやすいイオンの状態にして届ける設計です。感じ方には個人差があります。","point":"「何に効くか」で答えない。何の食品か、で答えます（回答の型 T75）。","back":"","aud":["c-all"],"scene":["answer"],"topics":["brand","hidden"],"scope":"ptc","cov":["a21","a11"],"src":"新規（「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"Q02","kind":"Q","sec":"product","key":false,"q":"鉄の商品なの？","short":"はい。鉄を中心に、数十種類のミネラルを一緒に届ける食品です。","std":"中心は鉄です。1包に鉄が約4〜5mg入っています。それだけでなく、原料の岩石が持っている数十種類のミネラルを、天然のバランスのまま一緒に含んでいます。鉄は単体では働かず、ほかのミネラルと一緒に働くからです。","detail":"主原料のTHEMAROX™は、阿武隈山系の風化花崗岩から生まれたミネラル液です。ロットごとに成分を分析していて、公式サイトで成分表を公開しています。","point":"ブランドの最上位は鉄です（管理者の判断）。「鉄の商品ではない」とは言いません。","back":"","aud":["c-all"],"scene":["answer"],"topics":["mineral","brand"],"scope":"ptc","cov":["a21"],"src":"新規（管理者の判断、「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"Q03","kind":"Q","sec":"product","key":true,"q":"普通の鉄サプリとの違いは？","short":"鉄だけでなく、数十種類のミネラルを一緒に、イオン化して液体で届けるところです。","std":"鉄を単体ではなく、数十種類のミネラルと一緒に、しかも吸収されやすいイオン化の形で設計しているのが特長です。液体の分包なので、そのままでも、水に混ぜても飲めます。","detail":"イオン化は、ミネラルを0.2〜0.5nmの小さなイオンにする工程で、体の入り口（イオンチャネル、約0.3〜0.8nm）に合わせた大きさにしています。吸収率は、イオン化によって90%以上をめざした値で、文献ベースです。","point":"ほかの製品との優劣を比べた試験はないので、比べる言い方はしません（回答の型 T74）。","back":"","aud":["c-all","c-doubt"],"scene":["answer"],"topics":["ion","mineral"],"scope":"ptc","cov":["a21","a24"],"src":"Medical Proposal Ⅱ p.13 Q4を調整／BRAND BOOK p.30","origin":"既存を調整","edit":""},{"id":"Q04","kind":"Q","sec":"product","key":false,"q":"なぜ、いろいろなミネラルが入っているの？","short":"鉄は単体では働かず、ほかのミネラルと一緒に働くからです。","std":"鉄だけを大量に摂ると、亜鉛や銅などほかのミネラルの状態に影響するという報告もあります。MINERALionは、原料の岩石が持つ天然のバランスのまま、数十種類のミネラルを一緒に届ける考え方でつくっています。","detail":"主なミネラルは、鉄・マグネシウム・カリウム・カルシウム・リン・マンガン・ナトリウム・亜鉛など。量はロットごとの成分表で確かめられます。","point":"数を聞かれたら「数十種類」。「50種以上」は使いません（F12）。","back":"","aud":["c-all"],"scene":["answer"],"topics":["mineral"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.17／BRAND BOOK p.14／管理者の判断","origin":"既存を調整","edit":""},{"id":"Q05","kind":"Q","sec":"product","key":false,"q":"THEMAROX™とは？","short":"阿武隈山系の岩から生まれた、天然のミネラル液です。","std":"主原料のTHEMAROX™（シーマロックス）は、福島・阿武隈山系の風化花崗岩から生まれたミネラル液です。薬学博士の嶋西浅男が1977年に確立した製法がもとで、原料には約50年の実績があります。サプリメント分野では、スピックが独占契約しています。","detail":"約5億年かけて風化した花崗岩を細かく砕き、特殊な酸でゆっくり溶かしてイオンにし、何度もろ過して仕上げます。人工的に配合したものではなく、自然のバランスをそのまま活かしています。","point":"","back":"","aud":["c-all","press"],"scene":["answer"],"topics":["origin"],"scope":"ptc","cov":["a21","a16"],"src":"BRAND BOOK p.7・p.28・p.29","origin":"既存","edit":""},{"id":"Q06","kind":"Q","sec":"product","key":false,"q":"なぜ液体なの？","short":"イオンの状態のまま届けるためと、続けやすさのためです。","std":"ミネラルをイオン化した液体なので、錠剤のように溶かす工程を待たない設計です。分包なので持ち歩きやすく、そのままでも、水やジュースに混ぜても飲めます。","detail":"1包10gの液状スティックで、エネルギーは約0.3kcal。水なしでも飲めます。","point":"","back":"","aud":["c-all"],"scene":["answer"],"topics":["ion","taste"],"scope":"ptc","cov":["a21"],"src":"新規（BRAND BOOK p.25、HCL研修 p.16・p.25をもとに作成）","origin":"新規","edit":""},{"id":"Q07","kind":"Q","sec":"product","key":false,"q":"どんな人におすすめ？","short":"食事で鉄が不足しがちな方に。","std":"月経のある方、妊娠を考えている方、汗をよくかく方や運動する方、美容のために内側のケアも考えたい方、食事が偏りがちな方などに、日常の鉄補給としてご案内しています。妊娠・授乳中やお薬を飲んでいる方は、先に先生か薬剤師さんにご相談ください。","detail":"健診で異常がなくても、体にためた鉄（フェリチン）が少ない「隠れ鉄不足」の方もいます。ご自分の状態を知りたい方は、健診のときにフェリチンを測ってもらうとわかります。","point":"","back":"","aud":["c-all"],"scene":["answer"],"topics":["hidden","mens","sport"],"scope":"ptc","cov":["a21"],"src":"新規（基本資料Ⅰのターゲット、HCL研修 p.26をもとに作成）","origin":"新規","edit":""},{"id":"Q08","kind":"Q","sec":"product","key":false,"q":"Lypo-Cとどう違うの？","short":"Lypo-CはビタミンC、MINERALionは鉄を中心としたミネラルです。","std":"Lypo-CはビタミンCをリポソームで、MINERALionは鉄を中心としたミネラルをイオン化して届けます。届け方の技術はちがっても、「体の中で使われやすい状態で届ける」という考え方は同じです。","detail":"組み合わせるなら同じ日に。ただし同じ飲み物には混ぜず、1〜2時間ずらしてください。","point":"","back":"","aud":["c-lypo","inhouse","staff"],"scene":["answer"],"topics":["combo","brand"],"scope":"ptc","cov":["a4","a25"],"src":"Weekly S2 Vol.06","origin":"既存","edit":""},{"id":"Q09","kind":"Q","sec":"effect","key":false,"q":"これで貧血が治る？","short":"食品なので、治すものではありません。","std":"食品なので「治す」ものではありません。日常の鉄補給としてお使いいただくものです。ご心配なら、まず先生にご相談を。","detail":"貧血かどうか、治療が要るかどうかは、採血をもとに先生が判断します。治療にはお薬（鉄剤）が使われます。","point":"","back":"","aud":["c-all"],"scene":["answer"],"topics":["drug"],"scope":"ptc","cov":["a6","a21"],"src":"Medical Proposal Ⅱ p.13 Q3","origin":"既存","edit":""},{"id":"Q10","kind":"Q","sec":"effect","key":false,"q":"量が少ないけど効くの？","short":"「効く」ではなく、毎日の補給の量として設計しています。","std":"鉄をイオン化して吸収されやすくしているので、量は控えめでも日常の補給として設計されています。「摂った量」より「届く量」です。","detail":"処方の鉄剤は1日100〜200mgの治療用量、MINERALionは1包約4〜5mg。役割がちがうので、量も桁がちがいます。","point":"「効く」と答えない。設計の話にとどめます。","back":"","aud":["c-doubt"],"scene":["answer"],"topics":["ion","howto"],"scope":"ptc","cov":["a24"],"src":"Medical Proposal Ⅱ p.13 Q5／BRAND BOOK p.66","origin":"既存","edit":""},{"id":"Q11","kind":"Q","sec":"effect","key":false,"q":"効果はいつ出る？","short":"食品なので、「効果」という言い方はできないんです。","std":"食品なので「効果」という言い方はできませんが、日々の補給としてこつこつ続けていただくものです。","detail":"感じ方は、もともとの鉄の状態や食事、続けた期間で変わります。もともと鉄が足りている方は、変化を感じにくいこともあります。","point":"変化の時期（3時間・3日…）は研修用です（F34）。","back":"","aud":["c-all","c-doubt"],"scene":["answer"],"topics":["brand"],"scope":"ptc","cov":["a24"],"src":"Medical Proposal Ⅱ p.14 Q8／公式FAQ","origin":"既存","edit":""},{"id":"Q12","kind":"Q","sec":"effect","key":false,"q":"どのくらい続ければいい？","short":"続けやすいペースで、習慣にしてください。","std":"日常の栄養補給なので、続けやすいペースで習慣に。体調やご事情に合わせて調整してください。","detail":"ご自分の状態を数字で知りたい方は、血液検査でフェリチンを確かめるのが目安になります（Q14）。","point":"","back":"","aud":["c-all"],"scene":["answer"],"topics":["howto"],"scope":"ptc","cov":["a21"],"src":"Medical Proposal Ⅱ p.14 Q11","origin":"既存","edit":""},{"id":"Q13","kind":"Q","sec":"effect","key":false,"q":"本当に必要？","short":"必ず必要、というものではありません。","std":"必ず必要というものではありません。日常の鉄補給の「選択肢の一つ」です。ご不要なら、無理にとは申しません。","detail":"まず食事が基本です。そのうえで、足りない分を補う方法のひとつとして考えてください。","point":"","back":"","aud":["c-doubt"],"scene":["answer","object"],"topics":["food"],"scope":"ptc","cov":["a24"],"src":"Medical Proposal Ⅱ p.14 Q12","origin":"既存","edit":""},{"id":"Q14","kind":"Q","sec":"effect","key":false,"q":"体感ではなく、数値で確かめる方法は？","short":"血液検査の「フェリチン（貯蔵鉄）」が目安になります。","std":"体の鉄の状態を数値で見たいときは、血液検査で「フェリチン（貯蔵鉄）」を確認するのが目安になるといわれています。ヘモグロビンだけではわかりにくいこともあるので、気になる方はかかりつけの先生にご相談のうえ、フェリチンもあわせて測ってみてください。","detail":"数値の変化には個人差があります。定期的な健診のタイミングで確かめるのがおすすめです。","point":"","back":"","aud":["c-all","c-check"],"scene":["answer"],"topics":["hidden"],"scope":"off","cov":["a21"],"src":"公式FAQ","origin":"既存","edit":""},{"id":"Q15","kind":"Q","sec":"howto","key":false,"q":"いつ飲む？","short":"続けやすいタイミングでどうぞ。","std":"食品なので、続けやすいタイミングで習慣にしてください。目安は、パッケージの表示もご覧くださいね。","detail":"お茶やコーヒーと一緒は避けて、前後30分〜1時間あけてください。Lypo-Cと組み合わせるときは、混ぜずに1〜2時間ずらすのがおすすめです。寝る前に飲んで寝つきが気になる方は、早めの時間か朝に。","point":"1日の目安量とタイミングは確定待ちです（F22）。「朝に1包」「就寝前」などを言い切りません。","back":"","aud":["c-all"],"scene":["answer"],"topics":["howto"],"scope":"ptc","cov":["a21"],"src":"Medical Proposal Ⅱ p.14 Q7／公式FAQ","origin":"既存を調整","edit":""},{"id":"Q16","kind":"Q","sec":"howto","key":true,"q":"1日何包？","short":"パッケージの表示どおりにお願いします。","std":"目安量は、パッケージの表示に沿ってください。鉄は摂りすぎも良くない栄養素なので、たくさん飲めば早く良くなる、というものではありません。","detail":"鉄を含むほかのサプリやお薬を使っている方は、合計の量が重ならないよう、先生か薬剤師さんに確かめてください。","point":"社内の資料には「1日1〜4包」「朝に1包」など5通りの書き方があり、確定待ちです（F22）。決まるまで包数を言い切りません。","back":"","aud":["c-all"],"scene":["answer"],"topics":["howto"],"scope":"ptc","cov":["a21"],"src":"新規（「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"Q17","kind":"Q","sec":"howto","key":false,"q":"味は？","short":"クセが少なく、そのままでも飲めます。","std":"水でそのまま、または炭酸水やジュース（りんご・オレンジ・トマト・にんじんなど）に混ぜる方もいます。お茶やコーヒーと一緒は避けてください。","detail":"ビタミンCを含む飲み物に混ぜると、風味や色が変わることがありますが、品質の問題ではありません。","point":"","back":"","aud":["c-all"],"scene":["answer"],"topics":["taste"],"scope":"ptc","cov":["a21"],"src":"BRAND BOOK p.39–43／HCL研修 p.25","origin":"既存","edit":""},{"id":"Q18","kind":"Q","sec":"howto","key":false,"q":"飲み物に混ぜたら、色が変わった","short":"品質の問題ではありません。","std":"ビタミンCを多く含む飲み物などと混ぜると、成分の組み合わせで風味や見た目が変わることがあります。品質上の問題ではありません。気になる場合は、時間をずらしてお召し上がりください。","detail":"ビタミンCの還元作用で、鉄をはじめとするミネラルとのあいだに反応が起こるためです。ミネラルの量そのものが失われるわけではありません。","point":"","back":"","aud":["c-user"],"scene":["answer"],"topics":["taste","combo"],"scope":"ptc","cov":["a2","a24"],"src":"SpeakEasy 3.0（製品体験）／BRAND BOOK p.40／Weekly S1 Vol.07","origin":"既存","edit":""},{"id":"Q19","kind":"Q","sec":"howto","key":false,"q":"歯みがきのあとに飲んでいい？","short":"はい、歯みがきのあとがおすすめです。","std":"歯みがきのあとに摂っていただくのがおすすめです。口の中に残っても、歯への影響は特にないとされています。","detail":"水なしでも飲みやすい液体なので、「歯みがき→MINERALion」の順で習慣にしやすいです。気になる方は、そのあと軽くうがいを。","point":"","back":"","aud":["c-user"],"scene":["answer"],"topics":["howto"],"scope":"off","cov":["a21"],"src":"公式FAQ","origin":"既存","edit":""},{"id":"Q20","kind":"Q","sec":"howto","key":false,"q":"保存は？ 1箱でどのくらい？","short":"常温で保存できます。1箱は約1ヶ月分です。","std":"常温で保存してください。1箱は10g×30包で、約1ヶ月分です。","detail":"","point":"","back":"","aud":["c-all"],"scene":["answer"],"topics":["howto"],"scope":"ptc","cov":["a21"],"src":"BRAND BOOK p.32","origin":"既存","edit":""},{"id":"Q21","kind":"Q","sec":"safety","key":false,"q":"鉄を摂りすぎない？","short":"1包は鉄約4〜5mg、毎日の補給の量です。","std":"鉄は摂りすぎも良くない栄養素で、余った分は体に溜まります。だから目安量を守っていただくのが安心です。鉄を含むほかのサプリやお薬と重ならないようにしてください。","detail":"処方の鉄剤は1日100〜200mgの治療用量で、MINERALionの1包約4〜5mgはその約30分の1です。日本人の食事摂取基準（2025年版）では鉄の耐容上限量は設定されていませんが、摂りすぎてよいという意味ではありません。","point":"","back":"","aud":["c-doubt"],"scene":["answer"],"topics":["howto","safety"],"scope":"ptc","cov":["a24"],"src":"Medical Proposal Ⅱ p.13 Q6／BRAND BOOK p.33・p.66","origin":"既存を調整","edit":""},{"id":"Q22","kind":"Q","sec":"safety","key":false,"q":"副作用はある？","short":"食品なので「副作用」という言い方はしていませんが、合わないと感じたらお休みしてください。","std":"食品なので、お薬のような「副作用」という言い方はしていません。ただ、体質や体調によって合わないと感じることはあります。たとえば、一度に多く飲むとお通じがゆるくなる方もいます。気になる変化があれば飲むのをお休みして、続くようなら先生にご相談ください。","detail":"体調の変化のご相談は、CSが記録して担当に引き継ぎます（T81）。","point":"「副作用はありません」とは言いません。","back":"","aud":["c-doubt"],"scene":["answer","escalate"],"topics":["safety"],"scope":"ptc","cov":["a24","a2"],"src":"新規（Weekly S2 Vol.06の注意、公式FAQをもとに作成）","origin":"新規","edit":""},{"id":"Q23","kind":"Q","sec":"safety","key":false,"q":"夜中にトイレに起きてしまう","short":"飲む時間を、寝る1〜2時間前にしてみてください。","std":"ミネラルは体の水分バランスに関わる栄養素といわれ、摂り始めの時期は、体が水分量を調整しようとすることがあるとされています。寝る前に水分を多めにとっていると、重なりやすくなることも。気になる場合は、就寝の1〜2時間前に摂る、寝る前の水分を少し控えめにする、などを試してみてください（個人差があります）。","detail":"","point":"","back":"","aud":["c-user"],"scene":["answer"],"topics":["safety"],"scope":"off","cov":["a2"],"src":"公式FAQ","origin":"既存","edit":""},{"id":"Q24","kind":"Q","sec":"safety","key":false,"q":"寝る前に飲んだら、寝つきが悪かった気がする","short":"寝る2時間以上前か、朝に切り替えてみてください。","std":"ご報告は多くありませんが、鉄はエネルギーづくりに関わる栄養素のひとつで、体質によっては摂ったあとに活動的な感じを覚えることがあります。気になる場合は、就寝の2時間以上前にするか、朝に切り替えてみてください。","detail":"","point":"","back":"","aud":["c-user"],"scene":["answer"],"topics":["safety"],"scope":"off","cov":["a2"],"src":"公式FAQ","origin":"既存","edit":""},{"id":"Q25","kind":"Q","sec":"safety","key":false,"q":"アルミニウムが入っているの？","short":"原料が天然の岩石なので、成分表にアルミニウムも載っています。","std":"原料が天然の岩石（花崗岩）なので、成分表にはアルミニウムも載っています。ロットごとの成分表は、公式サイトで公開しています。ご心配な点は、担当から詳しくご説明しますので、お問い合わせください。","detail":"","point":"説明のしかたは確定待ちです（F16）。数字やリスクの話は、品質保証の担当に回します。","back":"基本資料Ⅰはアルミニウム約5.5mg/包（食事からの日常摂取 約1〜10mg/日と同程度）と記載し、StaffEducationの成分一覧はアルミニウムを表示から外しています。JECFAの暫定耐容週間摂取量は体重1kgあたり週2mg（体重50kgで1日あたり約14mg）。1日4包なら約22mgで、食事の分と合わせると超えうるため、1日の目安量（F22）を決めるときに考慮が要ります。","aud":["c-doubt"],"scene":["answer","escalate"],"topics":["safety"],"scope":"ptc","cov":["a24"],"src":"新規（基本資料Ⅰ p.9・p.10の注記をもとに作成）","origin":"新規","edit":""},{"id":"Q26","kind":"Q","sec":"safety","key":false,"q":"天然の岩って、安全なの？","short":"ろ過と安全性試験を経て、製品にしています。","std":"岩石からミネラルを溶かし出して、何度もろ過して不純物を除き、安全性試験を経て製品にしています。成分はロットごとに分析して、公式サイトで公開しています。","detail":"原料のTHEMAROX™には、約50年の実績があります。","point":"","back":"","aud":["c-doubt"],"scene":["answer"],"topics":["origin","safety"],"scope":"ptc","cov":["a24"],"src":"新規（BRAND BOOK p.29、基本資料Ⅰ p.10の注記をもとに作成）","origin":"新規","edit":""},{"id":"Q27","kind":"Q","sec":"people","key":true,"q":"妊娠中・授乳中は？","short":"先に、かかりつけの先生か薬剤師さんに相談してください。","std":"基本は食品ですが、妊娠・授乳中は摂る量に注意が要る時期です。かかりつけの先生・薬剤師にご相談のうえでお使いください。","detail":"妊娠・授乳期は鉄の必要量が増える一方で、摂る量に配慮が要る時期です。治療が必要な貧血は医療が優先です。葉酸など、ほかの栄養素のことも先生にご相談を。","point":"","back":"","aud":["c-preg"],"scene":["answer"],"topics":["preg"],"scope":"ptc","cov":["a22"],"src":"Medical Proposal Ⅱ p.14 Q9／BRAND BOOK p.52","origin":"既存","edit":""},{"id":"Q28","kind":"Q","sec":"people","key":false,"q":"子どもは？","short":"飲めますが、成長期は食事が主役です。","std":"食品なので、お子さまも飲めます。ただ、成長期は食事が主役です。まず食事から、それでも足りない分を補う形で。2歳未満のお子さまは、先生のご指導のもとでお願いします。","detail":"成長期は、血液量が増えるぶん鉄の需要が大きい時期です。運動する子は汗でも鉄を失います。気になる様子があれば、かかりつけの先生にご相談を。","point":"「成長を促す」「背が伸びる」とは言いません。","back":"","aud":["c-kids"],"scene":["answer"],"topics":["kids","food"],"scope":"ptc","cov":["a21"],"src":"Weekly S3 Vol.03・Vol.04／BRAND BOOK p.54","origin":"既存を調整","edit":""},{"id":"Q29","kind":"Q","sec":"people","key":false,"q":"スポーツ選手にも使える？","short":"インフォームドスポーツの認証を取得しています。","std":"MINERALionは、インフォームドスポーツの認証を取得した食品です。競技をされている方は、念のため製品の表示や競技団体の基準もご確認ください。","detail":"汗1Lで鉄は0.3〜0.4mgほど失われるといわれ、運動量の多い方は鉄を使いやすい傾向があります。量は、血液検査でフェリチンを確かめながら、チームドクターやトレーナーと相談するのが安心です。記録や競技力が上がる、というものではありません。","point":"公式FAQの「激しいトレーニングは1日2包」は、1日の目安量が確定するまで使いません（F22）。","back":"","aud":["c-sport","team"],"scene":["answer"],"topics":["sport","cert"],"scope":"ptc","cov":["a18"],"src":"Medical Proposal Ⅱ p.10を調整／公式FAQ","origin":"既存を調整","edit":""},{"id":"Q30","kind":"Q","sec":"people","key":false,"q":"男性は変化を感じにくい？","short":"個人差が大きいと考えられます。","std":"個人差によるところが大きいと考えられます。男性は月経による鉄の消耗が女性より少ない傾向があるため、もともとの状態に差が出やすいといわれています。","detail":"もともと鉄が足りている方は、変化を感じにくいこともあります。","point":"","back":"","aud":["c-men"],"scene":["answer"],"topics":["hidden"],"scope":"off","cov":["a22"],"src":"公式FAQ","origin":"既存を調整","edit":""},{"id":"Q31","kind":"Q","sec":"combo","key":true,"q":"Lypo-Cと一緒に飲んでいい？","short":"同じ日に大丈夫です。混ぜずに、1〜2時間ずらしてください。","std":"同じ日に摂っていただいて大丈夫です。ただ、同じ飲み物に混ぜると、ビタミンCとミネラルが反応して風味や色が変わることがあります（品質の問題ではありません）。Lypo-Cとは混ぜずに、1〜2時間ほどずらすのがおすすめです。","detail":"コラーゲンをつくるには鉄とビタミンCの両方が要る、という点で、組み合わせやすい2つです。","point":"","back":"","aud":["c-lypo","c-user"],"scene":["answer","cross"],"topics":["combo"],"scope":"ptc","cov":["a25"],"src":"BRAND BOOK p.45／Weekly S1 Vol.07","origin":"既存","edit":""},{"id":"Q32","kind":"Q","sec":"combo","key":false,"q":"コーヒーは、どのくらい空ければいい？","short":"前後30分〜1時間ほど空けてください。","std":"コーヒーに含まれるタンニンは、鉄の吸収を妨げる場合があるといわれています。目安として、前後30分〜1時間ほど空けていただくと安心です。","detail":"厳密に気にしすぎる必要はありませんが、「飲んですぐコーヒー」は避けていただくのがおすすめです。お茶（緑茶・紅茶など）も同じです。","point":"","back":"","aud":["c-user","c-all"],"scene":["answer"],"topics":["combo"],"scope":"off","cov":["a21"],"src":"公式FAQ","origin":"既存","edit":""},{"id":"Q33","kind":"Q","sec":"combo","key":false,"q":"一緒に摂らないほうがいいものは？","short":"大量のカルシウム、高用量の亜鉛、お茶・コーヒーは時間をずらして。","std":"大量のカルシウムや高用量の亜鉛は、鉄の吸収と競合することがあるといわれています。お茶・コーヒーなどのタンニンも、吸収を妨げることがあります。","detail":"ビタミンCは鉄の吸収を助けるといわれていますが、Lypo-Cとは混ぜずに時間をずらしてください。","point":"","back":"","aud":["c-user"],"scene":["answer"],"topics":["combo"],"scope":"off","cov":["a21"],"src":"公式FAQを調整","origin":"既存を調整","edit":"公式FAQの「ビタミンCは…むしろ一緒に摂っていただくのがおすすめ」は、Lypo-Cとの時間差の表記にそろえます（整備の資料の改訂）。"},{"id":"Q34","kind":"Q","sec":"combo","key":false,"q":"薬を飲んでいるけど、大丈夫？","short":"処方された先生か薬剤師さんに確かめてください。","std":"お薬によっては、鉄と同時に飲むと吸収に影響するものがあります。処方された先生か薬剤師さんに、MINERALionを見せて確かめていただくのが安心です。","detail":"鉄を含むお薬やサプリをすでに使っている方は、重ならないように確認してください。","point":"","back":"","aud":["c-doubt","c-elder"],"scene":["answer","escalate"],"topics":["combo","safety"],"scope":"ptc","cov":["a24","a6"],"src":"新規（Medical Proposal Ⅱ p.14 Q10をもとに作成）","origin":"新規","edit":""},{"id":"Q35","kind":"Q","sec":"medical","key":true,"q":"鉄剤と何が違うの？","short":"鉄剤は治療のお薬、MINERALionは毎日の補給の食品です。","std":"お薬（鉄剤）は鉄欠乏性貧血を「治療」するため、先生の診断のもとで使うもの。MINERALionはお薬ではなく食品で、鉄を中心に多様なミネラルを配合した「日常の栄養補給」です。役割がそもそも違います。","detail":"量もちがいます。処方の鉄剤は鉄として1日100〜200mgの治療用量、MINERALionは1包約4〜5mgの栄養補給の量です。同じ土俵で比べる製品ではありません。","point":"","back":"","aud":["c-all","c-drug"],"scene":["answer"],"topics":["drug"],"scope":"ptc","cov":["a6","a21"],"src":"Medical Proposal Ⅱ p.13 Q1／BRAND BOOK p.35・p.66","origin":"既存","edit":""},{"id":"Q36","kind":"Q","sec":"medical","key":false,"q":"鉄剤の代わりになる？","short":"なりません。","std":"お薬の代わりにはなりません。治療が必要かは先生のご判断です。「今はお薬が要らない」段階での日常の補給としてお考えください。","detail":"鉄剤が続けにくいときも、自己判断でやめずに、まず先生にご相談ください。","point":"","back":"","aud":["c-drug"],"scene":["answer"],"topics":["drug"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.13 Q2","origin":"既存","edit":""},{"id":"Q37","kind":"Q","sec":"price","key":false,"q":"いくら？ なぜこの価格？","short":"1箱30包で5,400円（税別）、1包あたり180円（税別）です。","std":"主原料のTHEMAROX™は、サプリメント分野でスピックが独占契約している、約50年の実績がある原料です。それをイオン化して液体にする製法にも手間がかかります。1箱30包で5,400円（税別）、税込5,832円です。","detail":"食品なので軽減税率8%です。定期便やお試しの価格は時期によって変わるので、最新のご案内をご覧ください。","point":"値引きの約束はしません（回答の型 T78）。","back":"","aud":["c-all","c-doubt"],"scene":["answer"],"topics":["price"],"scope":"ptc","cov":["a21","a11"],"src":"新規（「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"Q38","kind":"Q","sec":"price","key":false,"q":"他社のミネラル商品との違いは？","short":"他社の製品の評価はしていません。MINERALionの設計をお話ししますね。","std":"MINERALionは、鉄を中心に、原料の岩石が持つ数十種類のミネラルを天然のバランスのまま、イオン化して液体で届ける設計です。原料のTHEMAROX™は、サプリメント分野ではスピックが独占契約している原料です。","detail":"成分はロットごとに分析し、公式サイトで公開しています。","point":"比べる試験をしていないので、「優れている」とは言いません（回答の型 T79）。","back":"","aud":["c-doubt","corp"],"scene":["answer"],"topics":["mineral","origin"],"scope":"ptc","cov":["a24"],"src":"新規","origin":"新規","edit":""},{"id":"O01","kind":"O","sec":"objection","key":false,"q":"「食事で摂ればいいのでは？」","short":"もちろん食事が基本です。","std":"もちろん食事が基本です。ただ鉄は吸収されにくいので、忙しい日の「補い」として食品を使う方も多いですよ。","detail":"野菜や豆に多い非ヘム鉄の吸収率は2〜15%ほどです。","point":"","back":"","aud":["c-doubt","c-all"],"scene":["object"],"topics":["food"],"scope":"ptc","cov":["a24"],"src":"Medical Proposal Ⅱ p.4","origin":"既存","edit":""},{"id":"O02","kind":"O","sec":"objection","key":false,"q":"「病院で調べたほうがいい？」","short":"症状が続くなら、先生にご相談を。","std":"症状が続くようなら、一度先生にご相談を。並行して日常の補給、という形でも大丈夫です。","detail":"","point":"","back":"","aud":["c-all"],"scene":["object","escalate"],"topics":["hidden"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.4","origin":"既存","edit":""},{"id":"O03","kind":"O","sec":"objection","key":false,"q":"「鉄剤の量を減らしていい？」","short":"量や続け方は、先生のご判断です。","std":"量や続け方は先生のご判断です。私からは減らすことはお勧めできませんので、次回ぜひ先生にご相談を。","detail":"","point":"","back":"","aud":["c-drug"],"scene":["object"],"topics":["drug"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.7","origin":"既存","edit":""},{"id":"O04","kind":"O","sec":"objection","key":false,"q":"「（治療中に）薬の代わりになる？」","short":"お薬の代わりではありません。","std":"お薬の代わりではありません。治療は先生の指示どおり続けてください。あくまで日常の補給としてです。","detail":"","point":"","back":"","aud":["c-drug"],"scene":["object"],"topics":["drug"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.7","origin":"既存","edit":""},{"id":"O05","kind":"O","sec":"objection","key":false,"q":"「（フェリチンが低めで）放っておいて大丈夫？」","short":"今すぐ心配という数値ではありません。","std":"今すぐ心配という数値ではありませんが、鉄は減りやすいので、日常で補っておくと安心です。気になる症状が出たら、先生にご相談を。","detail":"","point":"","back":"","aud":["c-check"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.8","origin":"既存","edit":""},{"id":"O06","kind":"O","sec":"objection","key":false,"q":"「（治療が終わって）もう大丈夫だよね？」","short":"先生が終了と判断されたのは良いことです。","std":"先生が終了と判断されたのは良いことです。そのうえで、また足りなくならないよう、日々の補給を、という位置づけですね。","detail":"","point":"","back":"","aud":["c-drug"],"scene":["object"],"topics":["drug"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.9","origin":"既存","edit":""},{"id":"O07","kind":"O","sec":"objection","key":false,"q":"「（献血で引っかかって）貧血ってこと？」","short":"貧血かどうかは、検査でわかることです。","std":"貧血かどうかは検査で分かることなので、気になるなら先生にご相談を。並行して日常の補給を意識するのもよいと思います。","detail":"","point":"","back":"","aud":["c-check"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a6"],"src":"Medical Proposal Ⅱ p.12","origin":"既存","edit":""},{"id":"O08","kind":"O","sec":"objection","key":false,"q":"「“最強”って動画で言ってた」","short":"そうご紹介いただいたと聞いています。","std":"そうご紹介いただいたと聞いています。ありがたいことです。私たちとしては「鉄を中心にミネラルをイオン化して届ける食品」というところまでしか言えないんです。感じ方には個人差がありますので、まずは1包から試してみてください。","detail":"","point":"第三者の表現を、こちらの言葉にしません。期待を整えるのが先です。","back":"","aud":["c-media"],"scene":["object"],"topics":["media"],"scope":"ptc","cov":["a23"],"src":"新規（Weekly 号外をもとに作成）","origin":"新規","edit":""},{"id":"O09","kind":"O","sec":"objection","key":false,"q":"「鉄剤は腸を壊すって聞いた」","short":"鉄剤で胃腸がつらくなる方がいるのは事実です。","std":"お薬の鉄剤で、胃のむかつきや便秘が出る方がいるのは事実です。ただ、鉄剤は治療に必要なお薬なので、合わないと感じたら自己判断でやめずに、まず先生に相談してくださいね。そのうえで、日常の補給には食品という選択肢もあります。","detail":"","point":"鉄剤を悪く言わない。「MINERALionなら胃にやさしい」と比べません。","back":"経口鉄剤は、服用者の約2〜6割で消化器症状、約3〜5割が途中で中断するとされています（BRAND BOOK p.34）。ただし鉄欠乏性貧血の治療の第一選択は鉄剤で、有効性は確立しています。","aud":["c-media","c-drug"],"scene":["object"],"topics":["drug"],"scope":"ptc","cov":["a23"],"src":"新規","origin":"新規","edit":""},{"id":"O10","kind":"O","sec":"objection","key":false,"q":"「サプリって、結局効かないんでしょ？」","short":"「治る」「効く」とは、私たちも言えないんです。","std":"「治る」とか「効く」とは、私たちも言えないんです。食事で不足しがちな鉄を、毎日続けやすい形で補うための食品です。合う・合わないも含めて、無理のない範囲で試していただければと思います。","detail":"","point":"疑う気持ちは、正しい感覚として受け止めます（否定しない）。","back":"","aud":["c-doubt"],"scene":["object"],"topics":["brand"],"scope":"ptc","cov":["a24"],"src":"新規（HCL研修のCS三原則をもとに作成）","origin":"新規","edit":""},{"id":"O11","kind":"O","sec":"objection","key":false,"q":"「高いね」","short":"1包あたり180円（税別）です。","std":"1箱30包で5,400円（税別）なので、1包あたり180円（税別）です。まずは続けやすいかどうか、試しやすい形からご案内しますね。","detail":"","point":"価格を下げる約束はしません。お試し・定期便の条件は最新の案内で（F06）。","back":"","aud":["c-doubt"],"scene":["object"],"topics":["price"],"scope":"ptc","cov":["a24"],"src":"新規（「商品の事実」をもとに作成）","origin":"新規","edit":""},{"id":"O12","kind":"O","sec":"objection","key":false,"q":"「前に飲んだけど、変わらなかった」","short":"感じ方には個人差があります。","std":"感じ方には個人差があって、もともと鉄が足りている方は、変化を感じにくいこともあるんです。気になるなら、健診のときにフェリチンを測ってみると、ご自分の状態がわかりますよ。","detail":"","point":"無理に続けさせない。「続ければ変わる」とは言いません。","back":"","aud":["c-doubt","c-user"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a24","a26"],"src":"新規（公式FAQ、FAQ回答集をもとに作成）","origin":"新規","edit":""},{"id":"O13","kind":"O","sec":"objection","key":false,"q":"「毎日続けられるか不安」","short":"「戻れる場所をつくる」くらいの感覚で大丈夫です。","std":"「毎日きっちり」より、「戻れる場所をつくる」くらいの感覚で大丈夫です。まずは1包から、負担の少ない形で始めてみてください。","detail":"","point":"","back":"","aud":["c-all","c-user"],"scene":["object"],"topics":["howto"],"scope":"ptc","cov":["a26"],"src":"BRAND BOOK p.37を調整","origin":"既存を調整","edit":"原文の「つらい時に戻れる場所」は、つらさへの効き目に聞こえるので外しました。"},{"id":"O14","kind":"O","sec":"objection","key":false,"q":"「イオン化って何？ 怪しくない？」","short":"ミネラルを、とても小さなイオンの状態にしてある、ということです。","std":"ミネラルを、とても小さな粒（0.2〜0.5ナノメートル）のイオンの状態にしてある、ということです。体の入り口に合う大きさにそろえて、吸収されやすい形を目指した設計です。","detail":"原料のTHEMAROX™は、岩石を細かく砕き、特殊な酸でゆっくり溶かしてイオンにしています。","point":"吸収率の数字を出すなら「イオン化によって90%以上をめざした（文献ベース）」まで。","back":"","aud":["c-doubt"],"scene":["object"],"topics":["ion"],"scope":"ptc","cov":["a24"],"src":"新規（BRAND BOOK p.29–30、HCL研修 p.16をもとに作成）","origin":"新規","edit":""},{"id":"O15","kind":"O","sec":"objection","key":false,"q":"「健康だから要らない」","short":"今つらくないのは、ためた鉄がまだ残っているからかもしれません。","std":"今つらくないのは、ためた鉄がまだ残っているからかもしれません。なくなってから整えるより、ある今から保つほうがラクなんです。もちろん、無理にとは申しません。","detail":"","point":"","back":"","aud":["c-all"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.29","origin":"既存","edit":""},{"id":"O16","kind":"O","sec":"objection","key":false,"q":"「健診で異常なしだったから大丈夫」","short":"健診で「異常なし」でも、鉄が足りているとは限らないんです。","std":"健診で見るのはヘモグロビンで、「今、血液で足りているか」なんです。体にためた鉄（フェリチン）は別の数字で、こちらが減っていても「異常なし」と出ることがあります。","detail":"","point":"","back":"","aud":["c-check"],"scene":["object"],"topics":["hidden"],"scope":"ptc","cov":["a21"],"src":"StaffEducation p.28を調整","origin":"既存を調整","edit":""}]}</script><script>(() => {
